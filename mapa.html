<div class="flex-1 flex flex-col relative bg-slate-950 text-xs h-full">

        <i class="fa-solid fa-star transition hover:text-amber-400" data-value="2" onclick="passageiroSelecionarEstrela(2)"></i>

    <div id="passageiro-bloco-justificativa" class="hidden space-y-1">
      <label class="text-[11px] font-bold text-red-400 flex items-center gap-1">
        <i class="fa-solid fa-triangle-exclamation"></i> Motivo da nota baixa (Enviado ao Suporte):

    <button onclick="passageiroConcluirAvaliacao()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition text-xs flex items-center justify-center gap-2">

  <!-- MODAL DE AVISOS INTERNO -->

        Fechar agora

</div>

<script>
  var SUPABASE_URL_MAPA = 'https://mmcwmzesjtnqgpcdspir.supabase.co';
  var SUPABASE_ANON_KEY_MAPA = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tY3dtemVzanRucWdwY2RzcGlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NTgyMzUsImV4cCI6MjExMDAzNDIzNX0.VfOyJpZ5Xl30CvLtP-ZpAl1BO1ijVU8ChpabOPmel-E';
  var supabaseMapa = window.__supabaseMapaInstance || (window.__supabaseMapaInstance = window.supabase ? window.supabase.createClient(SUPABASE_URL_MAPA, SUPABASE_ANON_KEY_MAPA) : null);

  var mapaLeaflet = null;
  var marcadorOrigem = null;
  var marcadorDestino = null;
  var marcadoresParadas = {};
  var polylineRota = null;
  var coordsOrigem = null;
  var coordsDestino = null;
  var coordsParadas = {};
  var formaPagamentoSelecionada = 'PIX';
  var marcadoresMotoristas = {};
  var intervaloRadarMotoristas = null;
  var timerIntervalId = null;
  var modalTimeoutId = null;
  var corridaAtualId = null;
  var corridaAtivaDados = null;
  var canalPassageiroRealtime = null;
  var passageiroNotaSelecionada = 5;
  var ultimaNotificacaoProximidade = false;
  var calculoRotaPronto = false;
  var valorCalculadoAtual = 0;
  var timerBuscaDebounced = {};

  var STATUS_ATIVOS_MAPA_LISTA = [
    'pendente',
    'procurando',
    'aceita',
    'aceito',
    'a_caminho',
    'no_local',
    'em_andamento',
    'em_curso',
    'em_viagem',
    'iniciada',
    'viagem_iniciada'
  ];

  var STATUS_FINALIZADOS_MAPA_LISTA = [
    'concluido',
    'concluida',
    'finalizada',
    'cancelado',
    'cancelada',
    'expirado',
    'expirada'
  ];

  function normalizarStatusLocal(status) {
    return String(status || '').trim().toLowerCase().replace(/\s+/g, '_');
  }

  function primeiroNome(nomeCompleto) {
    if (!nomeCompleto) return 'Motorista';
    return nomeCompleto.trim().split(' ')[0];
  }

  function obterPassageiroAtual() {
    try {
      const rawLogado = localStorage.getItem('passageiro_logado');
      if (rawLogado) {
        const parsed = JSON.parse(rawLogado);
        if (parsed && parsed.id) return parsed;
      }
    } catch (_) {}

    try {
      const rawCache = localStorage.getItem('mobiurb_corrida_ativa_passageiro');
      if (rawCache) {
        const parsedCache = JSON.parse(rawCache);
        if (parsedCache && parsedCache.passageiro_id) {
          return { id: parsedCache.passageiro_id, nome: parsedCache.passageiro_nome || 'Passageiro' };
        }
      }
    } catch (_) {}

    return null;
  }

  function obterCacheCorridaLocal() {
    try {
      const raw = localStorage.getItem('mobiurb_corrida_ativa_passageiro');
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      const corrida = parsed && parsed.corrida ? parsed.corrida : null;
      if (!corrida || !corrida.id) return null;
      const st = normalizarStatusLocal(corrida.status);
      if (STATUS_FINALIZADOS_MAPA_LISTA.includes(st)) return null;
      return corrida;
    } catch (_) {
      return null;
    }
  }

  function salvarCacheCorridaNoMapa(corrida) {
    try {
      const st = normalizarStatusLocal(corrida?.status);
      if (!corrida || !corrida.id || STATUS_FINALIZADOS_MAPA_LISTA.includes(st)) {
        localStorage.removeItem('mobiurb_corrida_ativa_passageiro');
        window.corridaAtivaPassageiro = null;
        return;
      }
      window.corridaAtivaPassageiro = corrida;
      const passAtual = obterPassageiroAtual();
      localStorage.setItem('mobiurb_corrida_ativa_passageiro', JSON.stringify({
        passageiro_id: corrida.passageiro_id || passAtual?.id || null,
        passageiro_nome: passAtual?.nome || 'Passageiro',
        corrida
      }));
    } catch (_) {}
  }

  function temCorridaAtivaEmMemoriaOuCache() {
    const cache = obterCacheCorridaLocal();
    const ativa = corridaAtivaDados || window.corridaAtivaPassageiro || cache;
    if (!ativa || !ativa.id) return false;
    const st = normalizarStatusLocal(ativa.status);
    return !STATUS_FINALIZADOS_MAPA_LISTA.includes(st);
  }

  function exibirPainelCorridaEmTelaNoMapa(corrida) {
    if (!corrida || !corrida.id) return;

    const statusNorm = normalizarStatusLocal(corrida.status);
    if (STATUS_FINALIZADOS_MAPA_LISTA.includes(statusNorm)) {
      salvarCacheCorridaNoMapa(null);
      return;
    }

    corridaAtualId = corrida.id;
    corridaAtivaDados = corrida;
    window.corridaAtualId = corrida.id;
    window.corridaAtivaDados = corrida;
    salvarCacheCorridaNoMapa(corrida);

    if (typeof window.vincularCorridaComunicacaoPassageiro === 'function') {
      window.vincularCorridaComunicacaoPassageiro(corrida);
    }

    const painelSol = document.getElementById('painel-solicitacao');
    const painelAval = document.getElementById('painel-avaliacao-passageiro');
    if (painelSol) {
      painelSol.classList.add('hidden');
      painelSol.style.display = 'none';
    }
    if (painelAval) {
      painelAval.classList.add('hidden');
      painelAval.style.display = 'none';
    }

    if (['procurando', 'pendente'].includes(statusNorm)) {
      const painelMot = document.getElementById('painel-motorista-encontrado');
      const painelEsp = document.getElementById('painel-espera-corrida');
      if (painelMot) {
        painelMot.classList.add('hidden');
        painelMot.style.display = 'none';
      }
      if (painelEsp) {
        painelEsp.classList.remove('hidden');
        painelEsp.style.display = '';
      }
      if (typeof iniciarTimerEsperaCorrida === 'function') {
        iniciarTimerEsperaCorrida();
      }
    } else {
      const painelEsp = document.getElementById('painel-espera-corrida');
      const painelMot = document.getElementById('painel-motorista-encontrado');
      if (painelEsp) {
        painelEsp.classList.add('hidden');
        painelEsp.style.display = 'none';
      }
      if (painelMot) {
        painelMot.classList.remove('hidden');
        painelMot.style.display = '';
      }

      const nomeMot = primeiroNome(corrida.motorista?.nome || window.estadoViagemPassageiro?.motoristaNome || 'Motorista');
      const nomeEl = document.getElementById('passageiro-motorista-nome');
      const fotoEl = document.getElementById('passageiro-motorista-foto');
      const notaEl = document.getElementById('passageiro-motorista-nota');
      const statusEl = document.getElementById('passageiro-status-viagem-texto');
      const origemEl = document.getElementById('pass-ativa-origem');
      const destinoEl = document.getElementById('pass-ativa-destino');
      const paradaEl = document.getElementById('pass-ativa-parada');
      const blocoParada = document.getElementById('bloco-parada-ativa-container');
      const btnCancelar = document.getElementById('btn-cancelar-passageiro-ativo');
      const blocoEmbarque = document.getElementById('bloco-embarque-container');

      const fotoUrl = String(
        corrida.motorista?.foto_url ||
        corrida.motorista?.foto ||
        corrida.motorista?.avatar_url ||
        window.estadoViagemPassageiro?.motoristaFoto ||
        ''
      ).trim() || `https://ui-avatars.com/api/?name=${encodeURIComponent(nomeMot)}&background=059669&color=ffffff`;

      if (nomeEl) nomeEl.innerText = nomeMot;
      if (fotoEl) {
        fotoEl.onerror = function () {
          this.onerror = null;
          this.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(nomeMot)}&background=059669&color=ffffff`;
        };
        fotoEl.src = fotoUrl;
      }
      if (notaEl) notaEl.innerText = corrida.motorista?.avaliacao || corrida.motorista?.nota || window.estadoViagemPassageiro?.motoristaNota || '5.0';
      if (origemEl) origemEl.innerText = corrida.origem || corrida.origem_endereco || '-';
      if (destinoEl) destinoEl.innerText = corrida.destino || corrida.destino_endereco || '-';

      const textoParada = corrida.parada || corrida.parada_endereco || '';
      if (textoParada) {
        if (paradaEl) paradaEl.innerText = textoParada;
        blocoParada?.classList.remove('hidden');
      } else {
        blocoParada?.classList.add('hidden');
      }

      const emAndamento = ['em_andamento', 'em_curso', 'em_viagem', 'iniciada', 'viagem_iniciada'].includes(statusNorm);
      if (emAndamento) {
        if (statusEl) statusEl.innerText = 'Viagem em andamento';
        btnCancelar?.classList.add('hidden');
        if (blocoEmbarque) blocoEmbarque.style.display = 'none';
      } else {
        if (statusEl) {
          statusEl.innerText = statusNorm === 'no_local'
            ? 'Motorista no local de embarque'
            : 'Motorista a caminho';
        }
        btnCancelar?.classList.remove('hidden');
        if (blocoEmbarque) blocoEmbarque.style.display = 'block';
      }

      if (typeof atualizarIlustracaoJornada === 'function') {
        atualizarIlustracaoJornada(statusNorm);
      }
    }
  }

  async function consultarCorridaAtivaDiretoNoBanco() {
    const pass = obterPassageiroAtual();
    const cacheLocal = obterCacheCorridaLocal();
    const cliente = supabaseMapa || window.supabaseClient || null;

    if (cacheLocal && cacheLocal.id) {
      exibirPainelCorridaEmTelaNoMapa(cacheLocal);
    }

    if (!pass?.id || !cliente) {
      return cacheLocal;
    }

    try {
      const { data, error } = await cliente
        .from('corridas')
        .select('*')
        .eq('passageiro_id', pass.id)
        .order('id', { ascending: false })
        .limit(5);

      if (!error && Array.isArray(data) && data.length > 0) {
        const corridaAtiva = data.find((c) => {
          const st = normalizarStatusLocal(c.status);
          return STATUS_ATIVOS_MAPA_LISTA.includes(st);
        });

        if (corridaAtiva) {
          if (corridaAtiva.motorista_id) {
            const { data: motRow } = await cliente
              .from('usuarios')
              .select('*')
              .eq('id', corridaAtiva.motorista_id)
              .maybeSingle();
            if (motRow) {
              corridaAtiva.motorista = motRow;
            }
          }
          exibirPainelCorridaEmTelaNoMapa(corridaAtiva);
          return corridaAtiva;
        }

        const ultimaCorrida = data[0];
        const stUltima = normalizarStatusLocal(ultimaCorrida?.status);
        if (['cancelado', 'cancelada', 'expirado', 'expirada'].includes(stUltima)) {
          salvarCacheCorridaNoMapa(null);
        }
      }
    } catch (_) {}

    return cacheLocal;
  }

  function abrirChatViagemPassageiro() {
    const idCorrida = corridaAtualId || corridaAtivaDados?.id || window.estadoViagemPassageiro?.corridaId;
    const nomeMot = primeiroNome(
      corridaAtivaDados?.motorista?.nome ||
      window.estadoViagemPassageiro?.motoristaNome ||
      document.getElementById('passageiro-motorista-nome')?.innerText ||
      'Motorista'
    );
    const outroId = corridaAtivaDados?.motorista_id || window.estadoViagemPassageiro?.motoristaId || null;

    if (!idCorrida) {
      mostrarModal('Aviso', 'Nenhuma corrida ativa para abrir o chat.', 'cancelar', 2500);
      return;
    }

    if (typeof window.zerarBadgeChatPassageiro === 'function') {
      window.zerarBadgeChatPassageiro();
    }

    if (typeof window.abrirChatCorrida === 'function') {
      window.abrirChatCorrida(idCorrida, nomeMot, outroId);
    }
  }

  function iniciarChamadaVozPassageiro() {
    const idCorrida = corridaAtualId || corridaAtivaDados?.id || window.estadoViagemPassageiro?.corridaId;
    const nomeMot = primeiroNome(
      corridaAtivaDados?.motorista?.nome ||
      window.estadoViagemPassageiro?.motoristaNome ||
      document.getElementById('passageiro-motorista-nome')?.innerText ||
      'Motorista'
    );
    const outroId = corridaAtivaDados?.motorista_id || window.estadoViagemPassageiro?.motoristaId || null;

    if (!idCorrida) {
      mostrarModal('Aviso', 'Nenhuma corrida ativa para iniciar chamada.', 'cancelar', 2500);
      return;
    }

    if (typeof window.iniciarChamadaP2P === 'function') {
      window.iniciarChamadaP2P({
        corridaId: idCorrida,
        outroUsuarioId: outroId,
        outroNome: nomeMot
      });
    }
  }

  async function aplicarEstadoCorridaAtivaNoMapa(corridaRecebida = null) {
    const corrida = corridaRecebida || corridaAtivaDados || window.corridaAtivaPassageiro || obterCacheCorridaLocal() || null;

    if (corrida && corrida.id) {
      exibirPainelCorridaEmTelaNoMapa(corrida);
    }

    if (typeof window.verificarCorridaAtivaPassageiro === 'function') {
      await window.verificarCorridaAtivaPassageiro();
    } else {
      await consultarCorridaAtivaDiretoNoBanco();
    }

    const corridaFinal = corridaAtivaDados || window.corridaAtivaPassageiro || obterCacheCorridaLocal() || null;
    if (corridaFinal && corridaFinal.id) {
      exibirPainelCorridaEmTelaNoMapa(corridaFinal);
    }
  }

  window.aplicarEstadoCorridaAtivaNoMapa = aplicarEstadoCorridaAtivaNoMapa;

  if (!window.__listenerCorridaAtivaMapaRegistrado) {
    window.__listenerCorridaAtivaMapaRegistrado = true;
    window.addEventListener('corridaAtivaAtualizada', (e) => {
      aplicarEstadoCorridaAtivaNoMapa(e?.detail?.corrida || null);
    });
  }

  if (window.__intervaloSyncMapaPassageiro) {
    clearInterval(window.__intervaloSyncMapaPassageiro);
    window.__intervaloSyncMapaPassageiro = null;
  }

  function atualizarEstadoBotaoChamar(estado, textoCustomizado = '') {
    if (estado === 'bloqueado' && temCorridaAtivaEmMemoriaOuCache()) {
      return;
    }

    const btn = document.getElementById('btn-chamar-motorista');
    if (!btn) return;

    if (estado === 'pronto') {
      calculoRotaPronto = true;
      btn.disabled = false;
      btn.className = 'w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2 cursor-pointer';
      btn.innerHTML = `<i class="fa-solid fa-car-side"></i> <span>Chamar Motorista (${document.getElementById('valor-estimado').innerText})</span>`;
    } else if (estado === 'calculando') {
      calculoRotaPronto = false;
      btn.disabled = true;
      btn.className = 'w-full bg-slate-800 text-amber-400 cursor-wait font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2 border border-amber-500/30';
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>${textoCustomizado || 'Calculando rota e valor...'}</span>`;
    } else {
      calculoRotaPronto = false;
      btn.disabled = true;
      btn.className = 'w-full bg-slate-800 text-slate-500 cursor-not-allowed font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2';
      btn.innerHTML = `<i class="fa-solid fa-route"></i> <span>${textoCustomizado || 'Preencha origem e destino'}</span>`;
      document.getElementById('bloco-estimativa')?.classList.add('hidden');
      if (polylineRota && mapaLeaflet) {
        mapaLeaflet.removeLayer(polylineRota);
        polylineRota = null;
      }
    }
  }

  function tocarSom(tipo) {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const agora = audioCtx.currentTime;

      if (tipo === 'sucesso') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, agora);
        osc.frequency.exponentialRampToValueAtTime(880, agora + 0.15);
        gain.gain.setValueAtTime(0.15, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.3);
        osc.start(agora);
        osc.stop(agora + 0.3);
      } else if (tipo === 'cancelar') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, agora);
        osc.frequency.exponentialRampToValueAtTime(293.66, agora + 0.2);
        gain.gain.setValueAtTime(0.2, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.35);
        osc.start(agora);
        osc.stop(agora + 0.35);
      }
    } catch (e) {}
  }

  function mostrarModal(titulo, mensagem, tipo = 'sucesso', duracaoMs = 3500) {
    const modal = document.getElementById('modal-aviso');
    const iconeDiv = document.getElementById('modal-icone');
    const tituloEl = document.getElementById('modal-titulo');
    const msgEl = document.getElementById('modal-mensagem');

    tituloEl.innerText = titulo;
    msgEl.innerText = mensagem;

    if (tipo === 'sucesso') {
      tocarSom('sucesso');
      iconeDiv.className = 'w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/40';
      iconeDiv.innerHTML = '<i class="fa-solid fa-car-side"></i>';
    } else {
      tocarSom('cancelar');
      iconeDiv.className = 'w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl bg-red-500/20 text-red-400 border border-red-500/40';
      iconeDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
    }

    modal.classList.remove('hidden');

    if (modalTimeoutId) clearTimeout(modalTimeoutId);
    modalTimeoutId = setTimeout(() => {
      fecharModalAviso();
    }, duracaoMs);
  }

  function fecharModalAviso() {
    if (modalTimeoutId) clearTimeout(modalTimeoutId);
    document.getElementById('modal-aviso')?.classList.add('hidden');
  }

  function centralizarNoUsuario() {
    const inputOrigem = document.getElementById('origem-corrida');
    const campoOrigemVazio = !inputOrigem || inputOrigem.value.trim() === '';

    if (campoOrigemVazio || !coordsOrigem) {
      usarMinhaLocalizacao(true);
      return;
    }

    if (coordsOrigem && mapaLeaflet) {
      mapaLeaflet.setView([coordsOrigem.lat, coordsOrigem.lng], 16);
    }
  }

  function selecionarPagamento(tipo) {
    formaPagamentoSelecionada = tipo;
    const btnPix = document.getElementById('btn-pay-pix');
    const btnDinheiro = document.getElementById('btn-pay-dinheiro');

    if (tipo === 'PIX') {
      btnPix.className = 'bg-emerald-600/20 border border-emerald-500 text-emerald-400 font-bold py-2 rounded-xl text-center transition flex items-center justify-center gap-2';
      btnDinheiro.className = 'bg-slate-950 border border-slate-800 text-slate-400 font-bold py-2 rounded-xl text-center transition flex items-center justify-center gap-2 hover:border-slate-700';
    } else {
      btnDinheiro.className = 'bg-emerald-600/20 border border-emerald-500 text-emerald-400 font-bold py-2 rounded-xl text-center transition flex items-center justify-center gap-2';
      btnPix.className = 'bg-slate-950 border border-slate-800 text-slate-400 font-bold py-2 rounded-xl text-center transition flex items-center justify-center gap-2 hover:border-slate-700';
    }
  }

  function usarMinhaLocalizacao(forcarPreenchimento = true) {
    const inputOrigem = document.getElementById('origem-corrida');
    if (forcarPreenchimento && inputOrigem && !temCorridaAtivaEmMemoriaOuCache()) {
      inputOrigem.placeholder = 'Localizando via GPS...';
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          coordsOrigem = { lat, lng };

          if (mapaLeaflet && !temCorridaAtivaEmMemoriaOuCache()) {
            mapaLeaflet.setView([lat, lng], 16);
            if (marcadorOrigem) mapaLeaflet.removeLayer(marcadorOrigem);
            marcadorOrigem = L.marker([lat, lng]).addTo(mapaLeaflet).bindPopup('Local de Embarque').openPopup();
          }

          if (forcarPreenchimento && inputOrigem) {
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
              const data = await res.json();
              inputOrigem.value = (data && data.display_name) ? data.display_name : `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            } catch (e) {
              inputOrigem.value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            }
            inputOrigem.placeholder = 'Local de embarque';
          }

          if (!temCorridaAtivaEmMemoriaOuCache() && typeof verificarECalcularSePronto === 'function') {
            verificarECalcularSePronto();
          }
        },
        () => {
          if (inputOrigem) inputOrigem.placeholder = 'Local de embarque';
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    } else if (inputOrigem) {
      inputOrigem.placeholder = 'Local de embarque';
    }
  }

  function carregarScriptSequencial(src) {
    return new Promise((resolve) => {
      const jaExiste = Array.from(document.scripts).some((s) => (s.src || '').includes(src));
      if (jaExiste && (
        (src === 'mapa_regras.js' && typeof window.carregarRegrasMapa === 'function') ||
        (src === 'mapa_rotas.js' && typeof window.verificarECalcularSePronto === 'function') ||
        (src === 'mapa_corrida.js' && typeof window.verificarCorridaAtivaPassageiro === 'function')
      )) {
        resolve();
        return;
      }

      const s = document.createElement('script');
      s.src = `${src}?v=${Date.now()}`;
      s.setAttribute('data-modulo-mapa-script', 'true');
      s.onload = () => resolve();
      s.onerror = () => resolve();
      document.body.appendChild(s);
    });
  }

  async function carregarScriptsMapa(callback) {
    const scripts = ['mapa_regras.js', 'mapa_rotas.js', 'mapa_corrida.js'];
    for (let i = 0; i < scripts.length; i++) {
      await carregarScriptSequencial(scripts[i]);
    }
    if (typeof callback === 'function') callback();
  }

  async function inicializarMapa() {
    const containerMapa = document.getElementById('map');
    if (!containerMapa) return;

    const corridaPrevia = await consultarCorridaAtivaDiretoNoBanco();

    if (mapaLeaflet && mapaLeaflet.getContainer && mapaLeaflet.getContainer() !== containerMapa) {
      try { mapaLeaflet.remove(); } catch (_) {}
      mapaLeaflet = null;
      marcadorOrigem = null;
      marcadorDestino = null;
      marcadoresParadas = {};
      polylineRota = null;
    }

    if (!mapaLeaflet) {
      const latLaguna = -28.4811;
      const lngLaguna = -48.7811;

      mapaLeaflet = L.map('map', { zoomControl: false }).setView([latLaguna, lngLaguna], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(mapaLeaflet);

      setTimeout(() => mapaLeaflet && mapaLeaflet.invalidateSize(), 300);

      if (!corridaPrevia && !temCorridaAtivaEmMemoriaOuCache()) {
        atualizarEstadoBotaoChamar('bloqueado');
      }

      if (typeof carregarRegrasMapa === 'function') {
        await carregarRegrasMapa(supabaseMapa);
      }

      usarMinhaLocalizacao(!corridaPrevia && !temCorridaAtivaEmMemoriaOuCache());
      if (typeof iniciarRadarMotoristasOnline === 'function') iniciarRadarMotoristasOnline();
    } else {
      mapaLeaflet.invalidateSize();
    }

    await aplicarEstadoCorridaAtivaNoMapa(corridaPrevia);
  }

  carregarScriptsMapa(() => {
    setTimeout(inicializarMapa, 50);
  });
</script>
