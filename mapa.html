<div class="flex-1 flex flex-col relative bg-slate-950 text-xs">
  <!-- CONTAINER DO MAPA LEAFLET -->
  <div id="map" class="flex-1 w-full h-full z-0"></div>

  <!-- PAINEL FLUTUANTE DE SOLICITAÇÃO DE CORRIDA -->
  <div class="absolute bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-4 rounded-t-3xl shadow-2xl z-10 space-y-3">
    <div class="space-y-2">
      <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 p-2.5 rounded-xl">
        <i class="fa-solid fa-circle-dot text-emerald-500"></i>
        <input type="text" id="origem-corrida" placeholder="Local de embarque" class="w-full bg-transparent text-slate-100 focus:outline-none placeholder-slate-500">
      </div>
      <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 p-2.5 rounded-xl">
        <i class="fa-solid fa-location-dot text-amber-500"></i>
        <input type="text" id="destino-corrida" placeholder="Para onde vamos?" class="w-full bg-transparent text-slate-100 focus:outline-none placeholder-slate-500">
      </div>
    </div>

    <div class="flex justify-between items-center px-1">
      <span class="text-slate-400">Estimativa (PIX)</span>
      <span id="valor-estimado" class="text-sm font-extrabold text-emerald-400">R$ 14,90</span>
    </div>

    <button onclick="chamarMotorista()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-car-side"></i> Chamar Motorista
    </button>
  </div>
</div>

<script>
  let mapaLeaflet = null;

  function inicializarMapa() {
    if (mapaLeaflet) {
      mapaLeaflet.invalidateSize();
      return;
    }

    // Coordenadas centrais de Laguna - SC
    const latLaguna = -28.4811;
    const lngLaguna = -48.7811;

    mapaLeaflet = L.map('map', { zoomControl: false }).setView([latLaguna, lngLaguna], 14);

    // Camada de mapa escuro (CartoDB Dark Matter) compatível com o tema
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(mapaLeaflet);
  }

  function chamarMotorista() {
    const origem = document.getElementById('origem-corrida').value;
    const destino = document.getElementById('destino-corrida').value;
    
    if (!origem || !destino) {
      alert('Por favor, preencha a origem e o destino.');
      return;
    }

    console.log("Solicitando corrida de:", origem, "para:", destino);
    alert('Buscando motorista mais próximo em Laguna...');
  }
</script>
