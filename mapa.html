<script>

  function primeiroNome(nomeCompleto) {
    if (!nomeCompleto) return 'Motorista';
    return nomeCompleto.trim().split(' ')[0];
  }

  function abrirChatViagemPassageiro() {
    const idCorrida = corridaAtualId || corridaAtivaDados?.id;
    const nomeMot = primeiroNome(corridaAtivaDados?.motorista?.nome || document.getElementById('passageiro-motorista-nome')?.innerText || 'Motorista');
    const outroId = corridaAtivaDados?.motorista_id || null;

    if (!idCorrida) {
      mostrarModal('Aviso', 'Nenhuma corrida ativa para abrir o chat.', 'cancelar', 2500);
      return;
    }

    if (typeof window.abrirChatCorrida === 'function') {
      window.abrirChatCorrida(idCorrida, nomeMot, outroId);
    } else {
      mostrarModal('Chat', 'Modal de chat não encontrado nesta página.', 'cancelar', 2500);
    }
  }

  function iniciarChamadaVozPassageiro() {
    const idCorrida = corridaAtualId || corridaAtivaDados?.id;
    const nomeMot = primeiroNome(corridaAtivaDados?.motorista?.nome || document.getElementById('passageiro-motorista-nome')?.innerText || 'Motorista');
    const outroId = corridaAtivaDados?.motorista_id || null;

    if (!idCorrida) {
      mostrarModal('Aviso', 'Nenhuma corrida ativa para iniciar chamada.', 'cancelar', 2500);
      return;
    }

    if (typeof window.iniciarChamadaP2P === 'function') {
      window.iniciarChamadaP2P({
        corridaId: idCorrida,
        outroUsuarioId: outroId,
        outroNome: nomeMot,
        papelLocal: 'passageiro'
      });
    } else {
      mostrarModal('Chamada de Voz P2P', `Ligação P2P com ${nomeMot} será conectada na próxima etapa.`, 'sucesso', 3000);
    }
  }

  function atualizarEstadoBotaoChamar(estado, textoCustomizado = '') {
    const btn = document.getElementById('btn-chamar-motorista');
    if (!btn) return;

    if (estado === 'pronto') {
      calculoRotaPronto = true;
      btn.disabled = false;
      btn.className = 'w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2 cursor-pointer';
      btn.innerHTML = `<i class="fa-solid fa-car-side"></i> <span>Chamar Motorista (${document.getElementById('valor-estimado').innerText})</span>`;
    } else if (estado === 'calculando') {
      calculoRotaPronto = false;
      btn.disabled = true;
      btn.className = 'w-full bg-slate-800 text-amber-400 cursor-wait font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2 border border-amber-500/30';
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>${textoCustomizado || 'Calculando rota e valor...'}</span>`;
    } else {
      calculoRotaPronto = false;
      btn.disabled = true;
      btn.className = 'w-full bg-slate-800 text-slate-500 cursor-not-allowed font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2';
      btn.innerHTML = `<i class="fa-solid fa-route"></i> <span>${textoCustomizado || 'Preencha origem e destino'}</span>`;
      document.getElementById('bloco-estimativa').classList.add('hidden');
      if (polylineRota && mapaLeaflet) {
        mapaLeaflet.removeLayer(polylineRota);
        polylineRota = null;
      }
    }
  }

  function tocarSom(tipo) {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const agora = audioCtx.currentTime;

      if (tipo === 'sucesso') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, agora);
        osc.frequency.exponentialRampToValueAtTime(880, agora + 0.15);
        gain.gain.setValueAtTime(0.15, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.3);
        osc.start(agora);
        osc.stop(agora + 0.3);
      } else if (tipo === 'cancelar') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, agora);
        osc.frequency.exponentialRampToValueAtTime(293.66, agora + 0.2);
        gain.gain.setValueAtTime(0.2, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.35);
        osc.start(agora);
        osc.stop(agora + 0.35);
      }
    } catch (e) {}
  }

  function mostrarModal(titulo, mensagem, tipo = 'sucesso', duracaoMs = 3500) {
    const modal = document.getElementById('modal-aviso');
    const iconeDiv = document.getElementById('modal-icone');
    const tituloEl = document.getElementById('modal-titulo');
    const msgEl = document.getElementById('modal-mensagem');

    tituloEl.innerText = titulo;
    msgEl.innerText = mensagem;

    if (tipo === 'sucesso') {
      tocarSom('sucesso');
      iconeDiv.className = 'w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/40';
      iconeDiv.innerHTML = '<i class="fa-solid fa-car-side"></i>';
    } else {
      tocarSom('cancelar');
      iconeDiv.className = 'w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl bg-red-500/20 text-red-400 border border-red-500/40';
      iconeDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
    }

    modal.classList.remove('hidden');

    if (modalTimeoutId) clearTimeout(modalTimeoutId);
    modalTimeoutId = setTimeout(() => {
      fecharModalAviso();
    }, duracaoMs);
  }

  function fecharModalAviso() {
    if (modalTimeoutId) clearTimeout(modalTimeoutId);
    document.getElementById('modal-aviso').classList.add('hidden');
  }

  function centralizarNoUsuario() {
    const inputOrigem = document.getElementById('origem-corrida');
    const campoOrigemVazio = !inputOrigem || inputOrigem.value.trim() === '';

    if (campoOrigemVazio || !coordsOrigem) {
      usarMinhaLocalizacao(true);
      return;
    }

    if (coordsOrigem && mapaLeaflet) {
      mapaLeaflet.setView([coordsOrigem.lat, coordsOrigem.lng], 16);
    }
  }

  function selecionarPagamento(tipo) {
    formaPagamentoSelecionada = tipo;
    const btnPix = document.getElementById('btn-pay-pix');
    const btnDinheiro = document.getElementById('btn-pay-dinheiro');

    if (tipo === 'PIX') {
      btnPix.className = 'bg-emerald-600/20 border border-emerald-500 text-emerald-400 font-bold py-2 rounded-xl text-center transition flex items-center justify-center gap-2';
      btnDinheiro.className = 'bg-slate-950 border border-slate-800 text-slate-400 font-bold py-2 rounded-xl text-center transition flex items-center justify-center gap-2 hover:border-slate-700';
    } else {
      btnDinheiro.className = 'bg-emerald-600/20 border border-emerald-500 text-emerald-400 font-bold py-2 rounded-xl text-center transition flex items-center justify-center gap-2';
      btnPix.className = 'bg-slate-950 border border-slate-800 text-slate-400 font-bold py-2 rounded-xl text-center transition flex items-center justify-center gap-2 hover:border-slate-700';
    }
  }

  function usarMinhaLocalizacao(forcarPreenchimento = true) {
    const inputOrigem = document.getElementById('origem-corrida');
    if (forcarPreenchimento && inputOrigem) {
      inputOrigem.placeholder = 'Localizando via GPS...';
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          coordsOrigem = { lat, lng };

          if (mapaLeaflet) {
            mapaLeaflet.setView([lat, lng], 16);
            if (marcadorOrigem) mapaLeaflet.removeLayer(marcadorOrigem);
            marcadorOrigem = L.marker([lat, lng]).addTo(mapaLeaflet).bindPopup('Local de Embarque').openPopup();
          }

          if (forcarPreenchimento && inputOrigem) {
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
              const data = await res.json();
              inputOrigem.value = (data && data.display_name) ? data.display_name : `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            } catch (e) {
              inputOrigem.value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            }
            inputOrigem.placeholder = 'Local de embarque';
          }

          verificarECalcularSePronto();
        },
        () => {
          if (inputOrigem) inputOrigem.placeholder = 'Local de embarque';
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    } else if (inputOrigem) {
      inputOrigem.placeholder = 'Local de embarque';
    }
  }

  function carregarScriptsMapa(callback) {
    const scripts = ['mapa_regras.js', 'mapa_rotas.js', 'mapa_corrida.js'];
    let idx = 0;

    function proximo() {
      if (idx >= scripts.length) {
        if (typeof callback === 'function') callback();
        return;
      }
      const src = scripts[idx++];
      if (document.querySelector(`script[src="${src}"]`)) {
        proximo();
        return;
      }
      const s = document.createElement('script');
      s.src = src;
      s.onload = proximo;
      s.onerror = proximo;
      document.body.appendChild(s);
    }

    proximo();
  }

  async function inicializarMapa() {
    if (mapaLeaflet) {
      mapaLeaflet.invalidateSize();
      return;
    }

    const latLaguna = -28.4811;
    const lngLaguna = -48.7811;

    mapaLeaflet = L.map('map', { zoomControl: false }).setView([latLaguna, lngLaguna], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(mapaLeaflet);

    setTimeout(() => mapaLeaflet.invalidateSize(), 300);
    atualizarEstadoBotaoChamar('bloqueado');

    if (typeof carregarRegrasMapa === 'function') {
      await carregarRegrasMapa(supabaseMapa);
    }

    usarMinhaLocalizacao(true);
    if (typeof iniciarRadarMotoristasOnline === 'function') iniciarRadarMotoristasOnline();
    if (typeof verificarCorridaAtivaPassageiro === 'function') verificarCorridaAtivaPassageiro();
  }

  carregarScriptsMapa(() => {
    setTimeout(inicializarMapa, 100);
  });
</script>
