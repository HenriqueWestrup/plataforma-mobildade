<script>
  // Variáveis globais do mapa e corrida do passageiro
  let mapaInstancia = null;
  let marcadorOrigem = null;
  let marcadorDestino = null;
  let marcadorMotorista = null;
  let rotaPolyline = null;
  let corridaAtualId = null;
  let canalPassageiroRealtime = null;
  let timerEsperaInterval = null;
  let segundosEspera = 0;
  let avaliacaoSelecionadaPassageiro = 5;

  // Função auxiliar para disparar sons (se houver no contexto)
  function tocarSom(tipo) {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const agora = audioCtx.currentTime;

      if (tipo === 'sucesso' || tipo === 'concluido') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, agora);
        osc.frequency.setValueAtTime(659.25, agora + 0.15);
        gain.gain.setValueAtTime(0.2, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.4);
        osc.start(agora);
        osc.stop(agora + 0.4);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, agora);
        osc.frequency.exponentialRampToValueAtTime(120, agora + 0.35);
        gain.gain.setValueAtTime(0.2, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.4);
        osc.start(agora);
        osc.stop(agora + 0.4);
      }
    } catch(e) {}
  }

  function mostrarModalAvisoPassageiro(titulo, mensagem) {
    alert(`${titulo}: ${mensagem}`);
  }

  async function verificarCorridaAtivaPassageiro() {
    const dadosUsuario = JSON.parse(localStorage.getItem('passageiro_logado') || '{}');
    if (!dadosUsuario.id || typeof supabaseMapa === 'undefined') return;

    try {
      const { data } = await supabaseMapa
        .from('corridas')
        .select('*, motorista:motorista_id(nome, foto_url, nota)')
        .eq('passageiro_id', dadosUsuario.id)
        .in('status', ['procurando', 'aceito', 'a_caminho', 'no_local', 'em_andamento', 'concluido'])
        .order('id', { ascending: false })
        .limit(1);

      if (data && data.length > 0) {
        const corrida = data[0];
        corridaAtualId = corrida.id;

        if (corrida.status === 'procurando') {
          const painelSol = document.getElementById('painel-solicitacao');
          const painelEsp = document.getElementById('painel-espera-corrida');
          if (painelSol) painelSol.classList.add('hidden');
          if (painelEsp) painelEsp.classList.remove('hidden');
          iniciarTimerEsperaCorrida();
        } else if (corrida.status === 'concluido') {
          exibirPainelAvaliacaoPassageiro(corrida);
        } else {
          exibirPainelMotoristaEncontrado(corrida);
        }
        iniciarEscutaPassageiroRealtime();
      }
    } catch (e) {}
  }

  function iniciarEscutaPassageiroRealtime() {
    if (!corridaAtualId || typeof supabaseMapa === 'undefined') return;
    if (canalPassageiroRealtime) supabaseMapa.removeChannel(canalPassageiroRealtime);

    canalPassageiroRealtime = supabaseMapa
      .channel(`public:corridas_passageiro:${corridaAtualId}`)
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'corridas', filter: `id=eq.${corridaAtualId}` }, async payload => {
        if (payload.new) {
          const corridaAtualizada = payload.new;

          if (['aceito', 'a_caminho', 'no_local', 'em_andamento'].includes(corridaAtualizada.status)) {
            let motoristaInfo = { nome: 'Motorista', foto_url: '', nota: '5.0' };
            if (corridaAtualizada.motorista_id) {
              const { data: mot } = await supabaseMapa.from('usuarios').select('nome, foto_url, nota').eq('id', corridaAtualizada.motorista_id).single();
              if (mot) motoristaInfo = mot;
            }
            corridaAtualizada.motorista = motoristaInfo;
            exibirPainelMotoristaEncontrado(corridaAtualizada);
          } else if (corridaAtualizada.status === 'concluido') {
            exibirPainelAvaliacaoPassageiro(corridaAtualizada);
          } else if (corridaAtualizada.status === 'cancelado' || corridaAtualizada.status === 'expirado') {
            tocarSom('cancelar');
            mostrarModalAvisoPassageiro("Aviso", "A corrida foi encerrada ou cancelada.");
            resetarPainelCompletoPassageiro();
          }
        }
      })
      .subscribe();
  }

  function iniciarTimerEsperaCorrida() {
    segundosEspera = 0;
    const timerEl = document.getElementById('timer-espera-contador');
    if (timerEsperaInterval) clearInterval(timerEsperaInterval);

    timerEsperaInterval = setInterval(() => {
      segundosEspera++;
      let min = Math.floor(segundosEspera / 60);
      let seg = segundosEspera % 60;
      if (timerEl) {
        timerEl.innerText = `${min.toString().padStart(2, '0')}:${seg.toString().padStart(2, '0')}`;
      }
    }, 1000);
  }

  function exibirPainelMotoristaEncontrado(corrida) {
    if (timerEsperaInterval) clearInterval(timerEsperaInterval);
    const painelEsp = document.getElementById('painel-espera-corrida');
    const painelSol = document.getElementById('painel-solicitacao');
    if (painelEsp) painelEsp.classList.add('hidden');
    if (painelSol) painelSol.classList.add('hidden');
  }

  function exibirPainelAvaliacaoPassageiro(corrida) {
    tocarSom('sucesso');
    // Implementação do painel de avaliação para o passageiro avaliar o motorista
    const painelAvaliacao = document.getElementById('painel-avaliacao-passageiro');
    if (painelAvaliacao) {
      painelAvaliacao.classList.remove('hidden');
    }
  }

  async function enviarAvaliacaoMotoristaPorPassageiro() {
    if (!corridaAtualId) return;
    const motivoInput = document.getElementById('input-motivo-avaliacao-passageiro');
    const motivo = motivoInput ? motivoInput.value.trim() : '';

    if (avaliacaoSelecionadaPassageiro < 5 && !motivo) {
      alert("Por favor, informe o motivo da nota baixa.");
      return;
    }

    try {
      // Atualiza a corrida com a avaliação do passageiro
      await supabaseMapa.from('corridas').update({
        avaliacao_passageiro: avaliacaoSelecionadaPassageiro,
        motivo_avaliacao_passageiro: motivo || null
      }).eq('id', corridaAtualId);

      // CORREÇÃO SOLICITADA: Se a nota for menor que 5, envia para a tabela de mensagens de suporte / reportes 
      // para aparecer na sub-aba de "Reportes de Passageiros" no Admin Suporte
      if (avaliacaoSelecionadaPassageiro < 5) {
        const dadosUsuario = JSON.parse(localStorage.getItem('passageiro_logado') || '{}');
        await supabaseMapa.from('mensagens_suporte').insert([{
          usuario_id: String(dadosUsuario.id || ''),
          remetente: 'passageiro',
          mensagem: `[Avaliação Baixa / Reporte - Corrida #${corridaAtualId}] Nota ao motorista: ${avaliacaoSelecionadaPassageiro} estrelas. Motivo: ${motivo}`,
          lido: false
        }]);
      }

      alert("Avaliação enviada com sucesso!");
      resetarPainelCompletoPassageiro();
    } catch (e) {
      alert("Erro ao enviar avaliação.");
    }
  }

  function resetarPainelCompletoPassageiro() {
    corridaAtualId = null;
    if (canalPassageiroRealtime && typeof supabaseMapa !== 'undefined') {
      supabaseMapa.removeChannel(canalPassageiroRealtime);
      canalPassageiroRealtime = null;
    }
    if (timerEsperaInterval) clearInterval(timerEsperaInterval);
    window.location.reload();
  }

  // Inicialização ao carregar o mapa
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(verificarCorridaAtivaPassageiro, 1000);
  });
</script>
