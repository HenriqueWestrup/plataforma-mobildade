<div class="flex-1 flex flex-col relative bg-slate-950 text-xs h-full">
  <!-- CONTAINER DO MAPA LEAFLET -->
  <div id="map" class="absolute inset-0 w-full h-full z-0"></div>

  <!-- BOTÃO FLUTUANTE DE CENTRALIZAR MAPA -->
  <button onclick="centralizarNoUsuario()" title="Centralizar no GPS" class="absolute right-4 top-4 bg-slate-900/90 hover:bg-slate-800 text-emerald-400 border border-slate-700 w-11 h-11 rounded-2xl shadow-2xl z-20 flex items-center justify-center transition">
    <i class="fa-solid fa-location-crosshairs text-base"></i>
  </button>

  <!-- PAINEL FLUTUANTE DE SOLICITAÇÃO DE CORRIDA -->
  <div id="painel-solicitacao" class="absolute bottom-4 inset-x-4 bg-slate-900/95 backdrop-blur-md border border-slate-800 p-4 rounded-2xl space-y-3 shadow-2xl z-10">
    
    <!-- CAMPO ORIGEM -->
    <div class="relative">
      <div class="flex items-center gap-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
        <i class="fa-solid fa-circle-dot text-emerald-500"></i>
        <input type="text" id="origem-corrida" placeholder="Local de embarque" oninput="buscarSugestoes(this.value, 'origem')" class="w-full bg-transparent text-slate-100 focus:outline-none placeholder-slate-500">
        <button onclick="usarMinhaLocalizacao()" title="Usar GPS" class="text-emerald-400 hover:text-emerald-300 px-1"><i class="fa-solid fa-crosshairs"></i></button>
      </div>
      <div id="sugestoes-origem" class="absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-800 rounded-xl shadow-xl z-30 hidden max-h-36 overflow-y-auto"></div>
    </div>

    <!-- CONTAINER DE PARADAS OPCIONAIS -->
    <div id="container-paradas" class="space-y-2"></div>

    <!-- CAMPO DESTINO -->
    <div class="relative">
      <div class="flex items-center gap-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
        <i class="fa-solid fa-location-dot text-amber-500"></i>
        <input type="text" id="destino-corrida" placeholder="Para onde vamos?" oninput="buscarSugestoes(this.value, 'destino')" class="w-full bg-transparent text-slate-100 focus:outline-none placeholder-slate-500">
        <button onclick="adicionarCampoParada()" title="Adicionar Parada" class="text-amber-400 hover:text-amber-300 px-1"><i class="fa-solid fa-plus"></i></button>
      </div>
      <div id="sugestoes-destino" class="absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-800 rounded-xl shadow-xl z-30 hidden max-h-36 overflow-y-auto"></div>
    </div>

    <!-- ESTIMATIVA DE VALOR -->
    <div id="bloco-estimativa" class="hidden flex justify-between items-center px-1 text-slate-300">
      <span class="text-slate-400">Estimativa da Corrida</span>
      <span id="valor-estimado" class="text-sm font-extrabold text-emerald-400">R$ 0,00</span>
    </div>

    <!-- SELEÇÃO DE FORMA DE PAGAMENTO -->
    <div class="grid grid-cols-2 gap-2 pt-1">
      <button type="button" onclick="selecionarPagamento('PIX')" id="btn-pay-pix" class="bg-emerald-600/20 border border-emerald-500 text-emerald-400 font-bold py-2 rounded-xl text-center transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-qrcode"></i> PIX
      </button>
      <button type="button" onclick="selecionarPagamento('Dinheiro')" id="btn-pay-dinheiro" class="bg-slate-950 border border-slate-800 text-slate-400 font-bold py-2 rounded-xl text-center transition flex items-center justify-center gap-2 hover:border-slate-700">
        <i class="fa-solid fa-money-bill-wave"></i> Dinheiro
      </button>
    </div>

    <!-- BOTÃO CHAMAR MOTORISTA -->
    <button onclick="chamarMotorista()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-car-side"></i> Chamar Motorista
    </button>
  </div>

  <!-- PAINEL DE ESPERA / BUSCA DE MOTORISTA (TIMER DE 3 MINUTOS E CANCELAMENTO) -->
  <div id="painel-espera-corrida" class="hidden absolute bottom-4 inset-x-4 bg-slate-900/95 backdrop-blur-md border border-amber-500/50 p-5 rounded-2xl space-y-4 shadow-2xl z-20 text-center">
    <div class="w-12 h-12 bg-amber-500/20 text-amber-400 border border-amber-500/40 rounded-full flex items-center justify-center mx-auto animate-spin">
      <i class="fa-solid fa-radar text-xl"></i>
    </div>
    <div class="space-y-1">
      <h3 class="font-extrabold text-white text-sm">Procurando Motorista Próximo...</h3>
      <p class="text-[11px] text-slate-400">Aguardando aceitação dos motoristas online na região.</p>
    </div>

    <!-- CONTADOR REGRESSIVO DE 3 MINUTOS -->
    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center px-4">
      <span class="text-slate-400 text-xs">Tempo restante:</span>
      <span id="timer-regressivo" class="font-mono text-amber-400 font-bold text-sm">03:00</span>
    </div>

    <!-- BOTÃO DE CANCELAMENTO ANTES DE O MOTORISTA ACEITAR -->
    <button onclick="cancelarBuscaCorrida()" class="w-full bg-red-950/50 hover:bg-red-900/50 text-red-400 border border-red-800 font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-xmark"></i> Cancelar Corrida
    </button>
  </div>

  <!-- MODAL DE AVISOS INTERNO (FECHA AUTOMATICAMENTE EM 3,5 SEGUNDOS) -->
  <div id="modal-aviso" class="hidden absolute inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity duration-300">
    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl max-w-xs w-full text-center space-y-4 shadow-2xl">
      <div id="modal-icone" class="w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl"></div>
      <div class="space-y-1">
        <h4 id="modal-titulo" class="font-bold text-white text-sm"></h4>
        <p id="modal-mensagem" class="text-slate-400 text-xs"></p>
      </div>
      <button onclick="fecharModalAviso()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl transition text-[11px]">
        Fechar agora
      </button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL_MAPA = 'https://mmcwmzesjtnqgpcdspir.supabase.co';
  const SUPABASE_ANON_KEY_MAPA = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tY3dtemVzanRucWdwY2RzcGlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NTgyMzUsImV4cCI6MjExMDAzNDIzNX0.VfOyJpZ5Xl30CvLtP-ZpAl1BO1ijVU8ChpabOPmel-E';
  const supabaseMapa = window.supabase ? window.supabase.createClient(SUPABASE_URL_MAPA, SUPABASE_ANON_KEY_MAPA) : null;

  let mapaLeaflet = null;
  let marcadorOrigem = null;
  let marcadorDestino = null;
  let polylineRota = null;
  let coordsOrigem = null;
  let coordsDestino = null;
  let formaPagamentoSelecionada = 'PIX';
  let marcadoresMotoristas = {};
  let intervaloRadarMotoristas = null;
  let timerIntervalId = null;
  let modalTimeoutId = null;
  let corridaAtualId = null;

  // SISTEMA DE ÁUDIO WEB AUDIO API
  function tocarSom(tipo) {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const agora = audioCtx.currentTime;

      if (tipo === 'sucesso') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, agora);
        osc.frequency.exponentialRampToValueAtTime(880, agora + 0.15);
        gain.gain.setValueAtTime(0.15, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.3);
        osc.start(agora);
        osc.stop(agora + 0.3);
      } else if (tipo === 'cancelar') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, agora);
        osc.frequency.exponentialRampToValueAtTime(293.66, agora + 0.2);
        gain.gain.setValueAtTime(0.2, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.35);
        osc.start(agora);
        osc.stop(agora + 0.35);
      }
    } catch (e) {}
  }

  function mostrarModal(titulo, mensagem, tipo = 'sucesso', duracaoMs = 3500) {
    const modal = document.getElementById('modal-aviso');
    const iconeDiv = document.getElementById('modal-icone');
    const tituloEl = document.getElementById('modal-titulo');
    const msgEl = document.getElementById('modal-mensagem');

    tituloEl.innerText = titulo;
    msgEl.innerText = mensagem;

    if (tipo === 'sucesso') {
      tocarSom('sucesso');
      iconeDiv.className = "w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";
      iconeDiv.innerHTML = '<i class="fa-solid fa-car-side"></i>';
    } else {
      tocarSom('cancelar');
      iconeDiv.className = "w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl bg-red-500/20 text-red-400 border border-red-500/40";
      iconeDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
    }

    modal.classList.remove('hidden');

    if (modalTimeoutId) clearTimeout(modalTimeoutId);
    modalTimeoutId = setTimeout(() => {
      fecharModalAviso();
    }, duracaoMs);
  }

  function fecharModalAviso() {
    if (modalTimeoutId) clearTimeout(modalTimeoutId);
    document.getElementById('modal-aviso').classList.add('hidden');
  }

  function inicializarMapa() {
    if (mapaLeaflet) {
      mapaLeaflet.invalidateSize();
      return;
    }

    const latLaguna = -28.4811;
    const lngLaguna = -48.7811;

    mapaLeaflet = L.map('map', { zoomControl: false }).setView([latLaguna, lngLaguna], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(mapaLeaflet);

    setTimeout(() => mapaLeaflet.invalidateSize(), 300);
    usarMinhaLocalizacao();
    iniciarRadarMotoristasOnline();
  }

  function centralizarNoUsuario() {
    if (coordsOrigem && mapaLeaflet) {
      mapaLeaflet.setView([coordsOrigem.lat, coordsOrigem.lng], 16);
    } else {
      usarMinhaLocalizacao();
    }
  }

  async function iniciarRadarMotoristasOnline() {
    if (!supabaseMapa) return;
    atualizarPosicoesMotoristas();
    intervaloRadarMotoristas = setInterval(atualizarPosicoesMotoristas, 5000);
  }

  async function atualizarPosicoesMotoristas() {
    if (!mapaLeaflet) return;
    try {
      const { data: motoristas, error } = await supabaseMapa
        .from('usuarios')
        .select('id, lat, lng, online')
        .eq('online', true);

      if (error || !motoristas) return;

      const idsAtuais = motoristas.map(m => m.id);

      Object.keys(marcadoresMotoristas).forEach(id => {
        if (!idsAtuais.includes(id)) {
          mapaLeaflet.removeLayer(marcadoresMotoristas[id]);
          delete marcadoresMotoristas[id];
        }
      });

      const iconeCarroMapa = L.divIcon({
        className: 'custom-car-radar',
        html: '<div style="background-color: #10b981; color: #fff; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,0.6); border: 2px solid #fff;"><i class="fa-solid fa-car text-[10px]"></i></div>',
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });

      motoristas.forEach(m => {
        if (m.lat && m.lng) {
          if (marcadoresMotoristas[m.id]) {
            marcadoresMotoristas[m.id].setLatLng([m.lat, m.lng]);
          } else {
            const marcador = L.marker([m.lat, m.lng], { icon: iconeCarroMapa }).addTo(mapaLeaflet);
            marcadoresMotoristas[m.id] = marcador;
          }
        }
      });
    } catch (err) {}
  }

  function selecionarPagamento(tipo) {
    formaPagamentoSelecionada = tipo;
    const btnPix = document.getElementById('btn-pay-pix');
    const btnDinheiro = document.getElementById('btn-pay-dinheiro');

    if (tipo === 'PIX') {
      btnPix.className = "bg-emerald-600/20 border border-emerald-500 text-emerald-400 font-bold py-2 rounded-xl text-center transition flex items-center justify-center gap-2";
      btnDinheiro.className = "bg-slate-950 border border-slate-800 text-slate-400 font-bold py-2 rounded-xl text-center transition flex items-center justify-center gap-2 hover:border-slate-700";
    } else {
      btnDinheiro.className = "bg-emerald-600/20 border border-emerald-500 text-emerald-400 font-bold py-2 rounded-xl text-center transition flex items-center justify-center gap-2";
      btnPix.className = "bg-slate-950 border border-slate-800 text-slate-400 font-bold py-2 rounded-xl text-center transition flex items-center justify-center gap-2 hover:border-slate-700";
    }
  }

  function usarMinhaLocalizacao() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          coordsOrigem = { lat, lng };

          if (mapaLeaflet) {
            mapaLeaflet.setView([lat, lng], 15);
            if (marcadorOrigem) mapaLeaflet.removeLayer(marcadorOrigem);
            marcadorOrigem = L.marker([lat, lng]).addTo(mapaLeaflet).bindPopup("Sua Localização").openPopup();
          }

          fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
            .then(res => res.json())
            .then(data => {
              if (data && data.display_name) {
                document.getElementById('origem-corrida').value = data.display_name;
              }
            }).catch(() => {
              document.getElementById('origem-corrida').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            });
        },
        () => {},
        { enableHighAccuracy: true }
      );
    }
  }

  async function buscarSugestoes(termo, tipo) {
    const container = document.getElementById(`sugestoes-${tipo}`);
    if (termo.length < 3) {
      container.classList.add('hidden');
      return;
    }

    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(termo)}`);
      const resultados = await res.json();

      if (!resultados || resultados.length === 0) {
        container.classList.add('hidden');
        return;
      }

      container.innerHTML = resultados.map(item => `
        <div onclick="selecionarEndereco('${item.display_name.replace(/'/g, "")}', ${item.lat}, ${item.lon}, '${tipo}')" class="p-2.5 hover:bg-slate-800 cursor-pointer border-b border-slate-800 text-slate-200 truncate">
          <i class="fa-solid fa-location-dot text-emerald-400 mr-2"></i> ${item.display_name}
        </div>
      `).join('');
      container.classList.remove('hidden');
    } catch (e) {}
  }

  function selecionarEndereco(nome, lat, lon, tipo) {
    document.getElementById(`${tipo}-corrida`).value = nome;
    document.getElementById(`sugestoes-${tipo}`).classList.add('hidden');

    const coord = { lat: parseFloat(lat), lng: parseFloat(lon) };

    if (tipo === 'origem') {
      coordsOrigem = coord;
      if (marcadorOrigem) mapaLeaflet.removeLayer(marcadorOrigem);
      marcadorOrigem = L.marker([lat, lon]).addTo(mapaLeaflet);
    } else {
      coordsDestino = coord;
      if (marcadorDestino) mapaLeaflet.removeLayer(marcadorDestino);
      marcadorDestino = L.marker([lat, lon], {
        icon: L.divIcon({ className: 'bg-amber-500 w-3 h-3 rounded-full border-2 border-white' })
      }).addTo(mapaLeaflet);
    }

    if (coordsOrigem && coordsDestino) {
      calcularRotaEValor();
    }
  }

  function adicionarCampoParada() {
    const container = document.getElementById('container-paradas');
    if (container.children.length >= 2) {
      mostrarModal("Atenção", "Limite máximo de 2 paradas intermediárias.", "cancelar", 3000);
      return;
    }
    const idParada = 'parada-' + Date.now();
    const div = document.createElement('div');
    div.className = "relative flex items-center gap-2 bg-slate-950 border border-slate-800 p-2.5 rounded-xl";
    div.innerHTML = `
      <i class="fa-solid fa-stop text-sky-400"></i>
      <input type="text" id="${idParada}" placeholder="Adicionar parada" oninput="buscarSugestoes(this.value, '${idParada}')" class="w-full bg-transparent text-slate-100 focus:outline-none placeholder-slate-500">
      <button onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-300 px-1"><i class="fa-solid fa-xmark"></i></button>
      <div id="sugestoes-${idParada}" class="absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-800 rounded-xl shadow-xl z-30 hidden max-h-36 overflow-y-auto"></div>
    `;
    container.appendChild(div);
  }

  async function calcularRotaEValor() {
    if (!coordsOrigem || !coordsDestino) return;

    try {
      const urlOsrm = `https://router.project-osrm.org/route/v1/driving/${coordsOrigem.lng},${coordsOrigem.lat};${coordsDestino.lng},${coordsDestino.lat}?overview=full&geometries=geojson`;
      const res = await fetch(urlOsrm);
      const data = await res.json();

      if (data && data.routes && data.routes.length > 0) {
        const route = data.routes[0];
        const coordenadasGeo = route.geometry.coordinates.map(c => [c[1], c[0]]);

        if (polylineRota) mapaLeaflet.removeLayer(polylineRota);

        polylineRota = L.polyline(coordenadasGeo, {
          color: '#10b981',
          weight: 5,
          opacity: 0.8
        }).addTo(mapaLeaflet);

        const distanciaKm = route.distance / 1000;
        let valorCalculado = 5.0 + (distanciaKm * 3.50);
        if (valorCalculado < 10.0) valorCalculado = 10.0;

        document.getElementById('valor-estimado').innerText = `R$ ${valorCalculado.toFixed(2).replace('.', ',')}`;
        document.getElementById('bloco-estimativa').classList.remove('hidden');

        mapaLeaflet.fitBounds(polylineRota.getBounds(), { padding: [60, 60] });
        return;
      }
    } catch (e) {}

    const R = 6371;
    const dLat = (coordsDestino.lat - coordsOrigem.lat) * Math.PI / 180;
    const dLon = (coordsDestino.lng - coordsOrigem.lng) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(coordsOrigem.lat * Math.PI / 180) * Math.cos(coordsDestino.lat * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    const distanciaKm = R * c;

    let valorCalculado = 5.0 + (distanciaKm * 3.50);
    if (valorCalculado < 10.0) valorCalculado = 10.0;

    document.getElementById('valor-estimado').innerText = `R$ ${valorCalculado.toFixed(2).replace('.', ',')}`;
    document.getElementById('bloco-estimativa').classList.remove('hidden');

    const bounds = L.latLngBounds([coordsOrigem.lat, coordsOrigem.lng], [coordsDestino.lat, coordsDestino.lng]);
    mapaLeaflet.fitBounds(bounds, { padding: [50, 50] });
  }

  async function chamarMotorista() {
    const dadosUsuario = JSON.parse(localStorage.getItem('passageiro_logado') || '{}');

    if (!dadosUsuario.id) {
      mostrarModal("Erro de Autenticação", "Passageiro não identificado. Faça login novamente.", "cancelar", 2500);
      setTimeout(() => window.location.href = 'auth.html', 2500);
      return;
    }

    const clienteSupabaseAtivo = supabaseMapa || (typeof supabaseClient !== 'undefined' ? supabaseClient : null);
    if (!clienteSupabaseAtivo) {
      mostrarModal("Erro Crítico", "Conexão com o banco de dados indisponível.", "cancelar", 3500);
      return;
    }

    // VERIFICAÇÃO EM TEMPO REAL DO STATUS DA CONTA NO SUPABASE
    try {
      const { data: usuarioAtualizado } = await clienteSupabaseAtivo
        .from('usuarios')
        .select('status')
        .eq('id', dadosUsuario.id)
        .single();

      if (usuarioAtualizado && (usuarioAtualizado.status === 'bloqueado' || usuarioAtualizado.status === 'pendente')) {
        mostrarModal("Conta Suspensa", "Sua conta está suspensa ou pendente. Não é possível solicitar viagens.", "cancelar", 4000);
        return;
      }
    } catch (e) {}

    const origem = document.getElementById('origem-corrida').value;
    const destino = document.getElementById('destino-corrida').value;
    const valorTexto = document.getElementById('valor-estimado').innerText;
    
    if (!origem || !destino) {
      mostrarModal("Campos Incompletos", "Por favor, preencha a origem e o destino.", "cancelar", 3500);
      return;
    }

    const valorNumerico = parseFloat(valorTexto.replace('R$ ', '').replace(',', '.')) || 15.0;

    const { data, error } = await clienteSupabaseAtivo.from('corridas').insert([{
      passageiro_id: dadosUsuario.id,
      origem: origem,
      destino: destino,
      valor: valorNumerico,
      forma_pagamento: String(formaPagamentoSelecionada || 'PIX'),
      status: 'procurando'
    }]).select().single();

    if (error) {
      mostrarModal("Erro", "Erro ao solicitar corrida: " + error.message, "cancelar", 4000);
    } else {
      corridaAtualId = data.id;
      document.getElementById('painel-solicitacao').classList.add('hidden');
      document.getElementById('painel-espera-corrida').classList.remove('hidden');

      mostrarModal("Buscando Motorista", "Sua solicitação foi enviada aos motoristas próximos.", "sucesso", 3500);
      iniciarTimerEsperaCorrida();
    }
  }

  function iniciarTimerEsperaCorrida() {
    let tempoRestante = 180;
    const display = document.getElementById('timer-regressivo');

    if (timerIntervalId) clearInterval(timerIntervalId);

    timerIntervalId = setInterval(async () => {
      let minutos = Math.floor(tempoRestante / 60);
      let segundos = tempoRestante % 60;

      display.innerText = `${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;

      if (tempoRestante <= 0) {
        clearInterval(timerIntervalId);
        mostrarModal("Tempo Esgotado", "Tempo limite de 3 minutos esgotado sem motoristas aceitarem.", "cancelar", 4000);
        
        if (corridaAtualId && supabaseMapa) {
          await supabaseMapa.from('corridas').update({ status: 'expirado' }).eq('id', corridaAtualId);
        }
        resetarPainelCorrida();
      }
      tempoRestante--;
    }, 1000);
  }

  async function cancelarBuscaCorrida() {
    if (timerIntervalId) clearInterval(timerIntervalId);

    if (corridaAtualId && supabaseMapa) {
      await supabaseMapa.from('corridas').update({ status: 'cancelado' }).eq('id', corridaAtualId);
    }

    mostrarModal("Cancelado", "Corrida cancelada com sucesso.", "cancelar", 3000);
    resetarPainelCorrida();
  }

  function resetarPainelCorrida() {
    corridaAtualId = null;
    document.getElementById('painel-espera-corrida').classList.add('hidden');
    document.getElementById('painel-solicitacao').classList.remove('hidden');
  }

  setTimeout(inicializarMapa, 100);
</script>
