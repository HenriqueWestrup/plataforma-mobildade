<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mapa - Mobilidade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden m-0 p-0">
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-2.5">
      <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-700 transition">
        <i class="fa-solid fa-arrow-left mr-1"></i> Voltar
      </a>
      <span class="text-xs font-extrabold text-white">Solicitar Corrida</span>
    </div>
    <span class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">Mapa</span>
  </header>

  <div id="host-mapa-pagina" class="flex-1 flex flex-col relative overflow-hidden"></div>

  <script>
    fetch('mapa.html')
      .then(res => res.text())
      .then(html => {
        const host = document.getElementById('host-mapa-pagina');
        const temp = document.createElement('div');
        temp.innerHTML = html;

        const scripts = Array.from(temp.querySelectorAll('script'));
        scripts.forEach(s => s.remove());
        host.innerHTML = temp.innerHTML;

        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
        });
      });
  </script>
</body>
</html>
