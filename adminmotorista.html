<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Admin Motoristas - Mobilidade Laguna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden m-0 p-0 text-xs">

  <main class="flex-1 overflow-y-auto p-4 space-y-3 pb-16">
    <div id="lista-admin-motoristas" class="space-y-3">
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">Carregando motoristas...</div>
    </div>
  </main>

  <script src="admin_shared.js"></script>
  <script>
    async function carregarPaginaAtual() {
      const { data } = await supabaseClient.from('usuarios').select('*');
      const todos = data || [];
      listaUsuariosCache = todos;

      let motoristas = todos.filter(u => u.tipo === 'motorista' || u.veiculo_modelo);
      motoristas.sort((a, b) => (b.online === true ? 1 : 0) - (a.online === true ? 1 : 0) || (a.nome || '').localeCompare(b.nome || ''));

      const container = document.getElementById('lista-admin-motoristas');
      container.innerHTML = motoristas.length === 0
        ? '<div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">Nenhum motorista cadastrado.</div>'
        : motoristas.map(m => gerarCardAdmin(m)).join('');
    }

    window.onload = () => verificarSessaoAdmin('motorista', carregarPaginaAtual);
  </script>
</body>
</html>
