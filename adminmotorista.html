<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Admin Motoristas - Mobilidade Laguna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden m-0 p-0 text-xs">

  <main class="flex-1 overflow-y-auto p-4 space-y-3 pb-16">
    <!-- SUB-ABAS DE FILTRO / SETOR DE MOTORISTAS -->
    <div class="grid grid-cols-5 gap-1.5 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 text-[10px]">
      <button type="button" onclick="mudarSubAbaMotoristaAdmin('todos')" id="sub-mot-todos" class="py-2 px-1.5 rounded-xl font-bold bg-emerald-600 text-white transition truncate">
        Todos (<span id="cnt-mot-todos">0</span>)
      </button>
      <button type="button" onclick="mudarSubAbaMotoristaAdmin('online')" id="sub-mot-online" class="py-2 px-1.5 rounded-xl font-bold bg-slate-800 text-slate-400 hover:text-white transition truncate">
        Online (<span id="cnt-mot-online">0</span>)
      </button>
      <button type="button" onclick="mudarSubAbaMotoristaAdmin('analise')" id="sub-mot-analise" class="py-2 px-1.5 rounded-xl font-bold bg-slate-800 text-slate-400 hover:text-white transition truncate">
        Em Análise (<span id="cnt-mot-analise">0</span>)
      </button>
      <button type="button" onclick="mudarSubAbaMotoristaAdmin('bloqueados')" id="sub-mot-bloqueados" class="py-2 px-1.5 rounded-xl font-bold bg-slate-800 text-slate-400 hover:text-white transition truncate">
        Bloqueados (<span id="cnt-mot-bloqueados">0</span>)
      </button>
      <button type="button" onclick="mudarSubAbaMotoristaAdmin('segundo_carro')" id="sub-mot-segundo_carro" class="py-2 px-1.5 rounded-xl font-bold bg-slate-800 text-slate-400 hover:text-white transition truncate">
        2º Carro (<span id="cnt-mot-segundo_carro">0</span>)
      </button>
    </div>

    <!-- BUSCADOR DE MOTORISTAS (PADRONIZADO) -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
      <input
        type="text"
        id="busca-motoristas"
        oninput="aoDigitarBuscaMotoristaAdmin()"
        placeholder="Buscar por nome, CPF, celular, carro ou placa..."
        class="w-full bg-slate-900 border border-slate-800 focus:border-emerald-500 rounded-2xl pl-9 pr-9 py-2.5 text-xs text-slate-100 placeholder-slate-500 outline-none transition"
      >
      <button
        type="button"
        id="btn-limpar-busca-motoristas"
        onclick="limparBuscaMotoristaAdmin()"
        title="Limpar busca"
        class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div id="lista-admin-motoristas" class="space-y-3">
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">Carregando motoristas...</div>
    </div>
  </main>

  <script src="admin_shared.js"></script>
  <script>
    let motoristasCacheAdmin = [];
    let subAbaMotoristaAtual = 'todos';

    function aoDigitarBuscaMotoristaAdmin() {
      const input = document.getElementById('busca-motoristas');
      const btnLimpar = document.getElementById('btn-limpar-busca-motoristas');
      termoBuscaMotoristaAdmin = input ? input.value : '';
      if (btnLimpar) btnLimpar.classList.toggle('hidden', !termoBuscaMotoristaAdmin);
      renderizarListaMotoristasAdmin();
    }

    function limparBuscaMotoristaAdmin() {
      const input = document.getElementById('busca-motoristas');
      const btnLimpar = document.getElementById('btn-limpar-busca-motoristas');
      if (input) input.value = '';
      termoBuscaMotoristaAdmin = '';
      if (btnLimpar) btnLimpar.classList.add('hidden');
      renderizarListaMotoristasAdmin();
    }

    function mudarSubAbaMotoristaAdmin(setor) {
      subAbaMotoristaAtual = setor;
      ['todos', 'online', 'analise', 'bloqueados', 'segundo_carro'].forEach(chave => {
        const btn = document.getElementById(`sub-mot-${chave}`);
        if (!btn) return;
        btn.className = chave === setor
          ? 'py-2 px-1.5 rounded-xl font-bold bg-emerald-600 text-white transition truncate'
          : 'py-2 px-1.5 rounded-xl font-bold bg-slate-800 text-slate-400 hover:text-white transition truncate';
      });
      renderizarListaMotoristasAdmin();
    }

    function atualizarContadoresSubAbasMotoristas() {
      const lista = motoristasCacheAdmin;
      document.getElementById('cnt-mot-todos').innerText = filtrarUsuariosPorSetorAdmin(lista, 'todos').length;
      document.getElementById('cnt-mot-online').innerText = filtrarUsuariosPorSetorAdmin(lista, 'online').length;
      document.getElementById('cnt-mot-analise').innerText = filtrarUsuariosPorSetorAdmin(lista, 'analise').length;
      document.getElementById('cnt-mot-bloqueados').innerText = filtrarUsuariosPorSetorAdmin(lista, 'bloqueados').length;
      document.getElementById('cnt-mot-segundo_carro').innerText = filtrarUsuariosPorSetorAdmin(lista, 'segundo_carro').length;
    }

    function renderizarListaMotoristasAdmin() {
      atualizarContadoresSubAbasMotoristas();
      const filtrados = filtrarUsuariosPorSetorAdmin(motoristasCacheAdmin, subAbaMotoristaAtual);
      const container = document.getElementById('lista-admin-motoristas');

      if (!filtrados || filtrados.length === 0) {
        const msgVazia = termoBuscaMotoristaAdmin
          ? 'Nenhum motorista corresponde à busca neste setor.'
          : 'Nenhum motorista encontrado neste setor.';
        container.innerHTML = `<div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">${msgVazia}</div>`;
        return;
      }

      container.innerHTML = filtrados.map(m => gerarCardAdmin(m)).join('');
    }

    async function carregarPaginaAtual() {
      const { data } = await supabaseClient.from('usuarios').select('*');
      const todos = data || [];
      listaUsuariosCache = todos;

      let motoristas = todos.filter(u => ehPerfilMotoristaAdmin(u));
      motoristas.sort((a, b) =>
        (usuarioEstaAtivoNoAppAdmin(b) ? 1 : 0) - (usuarioEstaAtivoNoAppAdmin(a) ? 1 : 0) ||
        (a.nome || '').localeCompare(b.nome || '')
      );

      motoristasCacheAdmin = motoristas;
      renderizarListaMotoristasAdmin();
    }

    window.onload = () => verificarSessaoAdmin('motorista', carregarPaginaAtual);
  </script>
</body>
</html>
