<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Admin Passageiros - Mobilidade Laguna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden m-0 p-0 text-xs">

  <main class="flex-1 overflow-y-auto p-4 space-y-3 pb-16">
    <!-- SUB-ABAS DE FILTRO / SETOR DE PASSAGEIROS -->
    <div class="grid grid-cols-3 gap-1.5 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 text-[10px]">
      <button type="button" onclick="mudarSubAbaPassageiroAdmin('todos')" id="sub-pass-todos" class="py-2 px-2 rounded-xl font-bold bg-emerald-600 text-white transition truncate">
        Todos (<span id="cnt-pass-todos">0</span>)
      </button>
      <button type="button" onclick="mudarSubAbaPassageiroAdmin('analise')" id="sub-pass-analise" class="py-2 px-2 rounded-xl font-bold bg-slate-800 text-slate-400 hover:text-white transition truncate">
        Em Análise (<span id="cnt-pass-analise">0</span>)
      </button>
      <button type="button" onclick="mudarSubAbaPassageiroAdmin('bloqueados')" id="sub-pass-bloqueados" class="py-2 px-2 rounded-xl font-bold bg-slate-800 text-slate-400 hover:text-white transition truncate">
        Bloqueados (<span id="cnt-pass-bloqueados">0</span>)
      </button>
    </div>

    <!-- BUSCADOR DE PASSAGEIROS (PADRONIZADO) -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
      <input
        type="text"
        id="input-busca-passageiro"
        oninput="aoDigitarBuscaPassageiroAdmin()"
        placeholder="Buscar por nome, CPF, celular, carro ou placa..."
        class="w-full bg-slate-900 border border-slate-800 focus:border-emerald-500 rounded-2xl pl-9 pr-9 py-2.5 text-xs text-slate-100 placeholder-slate-500 outline-none transition"
      >
      <button
        type="button"
        id="btn-limpar-busca-passageiro"
        onclick="limparBuscaPassageiroAdmin()"
        title="Limpar busca"
        class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div id="lista-admin-passageiros" class="space-y-3">
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">Carregando passageiros...</div>
    </div>
  </main>

  <script src="admin_shared.js"></script>
  <script>
    let passageirosGlobais = [];
    let subAbaPassageiroAtual = 'todos';

    function usuarioCombinaComTermoAdmin(u, termoBruto) {
      const termo = (termoBruto || '').toLowerCase().trim();
      if (!termo) return true;
      const digitosTermo = termo.replace(/\D/g, '');

      const camposTexto = [
        u.nome,
        u.cpf,
        u.telefone,
        u.celular,
        u.veiculo,
        u.carro,
        u.veiculo_marca,
        u.veiculo_modelo,
        u.veiculo_ano,
        u.veiculo_placa,
        u.placa,
        u.tipo
      ].filter(Boolean).map(v => String(v).toLowerCase());

      if (camposTexto.some(c => c.includes(termo))) return true;

      if (digitosTermo.length >= 2) {
        const camposDigitos = [u.cpf, u.telefone, u.celular]
          .filter(Boolean)
          .map(v => String(v).replace(/\D/g, ''));
        if (camposDigitos.some(d => d.includes(digitosTermo))) return true;
      }

      return false;
    }

    function aoDigitarBuscaPassageiroAdmin() {
      const input = document.getElementById('input-busca-passageiro');
      const btnLimpar = document.getElementById('btn-limpar-busca-passageiro');
      const valor = input ? input.value : '';
      if (btnLimpar) btnLimpar.classList.toggle('hidden', !valor);
      renderizarPassageiros();
    }

    function limparBuscaPassageiroAdmin() {
      const input = document.getElementById('input-busca-passageiro');
      const btnLimpar = document.getElementById('btn-limpar-busca-passageiro');
      if (input) input.value = '';
      if (btnLimpar) btnLimpar.classList.add('hidden');
      renderizarPassageiros();
    }

    function mudarSubAbaPassageiroAdmin(setor) {
      subAbaPassageiroAtual = setor;
      ['todos', 'analise', 'bloqueados'].forEach(chave => {
        const btn = document.getElementById(`sub-pass-${chave}`);
        if (!btn) return;
        btn.className = chave === setor
          ? 'py-2 px-2 rounded-xl font-bold bg-emerald-600 text-white transition truncate'
          : 'py-2 px-2 rounded-xl font-bold bg-slate-800 text-slate-400 hover:text-white transition truncate';
      });
      renderizarPassageiros();
    }

    function atualizarContadoresSubAbasPassageiros() {
      document.getElementById('cnt-pass-todos').innerText = passageirosGlobais.length;
      document.getElementById('cnt-pass-analise').innerText = filtrarUsuariosPorSetorAdmin(passageirosGlobais, 'analise').length;
      document.getElementById('cnt-pass-bloqueados').innerText = filtrarUsuariosPorSetorAdmin(passageirosGlobais, 'bloqueados').length;
    }

    async function carregarPaginaAtual() {
      const { data } = await supabaseClient.from('usuarios').select('*');
      const todos = data || [];
      listaUsuariosCache = todos;
      passageirosGlobais = todos.filter(u => !ehPerfilMotoristaAdmin(u));
      renderizarPassageiros();
    }

    function renderizarPassageiros() {
      atualizarContadoresSubAbasPassageiros();
      const container = document.getElementById('lista-admin-passageiros');
      const termo = (document.getElementById('input-busca-passageiro')?.value || '').trim();

      let filtrados = filtrarUsuariosPorSetorAdmin(passageirosGlobais, subAbaPassageiroAtual)
        .filter(u => usuarioCombinaComTermoAdmin(u, termo));

      filtrados.sort((a, b) => (b.online === true ? 1 : 0) - (a.online === true ? 1 : 0) || (a.nome || '').localeCompare(b.nome || ''));

      container.innerHTML = filtrados.length === 0
        ? `<div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">${termo ? 'Nenhum passageiro corresponde à busca neste setor.' : 'Nenhum passageiro encontrado neste setor.'}</div>`
        : filtrados.map(u => gerarCardAdmin(u)).join('');
    }

    window.onload = () => verificarSessaoAdmin('passageiro', carregarPaginaAtual);
  </script>
</body>
</html>
