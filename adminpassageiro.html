<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Admin Passageiros - Mobilidade Laguna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden m-0 p-0 text-xs">

  <main class="flex-1 overflow-y-auto p-4 space-y-3 pb-16">
    <div class="relative">
      <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-400"></i>
      <input type="text" id="input-busca-passageiro" oninput="renderizarPassageiros()" placeholder="Buscar passageiro por nome, CPF ou celular..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-slate-100 outline-none focus:border-emerald-500">
    </div>

    <div id="lista-admin-passageiros" class="space-y-3">
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">Carregando passageiros...</div>
    </div>
  </main>

  <script src="admin_shared.js"></script>
  <script>
    let passageirosGlobais = [];

    async function carregarPaginaAtual() {
      const { data } = await supabaseClient.from('usuarios').select('*');
      const todos = data || [];
      listaUsuariosCache = todos;
      passageirosGlobais = todos.filter(u => u.tipo !== 'motorista' && !u.veiculo_modelo);
      renderizarPassageiros();
    }

    function renderizarPassageiros() {
      const container = document.getElementById('lista-admin-passageiros');
      const termo = (document.getElementById('input-busca-passageiro').value || '').toLowerCase().trim();

      let filtrados = passageirosGlobais.filter(u =>
        (u.nome || '').toLowerCase().includes(termo) ||
        (u.cpf || '').toLowerCase().includes(termo) ||
        (u.telefone || '').toLowerCase().includes(termo)
      );

      filtrados.sort((a, b) => (b.online === true ? 1 : 0) - (a.online === true ? 1 : 0) || (a.nome || '').localeCompare(b.nome || ''));

      container.innerHTML = filtrados.length === 0
        ? '<div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">Nenhum passageiro encontrado.</div>'
        : filtrados.map(u => gerarCardAdmin(u)).join('');
    }

    window.onload = () => verificarSessaoAdmin('passageiro', carregarPaginaAtual);
  </script>
</body>
</html>
