<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobilidade Laguna - Motorista</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl space-y-5">
    
    <div class="text-center space-y-1">
      <div class="inline-block bg-amber-600/20 border border-amber-500/30 text-amber-400 p-3 rounded-2xl mb-1">
        <i class="fa-solid fa-car text-xl"></i>
      </div>
      <h1 id="titulo-motorista" class="text-lg font-extrabold text-white">Portal do Motorista</h1>
      <p id="subtitulo-motorista" class="text-xs text-slate-400">Entre com celular e senha para trabalhar</p>
    </div>

    <!-- LOGIN -->
    <form id="form-login-motorista" class="space-y-4 text-xs" onsubmit="realizarLoginMotorista(event)">
      <input type="tel" id="login-celular-motorista" required placeholder="Celular" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100">
      <input type="password" id="login-senha-motorista" required placeholder="Senha" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100">
      <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl shadow-lg transition">Entrar como Motorista</button>
    </form>

    <!-- REVALIDAÇÃO FACIAL MOTORISTA -->
    <div id="box-reval-mot" class="hidden space-y-3 text-center text-xs bg-slate-950 p-4 rounded-2xl border border-amber-500/40">
      <p class="text-amber-400 font-bold"><i class="fa-solid fa-shield-halved mr-1"></i> Validação Facial (15 dias)</p>
      <div class="w-24 h-24 mx-auto rounded-full overflow-hidden border-2 border-amber-500 bg-slate-900">
        <video id="video-reval-mot" class="w-full h-full object-cover" autoplay playsinline></video>
      </div>
      <button type="button" onclick="confirmarRevalMot()" class="w-full bg-amber-600 text-white font-bold py-2.5 rounded-xl">Confirmar Selfie e Entrar</button>
    </div>

    <!-- CADASTRO MOTORISTA -->
    <form id="form-cadastro-motorista" class="hidden space-y-3 text-xs" onsubmit="realizarCadastroMotorista(event)">
      <div class="flex flex-col items-center space-y-2 pb-2 border-b border-slate-800">
        <div class="relative w-20 h-20 rounded-full bg-slate-950 border-2 border-dashed border-amber-500/60 flex items-center justify-center overflow-hidden">
          <img id="preview-selfie-mot" class="hidden w-full h-full object-cover" />
          <video id="camera-stream-mot" class="hidden w-full h-full object-cover" autoplay playsinline></video>
          <i id="icone-camera-mot" class="fa-solid fa-camera text-slate-500 text-xl"></i>
        </div>
        <div class="flex gap-2">
          <button type="button" id="btn-abrir-cam-mot" onclick="iniciarCameraMot()" class="bg-slate-800 text-amber-400 px-3 py-1 rounded-lg text-[11px] font-bold border border-slate-700">Selfie Obrigatória</button>
          <button type="button" id="btn-capturar-cam-mot" onclick="capturarSelfieMot()" class="hidden bg-amber-600 text-white px-3 py-1 rounded-lg text-[11px] font-bold">Confirmar</button>
        </div>
        <canvas id="canvas-selfie-mot" class="hidden"></canvas>
      </div>

      <input type="text" id="cad-mot-nome" required placeholder="Nome Completo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100">
      <input type="text" id="cad-mot-cpf" required placeholder="CPF" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100">
      
      <div class="flex gap-2">
        <input type="tel" id="cad-mot-celular" required placeholder="Celular" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100">
        <button type="button" onclick="enviarSMSMot()" class="bg-amber-600/20 text-amber-400 border border-amber-500/40 px-3 rounded-xl font-bold text-[11px]">SMS</button>
      </div>

      <div id="box-sms-mot" class="hidden space-y-1 bg-slate-950 p-2.5 rounded-xl border border-amber-500/30">
        <input type="text" id="input-sms-mot" maxlength="4" placeholder="Código SMS" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-center font-bold text-white">
        <button type="button" onclick="validarSMSMot()" class="w-full bg-amber-600 text-white py-1 rounded font-bold text-[10px] mt-1">Validar</button>
        <p id="status-sms-mot" class="text-[10px] text-slate-400 text-center"></p>
      </div>

      <div class="flex justify-between items-center">
        <input type="text" id="cad-mot-endereco" required placeholder="Endereço Residencial" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100">
        <button type="button" onclick="obterEnderecoMotorista()" class="ml-1 text-[10px] bg-amber-600/20 text-amber-400 px-2 py-2 rounded-xl border border-amber-500/30 font-bold whitespace-nowrap"><i class="fa-solid fa-location-crosshairs"></i> GPS</button>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="cad-mot-veiculo" required placeholder="Veículo (Ex: Logan)" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100">
        <input type="text" id="cad-mot-placa" required placeholder="Placa" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 uppercase text-slate-100">
      </div>

      <input type="password" id="cad-mot-senha" required placeholder="Senha" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100">

      <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl shadow-lg transition mt-2">Enviar para Aprovação</button>
    </form>

    <div class="text-center text-[11px] text-slate-500 space-y-2 pt-2 border-t border-slate-800">
      <div id="texto-alt-mot">
        Ainda não é parceiro? <button type="button" onclick="alternarTelaMot('cadastro')" class="text-amber-400 font-bold hover:underline">Cadastre seu veículo</button>
      </div>
      <div class="flex justify-center gap-4">
        <a href="auth.html" class="text-slate-400 hover:text-slate-200 underline">Passageiro</a>
        <a href="admin.html" class="text-slate-500 hover:text-slate-300 underline">Admin</a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mmcwmzesjtnqgpcdspir.supabase.co';[cite: 6]
    const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON_PUBLIC_AQUI'; // Cole sua chave anon public aqui
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let streamMot = null, fotoMotBase64 = null, codigoSMSMot = null, smsMotOk = false, motTemp = null;

    function alternarTelaMot(m) {
      if (m === 'cadastro') {
        document.getElementById('form-login-motorista').classList.add('hidden');
        document.getElementById('form-cadastro-motorista').classList.remove('hidden');
        document.getElementById('titulo-motorista').innerText = "Cadastro de Motorista";
      } else {
        document.getElementById('form-cadastro-motorista').classList.add('hidden');
        document.getElementById('form-login-motorista').classList.remove('hidden');
        document.getElementById('titulo-motorista').innerText = "Portal do Motorista";
      }
    }

    function enviarSMSMot() {
      codigoSMSMot = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('box-sms-mot').classList.remove('hidden');
      document.getElementById('status-sms-mot').innerText = `Código SMS teste: ${codigoSMSMot}`;
    }

    function validarSMSMot() {
      if (document.getElementById('input-sms-mot').value.trim() === codigoSMSMot) {
        smsMotOk = true;
        document.getElementById('status-sms-mot').innerHTML = '<span class="text-emerald-400 font-bold">Celular confirmado!</span>';
      } else { alert("Código incorreto."); }
    }

    function obterEnderecoMotorista() {
      navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
          const d = await res.json();
          document.getElementById('cad-mot-endereco').value = `${d.address.road || ''}, ${d.address.suburb || ''} - ${d.address.city || 'Laguna'}`;
        } catch { document.getElementById('cad-mot-endereco').value = `${pos.coords.latitude}, ${pos.coords.longitude}`; }
      });
    }

    async function iniciarCameraMot() {
      streamMot = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      const v = document.getElementById('camera-stream-mot');
      v.srcObject = streamMot;
      v.classList.remove('hidden');
      document.getElementById('icone-camera-mot').classList.add('hidden');
      document.getElementById('btn-abrir-cam-mot').classList.add('hidden');
      document.getElementById('btn-capturar-cam-mot').classList.remove('hidden');
    }

    function capturarSelfieMot() {
      const v = document.getElementById('camera-stream-mot');
      const c = document.getElementById('canvas-selfie-mot');
      c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext('2d').drawImage(v, 0, 0);
      fotoMotBase64 = c.toDataURL('image/jpeg', 0.8);
      document.getElementById('preview-selfie-mot').src = fotoMotBase64;
      document.getElementById('preview-selfie-mot').classList.remove('hidden');
      v.classList.add('hidden');
      if(streamMot) streamMot.getTracks().forEach(t => t.stop());
    }

    function passou15Dias(dataISO) {
      if (!dataISO) return true;
      return ((new Date() - new Date(dataISO)) / (1000 * 60 * 60 * 24)) >= 15;
    }

    async function realizarLoginMotorista(e) {
      e.preventDefault();
      const cel = document.getElementById('login-celular-motorista').value.trim();
      const senha = document.getElementById('login-senha-motorista').value;

      const { data, error } = await supabaseClient.from('motoristas').select('*').eq('telefone', cel).eq('senha', senha).single();
      if (error || !data) {
        alert("Celular ou senha inválidos.");
        return;
      }

      if (data.status !== 'aprovado') {
        alert("Seu cadastro de motorista ainda está AGUARDANDO APROVAÇÃO do administrador.");
        return;
      }

      if (passou15Dias(data.ultima_verificacao_facial)) {
        motTemp = data;
        document.getElementById('form-login-motorista').classList.add('hidden');
        document.getElementById('box-reval-mot').classList.remove('hidden');
        streamMot = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById('video-reval-mot').srcObject = streamMot;
        return;
      }

      localStorage.setItem('motorista_logado', JSON.stringify(data));
      window.location.href = 'motorista.html';
    }

    async function confirmarRevalMot() {
      const v = document.getElementById('video-reval-mot');
      const c = document.createElement('canvas');
      c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext('2d').drawImage(v, 0, 0);
      const novaFoto = c.toDataURL('image/jpeg', 0.8);
      if(streamMot) streamMot.getTracks().forEach(t => t.stop());

      const agora = new Date().toISOString();
      await supabaseClient.from('motoristas').update({ foto_url: novaFoto, ultima_verificacao_facial: agora }).eq('id', motTemp.id);
      
      motTemp.foto_url = novaFoto;
      motTemp.ultima_verificacao_facial = agora;
      localStorage.setItem('motorista_logado', JSON.stringify(motTemp));
      window.location.href = 'motorista.html';
    }

    async function realizarCadastroMotorista(e) {
      e.preventDefault();
      if (!fotoMotBase64) return alert("Selfie obrigatória.");
      if (!smsMotOk) return alert("Valide o SMS.");

      const novo = {
        nome: document.getElementById('cad-mot-nome').value,
        cpf: document.getElementById('cad-mot-cpf').value,
        telefone: document.getElementById('cad-mot-celular').value.trim(),
        endereco: document.getElementById('cad-mot-endereco').value,
        veiculo_modelo: document.getElementById('cad-mot-veiculo').value,
        veiculo_placa: document.getElementById('cad-mot-placa').value.toUpperCase(),
        senha: document.getElementById('cad-mot-senha').value,
        foto_url: fotoMotBase64,
        tipo: 'motorista',
        status: 'pendente',
        data_cadastro: new Date().toLocaleDateString('pt-BR'),
        ultima_verificacao_facial: new Date().toISOString()
      };

      const { error } = await supabaseClient.from('motoristas').insert([novo]);
      if (error) {
        alert("Erro: " + error.message);
      } else {
        alert("Cadastro enviado! Aguarde a aprovação do administrador.");
        alternarTelaMot('login');
      }
    }
  </script>
</body>
</html>
