<section class="p-5 flex-1 flex flex-col justify-center space-y-4 z-30 bg-slate-50 dark:bg-slate-900 overflow-y-auto">
  <div class="text-center space-y-1">
    <h2 class="text-xl font-extrabold text-slate-900 dark:text-white">Portal do Motorista</h2>
    <p class="text-xs text-slate-500 dark:text-slate-400">Cadastre-se ou acesse sua conta.</p>
  </div>

  <div class="grid grid-cols-2 bg-slate-200 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold">
    <button type="button" id="btn-tab-cad-mot" onclick="alternarAuthMot('cadastro')" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white py-2 rounded-lg shadow-sm transition">Criar Conta</button>
    <button type="button" id="btn-tab-log-mot" onclick="alternarAuthMot('login')" class="text-slate-600 dark:text-slate-400 py-2 rounded-lg transition">Entrar</button>
  </div>

  <!-- CADASTRO -->
  <form id="form-cad-mot" onsubmit="cadastrarMotorista(event)" class="space-y-3 bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm text-xs">
    <div class="flex flex-col items-center space-y-2 pb-1">
      <label for="input-foto-mot" class="cursor-pointer relative">
        <img id="preview-foto-mot" src="https://ui-avatars.com/api/?name=Motorista&background=e2e8f0&color=475569&size=150" class="w-20 h-20 rounded-full object-cover border-4 border-emerald-500 shadow" />
        <span class="absolute bottom-0 right-0 bg-slate-900 text-white w-7 h-7 rounded-full flex items-center justify-center text-[10px]"><i class="fa-solid fa-camera"></i></span>
      </label>
      <input type="file" id="input-foto-mot" accept="image/*" required onchange="processarFotoMot(event)" class="hidden" />
      <span class="text-[10px] font-bold text-red-600">* Foto de perfil obrigatória</span>
    </div>

    <div>
      <label class="font-bold text-slate-700 dark:text-slate-300">Nome Completo</label>
      <input type="text" id="cad-mot-nome" required placeholder="Seu nome" class="w-full mt-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl dark:text-white" />
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="font-bold text-slate-700 dark:text-slate-300">Telefone / WhatsApp</label>
        <input type="tel" id="cad-mot-tel" required placeholder="48999998888" class="w-full mt-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl dark:text-white" />
      </div>
      <div>
        <label class="font-bold text-slate-700 dark:text-slate-300">Senha</label>
        <input type="password" id="cad-mot-senha" required placeholder="Senha" class="w-full mt-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl dark:text-white" />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="font-bold text-slate-700 dark:text-slate-300">CPF</label>
        <input type="text" id="cad-mot-cpf" required placeholder="000.000.000-00" class="w-full mt-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl dark:text-white" />
      </div>
      <div>
        <label class="font-bold text-slate-700 dark:text-slate-300">Placa do Veículo</label>
        <input type="text" id="cad-mot-placa" required placeholder="ABC1D23" class="w-full mt-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl uppercase dark:text-white" />
      </div>
    </div>

    <div>
      <label class="font-bold text-slate-700 dark:text-slate-300">Modelo do Veículo</label>
      <input type="text" id="cad-mot-modelo" required placeholder="Ex: Renault Logan Branco" class="w-full mt-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl dark:text-white" />
    </div>

    <div>
      <label class="font-bold text-slate-700 dark:text-slate-300">Endereço Residencial</label>
      <input type="text" id="cad-mot-end" required placeholder="Rua, Bairro, Laguna - SC" class="w-full mt-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl dark:text-white" />
    </div>

    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition">Solicitar Cadastro de Motorista</button>
  </form>

  <!-- LOGIN -->
  <form id="form-log-mot" onsubmit="entrarMotorista(event)" class="hidden space-y-3 bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm text-xs">
    <div>
      <label class="font-bold text-slate-700 dark:text-slate-300">Telefone</label>
      <input type="tel" id="log-mot-tel" required placeholder="48999998888" class="w-full mt-1 px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl dark:text-white" />
    </div>
    <div>
      <label class="font-bold text-slate-700 dark:text-slate-300">Senha</label>
      <input type="password" id="log-mot-senha" required placeholder="Senha" class="w-full mt-1 px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl dark:text-white" />
    </div>
    <button type="submit" class="w-full bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow transition">Entrar no Painel</button>
  </form>
</section>

<!-- MODAL DE SENHA TEMPORÁRIA -->
<div id="modal-senha-mot" class="hidden fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-sm w-full p-6 space-y-4 border-2 border-amber-500 shadow-2xl text-xs">
    <div class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-xl mx-auto">
      <i class="fa-solid fa-key"></i>
    </div>
    <div class="text-center space-y-1">
      <h3 class="text-base font-extrabold text-slate-900 dark:text-white">Criar Nova Senha</h3>
      <p class="text-slate-500">Defina sua senha pessoal definitiva.</p>
    </div>
    <div>
      <label class="font-bold text-slate-700 dark:text-slate-300">Nova Senha</label>
      <input type="password" id="nova-senha-mot-input" placeholder="Digite a nova senha" class="w-full mt-1 px-3 py-2.5 bg-slate-100 dark:bg-slate-800 border border-slate-700 rounded-xl dark:text-white" />
    </div>
    <button type="button" onclick="salvarNovaSenhaMot()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow">Salvar Senha e Entrar</button>
  </div>
</div>

<script>
  let fotoMotBase64 = '';

  function inicializarAuthMotorista() {}

  window.alternarAuthMot = function(aba) {
    const isCad = aba === 'cadastro';
    document.getElementById('form-cad-mot').classList.toggle('hidden', !isCad);
    document.getElementById('form-log-mot').classList.toggle('hidden', isCad);
    
    document.getElementById('btn-tab-cad-mot').className = isCad ? "bg-white dark:bg-slate-700 text-slate-900 dark:text-white py-2 rounded-lg shadow-sm transition text-xs font-bold" : "text-slate-600 dark:text-slate-400 py-2 rounded-lg transition text-xs font-bold";
    document.getElementById('btn-tab-log-mot').className = !isCad ? "bg-white dark:bg-slate-700 text-slate-900 dark:text-white py-2 rounded-lg shadow-sm transition text-xs font-bold" : "text-slate-600 dark:text-slate-400 py-2 rounded-lg transition text-xs font-bold";
  };

  function processarFotoMot(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const scale = 220 / Math.max(img.width, img.height);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        fotoMotBase64 = canvas.toDataURL('image/jpeg', 0.75);
        document.getElementById('preview-foto-mot').src = fotoMotBase64;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  window.cadastrarMotorista = async function(e) {
    e.preventDefault();
    if (!fotoMotBase64) { alert('Foto obrigatória.'); return; }

    const novo = {
      tipo: 'motorista',
      nome: document.getElementById('cad-mot-nome').value.trim(),
      telefone: document.getElementById('cad-mot-tel').value.trim(),
      senha: document.getElementById('cad-mot-senha').value.trim(),
      cpf: document.getElementById('cad-mot-cpf').value.trim(),
      veiculo_placa: document.getElementById('cad-mot-placa').value.trim().toUpperCase(),
      veiculo_modelo: document.getElementById('cad-mot-modelo').value.trim(),
      endereco: document.getElementById('cad-mot-end').value.trim(),
      foto_url: fotoMotBase64,
      status_aprovacao: 'pendente',
      online: false
    };

    const { data, error } = await db.from('usuarios').insert([novo]).select().single();
    if (error) { alert('Erro: ' + error.message); return; }
    
    motoristaAtual = data;
    localStorage.setItem('motorista_logado', JSON.stringify(data));
    alert('Cadastro enviado! Aguarde a aprovação da central administrativa.');
    sairContaMotorista();
  };

  window.entrarMotorista = async function(e) {
    e.preventDefault();
    const tel = document.getElementById('log-mot-tel').value.trim();
    const senha = document.getElementById('log-mot-senha').value.trim();

    const { data, error } = await db.from('usuarios').select('*').eq('telefone', tel).eq('senha', senha).eq('tipo', 'motorista').single();
    if (error || !data) { alert('Telefone ou senha incorretos.'); return; }

    if (data.banido) { alert('Esta conta está bloqueada.'); return; }
    if (data.status_aprovacao !== 'aprovado') { alert('Seu cadastro ainda está pendente de aprovação pela central.'); return; }

    motoristaAtual = data;
    localStorage.setItem('motorista_logado', JSON.stringify(data));

    if (data.senha_temporaria) {
      document.getElementById('modal-senha-mot').classList.remove('hidden');
      return;
    }

    document.getElementById('menu-inferior-motorista').classList.remove('hidden');
    atualizarBotaoStatusTopo();
    carregarAbaMotorista('painel');
  };

  window.salvarNovaSenhaMot = async function() {
    const nova = document.getElementById('nova-senha-mot-input').value.trim();
    if (!nova) return;

    const { data } = await db.from('usuarios').update({ senha: nova, senha_temporaria: false }).eq('id', motoristaAtual.id).select().single();
    if (data) {
      motoristaAtual = data;
      localStorage.setItem('motorista_logado', JSON.stringify(data));
      document.getElementById('modal-senha-mot').classList.add('hidden');
      document.getElementById('menu-inferior-motorista').classList.remove('hidden');
      atualizarBotaoStatusTopo();
      carregarAbaMotorista('painel');
    }
  };
</script>
