<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobilidade Laguna - Motorista</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl space-y-5">
    
    <div class="text-center space-y-1">
      <div class="inline-block bg-amber-600/20 border border-amber-500/30 text-amber-400 p-3 rounded-2xl mb-1">
        <i class="fa-solid fa-car text-xl"></i>
      </div>
      <h1 class="text-lg font-extrabold text-white">Portal do Motorista</h1>
      <p class="text-xs text-slate-400">Entre com celular e senha para trabalhar</p>
    </div>

    <!-- CAIXA DE ALERTA DE ERRO VISUAL -->
    <div id="box-erro" class="hidden bg-red-950/80 border border-red-600 text-red-200 text-xs p-3 rounded-xl flex items-center gap-2">
      <i class="fa-solid fa-triangle-exclamation text-red-400 text-base shrink-0"></i>
      <span id="texto-erro">Erro ao realizar login.</span>
    </div>

    <!-- LOGIN -->
    <form class="space-y-4 text-xs" onsubmit="realizarLoginMotorista(event)">
      <div>
        <label class="text-[10px] text-slate-400 ml-1">Celular / Telefone</label>
        <input type="tel" id="login-celular-motorista" required placeholder="(00) 00000-0000" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500">
      </div>
      <div>
        <label class="text-[10px] text-slate-400 ml-1">Senha</label>
        <input type="password" id="login-senha-motorista" required placeholder="Sua senha" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500">
      </div>
      <button type="submit" id="btn-entrar" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl shadow-lg transition">Entrar como Motorista</button>
    </form>

    <div class="text-center text-[11px] text-slate-500 space-y-2 pt-2 border-t border-slate-800">
      <div class="flex justify-center gap-4">
        <a href="auth.html" class="text-emerald-400 hover:underline">Voltar para Passageiro</a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mmcwmzesjtnqgpcdspir.supabase.co';[cite: 6]
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tY3dtemVzanRucWdwY2RzcGlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NTgyMzUsImV4cCI6MjExMDAzNDIzNX0.VfOyJpZ5Xl30CvLtP-ZpAl1BO1ijVU8ChpabOPmel-E';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function mostrarErro(mensagem) {
      const box = document.getElementById('box-erro');
      const texto = document.getElementById('texto-erro');
      texto.innerText = mensagem;
      box.classList.remove('hidden');
    }

    async function realizarLoginMotorista(e) {
      e.preventDefault(); // Impede qualquer comportamento de recarregamento indesejado (F5)
      document.getElementById('box-erro').classList.add('hidden');
      
      const cel = document.getElementById('login-celular-motorista'].value.trim();
      const senha = document.getElementById('login-senha-motorista'].value;
      const btn = document.getElementById('btn-entrar');

      btn.innerText = "Verificando...";
      btn.disabled = true;

      try {
        let data = null;

        // 1. Tenta buscar na tabela específica de motoristas
        const resMotoristas = await supabaseClient
          .from('motoristas')
          .select('*')
          .eq('telefone', cel)
          .eq('senha', senha)
          .maybeSingle();

        if (resMotoristas.data) {
          data = resMotoristas.data;
          data.tipo = 'motorista';
        } else {
          // 2. Se não achou na tabela 'motoristas', busca na tabela geral 'usuarios' MAS exige que seja motorista (tenha veiculo ou tipo motorista)
          const resUsuarios = await supabaseClient
            .from('usuarios')
            .select('*')
            .eq('telefone', cel)
            .eq('senha', senha)
            .maybeSingle();

          if (resUsuarios.data) {
            const usuarioEncontrado = resUsuarios.data;
            // Validação de segurança: Passageiro comum não pode logar aqui
            if (usuarioEncontrado.tipo !== 'motorista' && !usuarioEncontrado.veiculo_modelo) {
              throw new Error("Esta conta pertence a um passageiro. Acesso negado ao portal do motorista.");
            }
            data = usuarioEncontrado;
            data.tipo = 'motorista';
          }
        }

        if (!data) {
          throw new Error("Telefone ou senha de motorista inválidos.");
        }

        if (data.status === 'bloqueado' || data.status === 'pendente') {
          throw new Error("Sua conta está bloqueada ou pendente de aprovação.");
        }

        // Gera token de sessão
        const sessionToken = 'sessao_' + Math.random().toString(36).substring(2) + Date.now().toString(36);

        // Limpa sessões anteriores e grava a nova sessão de motorista
        localStorage.removeItem('passageiro_logado');
        data.session_token = sessionToken;
        localStorage.setItem('motorista_logado', JSON.stringify(data));
        localStorage.setItem('session_token', sessionToken);
        
        // Redireciona para o painel correto do motorista
        window.location.href = 'motorista.html';

      } catch (err) {
        mostrarErro(err.message || "Erro de conexão ao tentar autenticar.");
        btn.innerText = "Entrar como Motorista";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
