<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobilidade Laguna - Motorista</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl space-y-5">
    
    <div class="text-center space-y-1">
      <div class="inline-block bg-amber-600/20 border border-amber-500/30 text-amber-400 p-3 rounded-2xl mb-1">
        <i class="fa-solid fa-car text-xl"></i>
      </div>
      <h1 id="titulo-motorista" class="text-lg font-extrabold text-white">Portal do Motorista</h1>
      <p id="subtitulo-motorista" class="text-xs text-slate-400">Entre com celular e senha para trabalhar</p>
    </div>

    <!-- ==================== LOGIN MOTORISTA ==================== -->
    <form id="form-login-motorista" class="space-y-4 text-xs" onsubmit="realizarLoginMotorista(event)">
      <div class="space-y-1">
        <label class="text-slate-300 font-medium">Número de Celular</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
            <i class="fa-solid fa-phone"></i>
          </span>
          <input type="tel" id="login-celular-motorista" required placeholder="(48) 9 9999-9999" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 pl-9 text-slate-100 focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <div class="space-y-1">
        <label class="text-slate-300 font-medium">Senha</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="login-senha-motorista" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 pl-9 text-slate-100 focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl shadow-lg transition">
        Entrar como Motorista
      </button>
    </form>

    <!-- ==================== MODAL DE SELFIE (15 EM 15 DIAS) ==================== -->
    <div id="box-reval-mot" class="hidden space-y-3 text-center text-xs bg-slate-950 p-4 rounded-2xl border border-amber-500/40">
      <p class="text-amber-400 font-bold"><i class="fa-solid fa-shield-halved mr-1"></i> Validação Facial Obrigatória (15 dias)</p>
      <p class="text-slate-400 text-[11px]">Tire uma selfie atual para confirmar sua identidade antes de ficar online.</p>
      <div class="w-24 h-24 mx-auto rounded-full overflow-hidden border-2 border-amber-500 bg-slate-900">
        <video id="video-reval-mot" class="w-full h-full object-cover" autoplay playsinline></video>
      </div>
      <button type="button" onclick="confirmarRevalMot()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 rounded-xl">
        <i class="fa-solid fa-camera mr-1"></i> Confirmar Selfie e Entrar
      </button>
    </div>

    <!-- ==================== CADASTRO MOTORISTA ==================== -->
    <form id="form-cadastro-motorista" class="hidden space-y-3 text-xs" onsubmit="realizarCadastroMotorista(event)">
      
      <div class="flex flex-col items-center space-y-2 pb-2 border-b border-slate-800">
        <div class="relative w-20 h-20 rounded-full bg-slate-950 border-2 border-dashed border-amber-500/60 flex items-center justify-center overflow-hidden">
          <img id="preview-selfie-mot" class="hidden w-full h-full object-cover" />
          <video id="camera-stream-mot" class="hidden w-full h-full object-cover" autoplay playsinline></video>
          <i id="icone-camera-mot" class="fa-solid fa-camera text-slate-500 text-xl"></i>
        </div>
        <div class="flex gap-2">
          <button type="button" id="btn-abrir-cam-mot" onclick="iniciarCameraMot()" class="bg-slate-800 text-amber-400 px-3 py-1 rounded-lg text-[11px] font-bold border border-slate-700">
            <i class="fa-solid fa-camera mr-1"></i> Selfie Obrigatória
          </button>
          <button type="button" id="btn-capturar-cam-mot" onclick="capturarSelfieMot()" class="hidden bg-amber-600 text-white px-3 py-1 rounded-lg text-[11px] font-bold">
            <i class="fa-solid fa-check mr-1"></i> Confirmar
          </button>
        </div>
        <canvas id="canvas-selfie-mot" class="hidden"></canvas>
      </div>

      <div class="space-y-1">
        <label class="text-slate-300 font-medium">Nome Completo</label>
        <input type="text" id="cad-mot-nome" required placeholder="Nome completo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-500">
      </div>

      <div class="space-y-1">
        <label class="text-slate-300 font-medium">CPF</label>
        <input type="text" id="cad-mot-cpf" required placeholder="000.000.000-00" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-500">
      </div>

      <!-- CELULAR + SMS -->
      <div class="space-y-1">
        <label class="text-slate-300 font-medium">Celular (com SMS)</label>
        <div class="flex gap-2">
          <input type="tel" id="cad-mot-celular" required placeholder="(48) 9 9999-9999" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-500">
          <button type="button" onclick="enviarSMSMot()" class="bg-amber-600/20 text-amber-400 border border-amber-500/40 px-3 rounded-xl font-bold text-[11px] whitespace-nowrap">
            Enviar SMS
          </button>
        </div>
      </div>

      <div id="box-sms-mot" class="hidden space-y-1 bg-slate-950 p-2.5 rounded-xl border border-amber-500/30">
        <label class="text-amber-400 font-bold text-[11px]">Código SMS (4 dígitos)</label>
        <div class="flex gap-2">
          <input type="text" id="input-sms-mot" maxlength="4" placeholder="0000" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-center tracking-widest font-extrabold text-white">
          <button type="button" onclick="validarSMSMot()" class="bg-amber-600 text-white px-3 rounded-lg font-bold text-[11px]">Validar</button>
        </div>
        <p id="status-sms-mot" class="text-[10px] text-slate-400"></p>
      </div>

      <!-- ENDEREÇO -->
      <div class="space-y-1">
        <div class="flex justify-between items-center">
          <label class="text-slate-300 font-medium">Endereço Residencial</label>
          <button type="button" onclick="obterEnderecoMotorista()" class="text-[10px] bg-amber-600/20 text-amber-400 px-2 py-0.5 rounded-md border border-amber-500/30 font-bold">
            <i class="fa-solid fa-location-crosshairs mr-1"></i> Meu Endereço
          </button>
        </div>
        <input type="text" id="cad-mot-endereco" required placeholder="Rua, número e bairro" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-500">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div class="space-y-1">
          <label class="text-slate-300 font-medium">Veículo</label>
          <input type="text" id="cad-mot-veiculo" required placeholder="Ex: Logan Branco" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-500">
        </div>
        <div class="space-y-1">
          <label class="text-slate-300 font-medium">Placa</label>
          <input type="text" id="cad-mot-placa" required placeholder="ABC1D23" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 uppercase focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <!-- SENHA PARA LOGIN -->
      <div class="space-y-1">
        <label class="text-slate-300 font-medium">Criar Senha de Acesso</label>
        <input type="password" id="cad-mot-senha" required minlength="4" placeholder="Mínimo 4 caracteres" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-500">
      </div>

      <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl shadow-lg transition mt-2">
        Enviar Cadastro para Aprovação
      </button>
    </form>

    <div class="text-center text-[11px] text-slate-500 space-y-2 pt-2 border-t border-slate-800">
      <div id="texto-alt-mot">
        Ainda não é parceiro? <button type="button" onclick="alternarTelaMot('cadastro')" class="text-amber-400 font-bold hover:underline">Cadastre seu veículo</button>
      </div>
      <div class="flex justify-center gap-4">
        <a href="auth.html" class="text-slate-400 hover:text-slate-200 underline">Sou Passageiro</a>
        <a href="admin.html" class="text-slate-500 hover:text-slate-300 underline">Painel Admin</a>
      </div>
    </div>

  </div>

  <script>
    let streamMot = null;
    let fotoMotBase64 = null;
    let codigoSMSMot = null;
    let smsMotOk = false;
    let motPendenteReval = null;

    function alternarTelaMot(modo) {
      const fLogin = document.getElementById('form-login-motorista');
      const fCad = document.getElementById('form-cadastro-motorista');
      const tit = document.getElementById('titulo-motorista');
      const sub = document.getElementById('subtitulo-motorista');
      const txtAlt = document.getElementById('texto-alt-mot');

      if (modo === 'cadastro') {
        fLogin.classList.add('hidden');
        fCad.classList.remove('hidden');
        tit.innerText = "Cadastro de Motorista";
        sub.innerText = "Sujeito à aprovação da administração";
        txtAlt.innerHTML = 'Já é cadastrado? <button type="button" onclick="alternarTelaMot(\'login\')" class="text-amber-400 font-bold hover:underline">Fazer Login</button>';
      } else {
        pararCameraMot();
        fCad.classList.add('hidden');
        fLogin.classList.remove('hidden');
        tit.innerText = "Portal do Motorista";
        sub.innerText = "Entre com celular e senha para trabalhar";
        txtAlt.innerHTML = 'Ainda não é parceiro? <button type="button" onclick="alternarTelaMot(\'cadastro\')" class="text-amber-400 font-bold hover:underline">Cadastre seu veículo</button>';
      }
    }

    function enviarSMSMot() {
      const cel = document.getElementById('cad-mot-celular').value.trim();
      if (cel.length < 8) return alert("Informe um celular válido.");
      codigoSMSMot = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('box-sms-mot').classList.remove('hidden');
      document.getElementById('status-sms-mot').innerText = `Código SMS enviado para ${cel}. (Teste: ${codigoSMSMot})`;
    }

    function validarSMSMot() {
      if (document.getElementById('input-sms-mot').value.trim() === codigoSMSMot) {
        smsMotOk = true;
        document.getElementById('status-sms-mot').innerHTML = '<span class="text-emerald-400 font-bold"><i class="fa-solid fa-circle-check"></i> Celular confirmado!</span>';
      } else {
        alert("Código SMS inválido.");
      }
    }

    function obterEnderecoMotorista() {
      const campo = document.getElementById('cad-mot-endereco');
      if (!navigator.geolocation) return alert("GPS não suportado.");
      campo.value = "Localizando...";
      navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
          const d = await res.json();
          campo.value = `${d.address.road || ''}, ${d.address.suburb || d.address.neighbourhood || ''} - ${d.address.city || d.address.town || 'Laguna'}`;
        } catch {
          campo.value = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
        }
      }, () => { campo.value = ""; alert("Permissão de GPS negada."); });
    }

    async function iniciarCameraMot() {
      try {
        streamMot = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        const video = document.getElementById('camera-stream-mot');
        video.srcObject = streamMot;
        video.classList.remove('hidden');
        document.getElementById('icone-camera-mot').classList.add('hidden');
        document.getElementById('preview-selfie-mot').classList.add('hidden');
        document.getElementById('btn-abrir-cam-mot').classList.add('hidden');
        document.getElementById('btn-capturar-cam-mot').classList.remove('hidden');
      } catch { alert("Erro ao acessar câmera."); }
    }

    function capturarSelfieMot() {
      const video = document.getElementById('camera-stream-mot');
      const canvas = document.getElementById('canvas-selfie-mot');
      const preview = document.getElementById('preview-selfie-mot');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      fotoMotBase64 = canvas.toDataURL('image/jpeg', 0.8);
      preview.src = fotoMotBase64;
      preview.classList.remove('hidden');
      video.classList.add('hidden');
      document.getElementById('btn-capturar-cam-mot').classList.add('hidden');
      document.getElementById('btn-abrir-cam-mot').innerHTML = '<i class="fa-solid fa-rotate-right mr-1"></i> Refazer';
      document.getElementById('btn-abrir-cam-mot').classList.remove('hidden');
      pararCameraMot();
    }

    function pararCameraMot() {
      if (streamMot) {
        streamMot.getTracks().forEach(t => t.stop());
        streamMot = null;
      }
    }

    function passou15Dias(dataISO) {
      if (!dataISO) return true;
      return ((new Date() - new Date(dataISO)) / (1000 * 60 * 60 * 24)) >= 15;
    }

    async function realizarLoginMotorista(e) {
      e.preventDefault();
      const cel = document.getElementById('login-celular-motorista').value.trim();
      const senha = document.getElementById('login-senha-motorista').value;

      const lista = JSON.parse(localStorage.getItem('lista_motoristas') || '[]');
      const encontrado = lista.find(m => m.telefone === cel && m.senha === senha);

      if (!encontrado) {
        alert("Celular ou senha não encontrados.");
        return;
      }

      if (encontrado.status !== 'aprovado') {
        alert("Seu cadastro de motorista ainda está AGUARDANDO APROVAÇÃO do administrador.");
        return;
      }

      if (passou15Dias(encontrado.ultima_verificacao_facial)) {
        motPendenteReval = encontrado;
        document.getElementById('form-login-motorista').classList.add('hidden');
        document.getElementById('box-reval-mot').classList.remove('hidden');
        streamMot = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById('video-reval-mot').srcObject = streamMot;
        return;
      }

      localStorage.setItem('motorista_logado', JSON.stringify(encontrado));
      window.location.href = 'motorista.html';
    }

    function confirmarRevalMot() {
      const video = document.getElementById('video-reval-mot');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      motPendenteReval.foto_url = canvas.toDataURL('image/jpeg', 0.8);
      motPendenteReval.ultima_verificacao_facial = new Date().toISOString();
      pararCameraMot();

      const lista = JSON.parse(localStorage.getItem('lista_motoristas') || '[]');
      const idx = lista.findIndex(m => m.id === motPendenteReval.id);
      if (idx !== -1) lista[idx] = motPendenteReval;
      localStorage.setItem('lista_motoristas', JSON.stringify(lista));
      localStorage.setItem('motorista_logado', JSON.stringify(motPendenteReval));

      window.location.href = 'motorista.html';
    }

    function realizarCadastroMotorista(e) {
      e.preventDefault();
      if (!fotoMotBase64) return alert("A selfie facial é obrigatória.");
      if (!smsMotOk) return alert("Valide seu celular via SMS.");

      const agora = new Date();
      const novoMotorista = {
        id: 'MOT-' + Date.now(),
        nome: document.getElementById('cad-mot-nome').value,
        cpf: document.getElementById('cad-mot-cpf').value,
        telefone: document.getElementById('cad-mot-celular').value.trim(),
        endereco: document.getElementById('cad-mot-endereco').value,
        veiculo_modelo: document.getElementById('cad-mot-veiculo').value,
        veiculo_placa: document.getElementById('cad-mot-placa').value.toUpperCase(),
        senha: document.getElementById('cad-mot-senha').value,
        foto_url: fotoMotBase64,
        tipo: 'motorista',
        status: 'pendente', // Precisa ser aprovado no admin.html
        data_cadastro: agora.toLocaleDateString('pt-BR') + ' às ' + agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}),
        ultima_verificacao_facial: agora.toISOString()
      };

      const lista = JSON.parse(localStorage.getItem('lista_motoristas') || '[]');
      lista.push(novoMotorista);
      localStorage.setItem('lista_motoristas', JSON.stringify(lista));

      alert("Cadastro enviado! Aguarde a aprovação do administrador para iniciar as corridas.");
      alternarTelaMot('login');
    }
  </script>
</body>
</html>
