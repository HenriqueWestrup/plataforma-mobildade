<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Perfil - Mobilidade Laguna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden m-0 p-0">

  <!-- TOPO -->
  <header class="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center shrink-0">
    <div class="flex items-center gap-2">
      <div class="bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 p-2 rounded-xl">
        <i class="fa-solid fa-user text-sm"></i>
      </div>
      <div>
        <h1 class="text-sm font-extrabold text-white">Meu Perfil</h1>
        <span class="text-[10px] text-slate-400">Gerencie suas informações</span>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO CENTRAL COM SCROLL E ESPAÇO PARA A BARRA INFERIOR -->
  <main class="flex-1 overflow-y-auto p-4 pb-24 space-y-4">
    <div class="bg-slate-900 p-5 rounded-3xl space-y-4 border border-slate-800 text-center shadow-lg">
      <div class="relative w-24 h-24 mx-auto">
        <img id="perfil-foto" src="" class="w-24 h-24 rounded-full object-cover border-4 border-emerald-500 shadow" />
        <span id="selo-tipo-usuario" class="hidden absolute bottom-0 right-0 bg-emerald-600 text-white p-1.5 rounded-full text-[10px]">
          <i class="fa-solid fa-car"></i>
        </span>
      </div>

      <div>
        <h3 class="text-base font-extrabold text-white" id="perfil-nome">-</h3>
        <span id="badge-tipo-texto" class="inline-block mt-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-300">Carregando...</span>
        <p class="text-xs text-amber-500 font-bold mt-1"><i class="fa-solid fa-star"></i> <span id="perfil-nota">5.0</span></p>
      </div>

      <div class="space-y-2 text-slate-300 text-left bg-slate-950 p-3.5 rounded-2xl border border-slate-800 text-xs">
        <p><strong>Telefone:</strong> <span id="perfil-tel">-</span></p>
        <p><strong>CPF:</strong> <span id="perfil-cpf">-</span></p>
        <p><strong>Membro desde:</strong> <span id="perfil-data-cadastro" class="text-emerald-400 font-semibold">-</span></p>
        
        <div id="bloco-veiculo" class="hidden space-y-1.5 border-t border-slate-800 pt-2 mt-2">
          <p><strong>Veículo:</strong> <span id="perfil-veiculo">-</span></p>
          <p><strong>Placa:</strong> <span id="perfil-placa" class="uppercase font-bold text-emerald-400">-</span></p>
        </div>

        <div class="border-t border-slate-800 pt-2 mt-2">
          <div class="flex justify-between items-center">
            <strong>Endereço:</strong>
            <button onclick="editarEnderecoPerfil()" class="text-[10px] text-emerald-400 hover:underline font-bold">
              <i class="fa-solid fa-pen mr-0.5"></i> Editar
            </button>
          </div>
          <p id="perfil-end" class="text-slate-400 mt-0.5">-</p>
        </div>
      </div>

      <button onclick="sairContaUnificada()" class="w-full bg-red-950/40 text-red-400 font-bold py-2.5 rounded-xl border border-red-800 hover:bg-red-900/40 transition text-xs">
        Sair da Conta
      </button>
    </div>
  </main>

  <!-- BARRA DE NAVEGAÇÃO INFERIOR FIXA -->
  <nav class="absolute bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 py-3 px-6 flex justify-around items-center z-50">
    <a href="index.html" class="text-slate-400 hover:text-slate-200 flex flex-col items-center gap-1">
      <i class="fa-solid fa-house text-base"></i>
      <span class="text-[10px]">Início</span>
    </a>
    <a href="corridas.html" class="text-slate-400 hover:text-slate-200 flex flex-col items-center gap-1">
      <i class="fa-solid fa-clock-rotate-left text-base"></i>
      <span class="text-[10px]">Histórico</span>
    </a>
    <a href="perfil.html" class="text-emerald-400 flex flex-col items-center gap-1">
      <i class="fa-solid fa-user text-base"></i>
      <span class="text-[10px]">Perfil</span>
    </a>
  </nav>

  <script>
    function carregarModuloPerfil() {
      const dadosUsuario = JSON.parse(localStorage.getItem('motorista_logado') || localStorage.getItem('passageiro_logado') || '{}');
      if (!dadosUsuario || !dadosUsuario.id) {
        window.location.href = 'auth.html';
        return;
      }

      document.getElementById('perfil-foto').src = dadosUsuario.foto_url || 'https://ui-avatars.com/api/?name=Usuario';
      document.getElementById('perfil-nome').innerText = dadosUsuario.nome || '-';
      document.getElementById('perfil-nota').innerText = Number(dadosUsuario.nota_media || 5.0).toFixed(2);
      document.getElementById('perfil-tel').innerText = dadosUsuario.telefone || '-';
      document.getElementById('perfil-cpf').innerText = dadosUsuario.cpf || '-';
      document.getElementById('perfil-data-cadastro').innerText = dadosUsuario.data_cadastro || 'Recente';
      document.getElementById('perfil-end').innerText = dadosUsuario.endereco || '-';

      const badgeTexto = document.getElementById('badge-tipo-texto');
      const seloIcone = document.getElementById('selo-tipo-usuario');

      if (dadosUsuario.tipo === 'motorista') {
        badgeTexto.innerText = "Motorista Parceiro";
        badgeTexto.className = "inline-block mt-1 px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        seloIcone.classList.remove('hidden');
        document.getElementById('bloco-veiculo').classList.remove('hidden');
        document.getElementById('perfil-veiculo').innerText = dadosUsuario.veiculo_modelo || '-';
        document.getElementById('perfil-placa').innerText = dadosUsuario.veiculo_placa || '-';
      } else {
        badgeTexto.innerText = "Passageiro";
        badgeTexto.className = "inline-block mt-1 px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-sky-500/20 text-sky-400 border border-sky-500/30";
        seloIcone.classList.add('hidden');
        document.getElementById('bloco-veiculo').classList.add('hidden');
      }
    }

    function editarEnderecoPerfil() {
      const novoEnd = prompt("Digite o novo endereço:", document.getElementById('perfil-end').innerText);
      if (!novoEnd || !novoEnd.trim()) return;

      const chave = localStorage.getItem('motorista_logado') ? 'motorista_logado' : 'passageiro_logado';
      const dados = JSON.parse(localStorage.getItem(chave) || '{}');
      dados.endereco = novoEnd.trim();
      localStorage.setItem(chave, JSON.stringify(dados));
      document.getElementById('perfil-end').innerText = dados.endereco;
    }

    function sairContaUnificada() {
      localStorage.removeItem('passageiro_logado');
      localStorage.removeItem('motorista_logado');
      location.href = 'auth.html';
    }

    window.onload = carregarModuloPerfil;
  </script>
</body>
</html>
