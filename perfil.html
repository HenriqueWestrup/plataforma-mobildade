<div class="p-5 flex-1 overflow-y-auto space-y-4 bg-slate-50 dark:bg-slate-900">
  <div class="bg-white dark:bg-slate-800 p-5 rounded-3xl space-y-4 border border-slate-200 dark:border-slate-700 text-center shadow-sm">
    <img id="perfil-foto-pass" src="" class="w-24 h-24 rounded-full object-cover border-4 border-emerald-500 mx-auto shadow" />
    <div>
      <h3 class="text-base font-extrabold text-slate-900 dark:text-white" id="perfil-nome-pass">-</h3>
      <p class="text-xs text-amber-500 font-bold mt-0.5"><i class="fa-solid fa-star"></i> <span id="perfil-nota-pass">5.0</span></p>
    </div>

    <div class="text-xs space-y-1.5 text-slate-700 dark:text-slate-300 text-left bg-slate-50 dark:bg-slate-900 p-3 rounded-2xl">
      <p><strong>Telefone:</strong> <span id="perfil-tel-pass">-</span></p>
      <p><strong>CPF:</strong> <span id="perfil-cpf-pass">-</span></p>
      <p><strong>Endereço:</strong> <span id="perfil-end-pass">-</span></p>
    </div>

    <button onclick="sairConta()" class="w-full bg-red-50 text-red-600 dark:bg-red-950/40 dark:text-red-400 font-bold py-2.5 rounded-xl text-xs border border-red-200 dark:border-red-800">Sair da Conta</button>
  </div>
</div>

<script>
  function carregarModuloPerfil() {
    if (!usuarioAtual) return;
    document.getElementById('perfil-foto-pass').src = usuarioAtual.foto_url || '';
    document.getElementById('perfil-nome-pass').innerText = usuarioAtual.nome || '';
    document.getElementById('perfil-nota-pass').innerText = Number(usuarioAtual.nota_media || 5.0).toFixed(2);
    document.getElementById('perfil-tel-pass').innerText = usuarioAtual.telefone || '';
    document.getElementById('perfil-cpf-pass').innerText = usuarioAtual.cpf || '';
    document.getElementById('perfil-end-pass').innerText = usuarioAtual.endereco || '';
  }
</script>
