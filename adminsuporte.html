<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Admin Suporte - Mobilidade Laguna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden m-0 p-0 text-xs">

  <!-- ABAS SUPERIORES DA PÁGINA DE SUPORTE COM BADGES DE CONTAGEM -->
  <div class="bg-slate-900 border-b border-slate-800 p-3 grid grid-cols-2 gap-2 shrink-0">
    <button onclick="mudarAbaSup('chamados')" id="btn-aba-chamados" class="py-2.5 px-3 rounded-xl font-bold bg-emerald-600 text-white transition text-center shadow flex items-center justify-center gap-2">
      <span><i class="fa-solid fa-triangle-exclamation mr-1"></i> Chamados / Avaliações</span>
      <span id="badge-count-chamados" class="hidden bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full font-extrabold shadow">0</span>
    </button>
    <button onclick="mudarAbaSup('mensagens')" id="btn-aba-mensagens" class="py-2.5 px-3 rounded-xl font-bold bg-slate-800 text-slate-400 transition text-center shadow flex items-center justify-center gap-2">
      <span><i class="fa-solid fa-comments mr-1"></i> Central de Mensagens</span>
      <span id="badge-count-mensagens" class="hidden bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full font-extrabold shadow">0</span>
    </button>
  </div>

  <main class="flex-1 overflow-y-auto p-4 space-y-3 pb-16">
    
    <!-- SEÇÃO 1: CHAMADOS DE AVALIAÇÃO COM ABAS INTERNAS (MOTORISTAS X PASSAGEIROS) -->
    <div id="secao-chamados" class="space-y-3">
      <div class="flex justify-between items-center bg-slate-900 p-3 rounded-2xl border border-slate-800">
        <span class="text-slate-400 text-[11px]">Gerenciamento de Alertas de Suporte e Avaliações</span>
        <button onclick="limparNotificacoesSuporte()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 transition text-[11px]">
          <i class="fa-solid fa-broom"></i> Limpar Notificações Visuais
        </button>
      </div>

      <!-- SUB-ABAS DE FILTRAGEM (MOTORISTAS X PASSAGEIROS) -->
      <div class="flex gap-2 bg-slate-900 p-2 rounded-2xl border border-slate-800">
        <button onclick="mudarSubAbaChamados('motoristas')" id="btn-subaba-motoristas" class="flex-1 py-2 rounded-xl font-bold bg-emerald-600 text-white text-center transition shadow text-[11px]">
          <i class="fa-solid fa-car mr-1"></i> Reportes de Motoristas
        </button>
        <button onclick="mudarSubAbaChamados('passageiros')" id="btn-subaba-passageiros" class="flex-1 py-2 rounded-xl font-bold bg-slate-800 text-slate-400 text-center transition shadow text-[11px]">
          <i class="fa-solid fa-user mr-1"></i> Reportes de Passageiros
        </button>
      </div>

      <div id="lista-admin-suporte" class="space-y-3">
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">Carregando chamados...</div>
      </div>
    </div>

    <!-- SEÇÃO 2: CENTRAL DE MENSAGENS DIRETAS -->
    <div id="secao-mensagens" class="space-y-3 hidden">
      <div class="bg-slate-900 p-3 rounded-2xl border border-slate-800 flex justify-between items-center">
        <span class="text-slate-300 font-bold"><i class="fa-solid fa-headset text-emerald-400 mr-1.5"></i> Conversas de Suporte Ativas</span>
        <span class="text-[10px] text-emerald-400 font-bold flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-ping"></span> Tempo Real Ativo
        </span>
      </div>
      <div id="lista-central-mensagens" class="space-y-3">
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">Carregando conversas...</div>
      </div>
    </div>

  </main>

  <!-- MODAL DE CHAT DIRETO NA CENTRAL DE MENSAGENS -->
  <div id="modal-chat-central" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-3xl p-5 space-y-4 shadow-2xl max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3 shrink-0">
        <div>
          <h3 id="chat-central-nome" class="font-extrabold text-white text-sm">Usuário</h3>
          <p id="chat-central-id" class="text-[10px] text-slate-400 font-mono">ID: -</p>
        </div>
        <button onclick="fecharChatCentral()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div id="chat-central-historico" class="flex-1 bg-slate-950 p-3 rounded-2xl border border-slate-800 overflow-y-auto space-y-2.5 max-h-60 text-xs">
        <p class="text-slate-500 text-center py-4">Carregando mensagens...</p>
      </div>

      <div class="space-y-2 pt-2 border-t border-slate-800 shrink-0">
        <textarea id="chat-central-input" rows="2" placeholder="Digite sua resposta para o usuário..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white text-xs outline-none focus:border-emerald-500"></textarea>
        <button onclick="enviarRespostaChatCentral()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl shadow transition">
          Enviar Resposta
        </button>
      </div>
    </div>
  </div>

  <script src="admin_shared.js"></script>
  <script>
    let suporteGlobal = [];
    let usuarioChatAtivoId = null;
    let abaSupAtual = 'chamados';
    let subAbaChamadosAtual = 'motoristas'; // 'motoristas' ou 'passageiros'
    let canalRealtimeAdminSuporte = null;

    function tocarSomAlertaAdmin() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const agora = audioCtx.currentTime;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, agora);
        osc.frequency.setValueAtTime(880.00, agora + 0.2);
        gain.gain.setValueAtTime(0.3, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.6);
        osc.start(agora);
        osc.stop(agora + 0.6);
      } catch (e) {}
    }

    function mudarAbaSup(aba) {
      abaSupAtual = aba;
      document.getElementById('secao-chamados').classList.toggle('hidden', aba !== 'chamados');
      document.getElementById('secao-mensagens').classList.toggle('hidden', aba !== 'mensagens');

      document.getElementById('btn-aba-chamados').className = aba === 'chamados' 
        ? 'py-2.5 px-3 rounded-xl font-bold bg-emerald-600 text-white transition text-center shadow flex items-center justify-center gap-2' 
        : 'py-2.5 px-3 rounded-xl font-bold bg-slate-800 text-slate-400 transition text-center shadow flex items-center justify-center gap-2';

      document.getElementById('btn-aba-mensagens').className = aba === 'mensagens' 
        ? 'py-2.5 px-3 rounded-xl font-bold bg-emerald-600 text-white transition text-center shadow flex items-center justify-center gap-2' 
        : 'py-2.5 px-3 rounded-xl font-bold bg-slate-800 text-slate-400 transition text-center shadow flex items-center justify-center gap-2';

      if (aba === 'mensagens') {
        carregarMensagensSuporteCentral();
      }
    }

    function mudarSubAbaChamados(subaba) {
      subAbaChamadosAtual = subaba;
      document.getElementById('btn-subaba-motoristas').className = subaba === 'motoristas' 
        ? 'flex-1 py-2 rounded-xl font-bold bg-emerald-600 text-white text-center transition shadow text-[11px]' 
        : 'flex-1 py-2 rounded-xl font-bold bg-slate-800 text-slate-400 text-center transition shadow text-[11px]';

      document.getElementById('btn-subaba-passageiros').className = subaba === 'passageiros' 
        ? 'flex-1 py-2 rounded-xl font-bold bg-emerald-600 text-white text-center transition shadow text-[11px]' 
        : 'flex-1 py-2 rounded-xl font-bold bg-slate-800 text-slate-400 text-center transition shadow text-[11px]';

      renderizarChamadosSuporte();
    }

    async function carregarPaginaAtual() {
      await carregarChamadosSuporte();
      await carregarContadorMensagensNovas();
      if (abaSupAtual === 'mensagens') {
        await carregarMensagensSuporteCentral();
      }
      iniciarEscutaRealtimeAdminSuporte();
    }

    function iniciarEscutaRealtimeAdminSuporte() {
      if (canalRealtimeAdminSuporte) supabaseClient.removeChannel(canalRealtimeAdminSuporte);

      canalRealtimeAdminSuporte = supabaseClient
        .channel('admin_suporte_instantaneo_v6')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensagens_suporte_app' }, payload => {
          if (payload.new && payload.new.remetente === 'passageiro') {
            tocarSomAlertaAdmin();
          }
          carregarContadorMensagensNovas();
          
          if (abaSupAtual === 'mensagens') {
            carregarMensagensSuporteCentral();
          }

          if (usuarioChatAtivoId && payload.new && String(payload.new.usuario_id) === String(usuarioChatAtivoId)) {
            carregarHistoricoChatCentral();
          }
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensagens_suporte' }, payload => {
          if (payload.new) {
            tocarSomAlertaAdmin();
            carregarChamadosSuporte();
          }
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'corridas' }, payload => {
          if (payload.new && (
              (payload.new.avaliacao_motorista && payload.new.avaliacao_motorista < 5) || 
              (payload.new.avaliacao_passageiro && payload.new.avaliacao_passageiro < 5)
          )) {
            tocarSomAlertaAdmin();
            carregarChamadosSuporte();
          }
        })
        .subscribe();
    }

    async function carregarChamadosSuporte() {
      const { data: corridasData } = await supabaseClient
        .from('corridas')
        .select('id, origem, destino, criado_em, avaliacao_motorista, motivo_avaliacao_motorista, avaliacao_passageiro, motivo_avaliacao_passageiro, motorista_id, passageiro_id, motorista:motorista_id(id, nome), passageiro:passageiro_id(id, nome)')
        .or('avaliacao_motorista.lt.5,avaliacao_passageiro.lt.5')
        .order('id', { ascending: false });

      const { data: msgsSupData } = await supabaseClient
        .from('mensagens_suporte')
        .select('*, usuario:usuario_id(id, nome, tipo)')
        .order('id', { ascending: false });

      let listaUnificada = [];

      if (corridasData) {
        corridasData.forEach(c => {
          if (c.avaliacao_motorista && c.avaliacao_motorista < 5) {
            listaUnificada.push({
              tipo_reporte: 'motorista_avalia_passageiro',
              id_unico: `corrida_mot_${c.id}`,
              id_referencia: c.id,
              autor_nome: c.motorista?.nome || 'Motorista',
              autor_id: c.motorista_id,
              alvo_nome: c.passageiro?.nome || 'Passageiro',
              alvo_id: c.passageiro_id,
              estrelas: c.avaliacao_motorista,
              origem: c.origem,
              destino: c.destino,
              observacao: c.motivo_avaliacao_motorista || 'Nenhuma observação informada.',
              criado_em: c.criado_em || new Date().toISOString()
            });
          }
          if (c.avaliacao_passageiro && c.avaliacao_passageiro < 5) {
            listaUnificada.push({
              tipo_reporte: 'passageiro_avalia_motorista',
              id_unico: `corrida_pass_${c.id}`,
              id_referencia: c.id,
              autor_nome: c.passageiro?.nome || 'Passageiro',
              autor_id: c.passageiro_id,
              alvo_nome: c.motorista?.nome || 'Motorista',
              alvo_id: c.motorista_id,
              estrelas: c.avaliacao_passageiro,
              origem: c.origem,
              destino: c.destino,
              observacao: c.motivo_avaliacao_passageiro || 'Nenhuma observação informada.',
              criado_em: c.criado_em || new Date().toISOString()
            });
          }
        });
      }

      if (msgsSupData) {
        msgsSupData.forEach(m => {
          const isMotorista = m.remetente === 'motorista';
          listaUnificada.push({
            tipo_reporte: isMotorista ? 'motorista_suporte' : 'passageiro_suporte',
            id_unico: `msg_sup_${m.id}`,
            id_referencia: m.id,
            autor_nome: m.usuario?.nome || (isMotorista ? 'Motorista Parceiro' : 'Passageiro'),
            autor_id: m.usuario_id,
            alvo_nome: 'Suporte Central',
            alvo_id: m.usuario_id,
            estrelas: null,
            origem: null,
            destino: null,
            observacao: m.mensagem || m.texto || 'Mensagem de suporte.',
            criado_em: m.criado_em || m.created_at || new Date().toISOString()
          });
        });
      }

      // ORDENAÇÃO POR ORDEM DE CHEGADA (MAIS RECENTE PRIMEIRO)
      listaUnificada.sort((a, b) => new Date(b.criado_em) - new Date(a.criado_em));

      suporteGlobal = listaUnificada;
      renderizarChamadosSuporte();
    }

    function renderizarChamadosSuporte() {
      const idsLidos = JSON.parse(localStorage.getItem('admin_suporte_lidos') || '[]');
      
      let filtrados = suporteGlobal.filter(s => {
        if (subAbaChamadosAtual === 'motoristas') {
          return s.tipo_reporte.startsWith('motorista');
        } else {
          return s.tipo_reporte.startsWith('passageiro');
        }
      });

      // Filtra os itens limpos visualmente pela administração
      let visiveis = filtrados.filter(s => !idsLidos.includes(String(s.id_unico)));

      const totalNaoLidosGeral = suporteGlobal.filter(s => !idsLidos.includes(String(s.id_unico))).length;
      const badgeChamados = document.getElementById('badge-count-chamados');
      if (totalNaoLidosGeral > 0) {
        badgeChamados.innerText = totalNaoLidosGeral;
        badgeChamados.classList.remove('hidden');
      } else {
        badgeChamados.classList.add('hidden');
      }

      const containerChamados = document.getElementById('lista-admin-suporte');
      if (visiveis.length === 0) {
        containerChamados.innerHTML = `<div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">Nenhum alerta ou reporte visual pendente na aba ${subAbaChamadosAtual}.</div>`;
        return;
      }

      containerChamados.innerHTML = visiveis.map(s => {
        const descRelacao = s.tipo_reporte.includes('avalia_') 
          ? `Reporte feito por <u>${s.autor_nome}</u> para <u>${s.alvo_nome}</u>`
          : `Mensagem de suporte enviada por <u>${s.autor_nome}</u>`;

        const dataFormatada = new Date(s.criado_em).toLocaleString('pt-BR', {
          dateStyle: 'short',
          timeStyle: 'medium'
        });

        return `
          <div class="bg-slate-900 p-4 rounded-2xl border border-amber-500/40 space-y-3 shadow">
            <div class="flex justify-between items-start">
              <span class="text-xs font-extrabold text-amber-400 flex items-center gap-1">
                ${s.estrelas ? `<i class="fa-solid fa-star"><b>${s.estrelas}</b> Estrelas</i>` : '<i class="fa-solid fa-triangle-exclamation">Reporte de Suporte</i>'}
              </span>
              <div class="text-right">
                <span class="text-[10px] text-emerald-400 font-mono block"><i class="fa-regular fa-clock mr-1"></i>${dataFormatada}</span>
                <span class="text-[9px] text-slate-400">Ref #${s.id_referencia}</span>
              </div>
            </div>
            
            <div class="text-[11px] space-y-1 text-slate-300 bg-slate-950 p-2.5 rounded-xl border border-slate-800">
              <p class="text-emerald-400 font-bold mb-1">
                <i class="fa-solid fa-arrow-right-arrow-left"></i> ${descRelacao}
              </p>
              ${s.origem ? `<p><strong>De:</strong> ${s.origem}</p>` : ''}
              ${s.destino ? `<p><strong>Para:</strong> ${s.destino}</p>` : ''}
              <p class="text-red-300 pt-1 border-t border-slate-800/80"><strong>Motivo / Observação:</strong> ${s.observacao}</p>
            </div>

            <div class="flex flex-col gap-2 pt-1">
              <button onclick="abrirChatCentralComUsuario('${s.autor_id}', '${s.autor_nome}')" class="w-full bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 py-2 rounded-xl font-bold flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-comments"></i> Abrir Chat com (${s.autor_nome})
              </button>
              <div class="flex gap-2">
                <button onclick="abrirModalEdicao('${s.autor_id}')" class="flex-1 bg-sky-600/25 hover:bg-sky-600/35 text-sky-300 border border-sky-500/30 py-2 rounded-xl font-bold flex items-center justify-center gap-1.5"><i class="fa-solid fa-user"></i> Ver Usuário</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function carregarContadorMensagensNovas() {
      try {
        const { data } = await supabaseClient.from('mensagens_suporte_app').select('id, lido').eq('remetente', 'passageiro').eq('lido', false);
        const total = (data || []).length;
        
        const badgeMensagens = document.getElementById('badge-count-mensagens');
        if (total > 0) {
          badgeMensagens.innerText = total;
          badgeMensagens.classList.remove('hidden');
        } else {
          badgeMensagens.classList.add('hidden');
        }
      } catch (e) {}
    }

    async function carregarMensagensSuporteCentral() {
      const container = document.getElementById('lista-central-mensagens');
      container.innerHTML = '<p class="text-slate-400 text-center py-4 animate-pulse">Carregando conversas...</p>';

      try {
        const { data: msgs, error } = await supabaseClient
          .from('mensagens_suporte_app')
          .select('*')
          .order('id', { ascending: false });

        if (error || !msgs || msgs.length === 0) {
          container.innerHTML = '<p class="text-slate-500 text-center py-4">Nenhuma mensagem de suporte registrada.</p>';
          return;
        }

        const agrupado = {};
        for (const m of msgs) {
          if (!agrupado[m.usuario_id]) {
            agrupado[m.usuario_id] = {
              ult_msg: m.mensagem,
              data: m.criado_em,
              nao_lido: !m.lido && m.remetente === 'passageiro'
            };
          }
        }

        const idsUsuarios = Object.keys(agrupado);
        const { data: usuarios } = await supabaseClient.from('usuarios').select('id, nome, telefone, foto_url').in('id', idsUsuarios);
        const mapaUsuarios = {};
        (usuarios || []).forEach(u => mapaUsuarios[u.id] = u);

        let html = '';
        for (const uid of idsUsuarios) {
          const info = agrupado[uid];
          const userObj = mapaUsuarios[uid] || { nome: 'Usuário Desconhecido', telefone: '-' };
          
          html += `
            <div onclick="abrirChatCentralComUsuario('${uid}', \`${userObj.nome}\`)" class="bg-slate-900 hover:bg-slate-800/80 p-3.5 rounded-2xl border ${info.nao_lido ? 'border-emerald-500/60 bg-emerald-950/20' : 'border-slate-800'} flex items-center gap-3 cursor-pointer transition shadow">
              <img src="${userObj.foto_url || 'https://ui-avatars.com/api/?name=Usuario'}" class="w-11 h-11 rounded-full object-cover border border-slate-700">
              <div class="flex-1 min-w-0">
                <div class="flex justify-between items-center">
                  <h4 class="font-extrabold text-white text-xs truncate">${userObj.nome}</h4>
                  <span class="text-[10px] text-slate-400">${new Date(info.data || Date.now()).toLocaleDateString()}</span>
                </div>
                <p class="text-slate-300 text-[11px] truncate mt-0.5">${info.ult_msg}</p>
                <p class="text-[10px] text-slate-400 mt-1">Tel: ${userObj.telefone || '-'}</p>
              </div>
              ${info.nao_lido ? '<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>' : ''}
            </div>
          `;
        }

        container.innerHTML = html;
        carregarContadorMensagensNovas();
      } catch (e) {
        container.innerHTML = '<p class="text-red-400 text-center py-4">Erro ao carregar conversas.</p>';
      }
    }

    async function abrirChatCentralComUsuario(usuarioId, nomeUsuario) {
      usuarioChatAtivoId = usuarioId;
      document.getElementById('chat-central-nome').innerText = nomeUsuario;
      document.getElementById('chat-central-id').innerText = "ID: " + usuarioId;
      document.getElementById('chat-central-input').value = '';
      document.getElementById('modal-chat-central').classList.remove('hidden');

      await carregarHistoricoChatCentral();

      await supabaseClient
        .from('mensagens_suporte_app')
        .update({ lido: true })
        .eq('usuario_id', usuarioId)
        .eq('remetente', 'passageiro');

      carregarContadorMensagensNovas();
    }

    async function carregarHistoricoChatCentral() {
      const container = document.getElementById('chat-central-historico');
      if (!container || !usuarioChatAtivoId) return;

      try {
        const { data: msgs } = await supabaseClient
          .from('mensagens_suporte_app')
          .select('*')
          .eq('usuario_id', usuarioChatAtivoId)
          .order('criado_em', { ascending: true });

        if (!msgs || msgs.length === 0) {
          container.innerHTML = '<p class="text-slate-500 text-center py-2">Nenhuma mensagem nesta conversa.</p>';
          return;
        }

        container.innerHTML = msgs.map(m => {
          const isAdmin = m.remetente === 'admin';
          return `
            <div class="flex flex-col ${isAdmin ? 'items-end' : 'items-start'}">
              <div class="max-w-[85%] p-2.5 rounded-2xl ${isAdmin ? 'bg-emerald-600/30 border border-emerald-500/40 text-emerald-100' : 'bg-slate-900 border border-slate-800 text-slate-200'} space-y-1">
                <span class="text-[9px] text-slate-400 block font-bold">${isAdmin ? 'Você (Admin)' : 'Usuário'}</span>
                <p class="text-xs whitespace-pre-line">${m.mensagem}</p>
              </div>
            </div>
          `;
        }).join('');

        container.scrollTop = container.scrollHeight;
      } catch (e) {
        container.innerHTML = '<p class="text-red-400 text-center py-2">Erro ao carregar mensagens.</p>';
      }
    }

    async function enviarRespostaChatCentral() {
      const texto = document.getElementById('chat-central-input').value.trim();
      if (!texto || !usuarioChatAtivoId) return;

      try {
        const { error } = await supabaseClient.from('mensagens_suporte_app').insert([{
          usuario_id: String(usuarioChatAtivoId),
          mensagem: texto,
          remetente: 'admin',
          lido: false
        }]);

        if (error) {
          alert("Erro ao enviar: " + error.message);
          return;
        }

        document.getElementById('chat-central-input').value = '';
        carregarHistoricoChatCentral();
      } catch (e) {
        alert("Erro ao enviar mensagem.");
      }
    }

    function fecharChatCentral() {
      document.getElementById('modal-chat-central').classList.add('hidden');
      usuarioChatAtivoId = null;
      if (abaSupAtual === 'mensagens') carregarMensagensSuporteCentral();
    }

    function limparNotificacoesSuporte() {
      const idsAtuais = suporteGlobal.map(s => String(s.id_unico));
      localStorage.setItem('admin_suporte_lidos', JSON.stringify(idsAtuais));
      renderizarChamadosSuporte();
    }

    window.onload = () => verificarSessaoAdmin('suporte', carregarPaginaAtual);
  </script>
</body>
</html>
