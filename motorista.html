<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>App Motorista - Mobilidade Urbana</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- LEAFLET CSS & JS PARA O MAPA DO MOTORISTA -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-slate-950 flex justify-center min-h-screen">

<div class="w-full max-w-[440px] bg-slate-50 dark:bg-slate-900 min-h-screen flex flex-col shadow-2xl overflow-x-hidden relative transition-colors duration-200">

  <!-- CABEÇALHO FIXO -->
  <header class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between shadow-md z-30">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-emerald-500 text-slate-950 flex items-center justify-center font-bold">
        <i class="fa-solid fa-steering-wheel"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold leading-tight">Mobilidade Laguna</h1>
        <p class="text-[10px] text-emerald-400 font-bold">Painel do Motorista</p>
      </div>
    </div>
    <div id="status-toggle-container">
      <!-- Botão Online/Offline rápido no header -->
      <button onclick="alternarStatusOnline()" id="btn-status-topo" class="bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-[10px] font-extrabold border border-slate-700">
        <i class="fa-solid fa-circle text-[8px] text-red-500 mr-1"></i> Offline
      </button>
    </div>
  </header>

  <!-- CONTAINER DINÂMICO (INJEÇÃO DAS ABAS DO MOTORISTA) -->
  <main id="conteudo-principal-motorista" class="flex-1 flex flex-col relative overflow-hidden">
    <!-- O conteúdo da aba ativa entra aqui -->
  </main>

  <!-- MENU INFERIOR DE NAVEGAÇÃO -->
  <nav id="menu-inferior-motorista" class="hidden bg-slate-900 border-t border-slate-800 p-2 flex justify-around z-30 text-xs text-slate-400">
    <button onclick="carregarAbaMotorista('painel')" id="btn-aba-painel" class="flex flex-col items-center gap-1 text-emerald-400">
      <i class="fa-solid fa-radar text-base"></i>
      <span class="text-[10px] font-bold">Radar</span>
    </button>
    <button onclick="carregarAbaMotorista('historico')" id="btn-aba-historico" class="flex flex-col items-center gap-1 hover:text-white">
      <i class="fa-solid fa-wallet text-base"></i>
      <span class="text-[10px] font-bold">Ganhos</span>
    </button>
    <button onclick="carregarAbaMotorista('perfil')" id="btn-aba-perfil" class="flex flex-col items-center gap-1 hover:text-white">
      <i class="fa-solid fa-user-gear text-base"></i>
      <span class="text-[10px] font-bold">Perfil</span>
    </button>
  </nav>

</div>

<script>
  const SUPABASE_URL = 'https://mmcwmzesjtnqgpcdspir.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_XZVaqjSNHsQSgZwxsfIZsQ__crRqWTo';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let motoristaAtual = null;

  window.onload = async () => {
    const salvo = localStorage.getItem('motorista_logado');
    if (salvo) {
      motoristaAtual = JSON.parse(salvo);
      document.getElementById('menu-inferior-motorista').classList.remove('hidden');
      atualizarBotaoStatusTopo();
      carregarAbaMotorista('painel');
    } else {
      carregarAbaMotorista('auth');
    }
  };

  async function carregarAbaMotorista(nomeAba) {
    const container = document.getElementById('conteudo-principal-motorista');
    
    ['painel', 'historico', 'perfil', 'auth'].forEach(aba => {
      const btn = document.getElementById(`btn-aba-${aba}`);
      if (btn) {
        btn.className = aba === nomeAba 
          ? 'flex flex-col items-center gap-1 text-emerald-400 font-bold' 
          : 'flex flex-col items-center gap-1 text-slate-400 hover:text-white';
      }
    });

    try {
      const arquivo = nomeAba === 'painel' ? 'radar-motorista.html' : `${nomeAba}-motorista.html`;
      const resposta = await fetch(arquivo);
      if (resposta.ok) {
        container.innerHTML = await resposta.text();
        
        if (nomeAba === 'painel' && typeof inicializarRadarMotorista === 'function') {
          setTimeout(inicializarRadarMotorista, 150);
        }
        if (nomeAba === 'historico' && typeof carregarGanhosMotorista === 'function') carregarGanhosMotorista();
        if (nomeAba === 'perfil' && typeof carregarPerfilMotorista === 'function') carregarPerfilMotorista();
        if (nomeAba === 'auth' && typeof inicializarAuthMotorista === 'function') inicializarAuthMotorista();
      } else {
        container.innerHTML = `<div class="p-6 text-center text-slate-500">Erro ao carregar o módulo ${nomeAba}.</div>`;
      }
    } catch (e) {
      container.innerHTML = `<div class="p-6 text-center text-slate-500">Módulo indisponível no momento.</div>`;
    }
  }

  async function alternarStatusOnline() {
    if (!motoristaAtual) return;
    const novoStatus = !motoristaAtual.online;
    
    const { data, error } = await db.from('usuarios').update({ online: novoStatus }).eq('id', motoristaAtual.id).select().single();
    if (!error && data) {
      motoristaAtual = data;
      localStorage.setItem('motorista_logado', JSON.stringify(data));
      atualizarBotaoStatusTopo();
      if (typeof verificarEstadoRadar === 'function') verificarEstadoRadar();
    }
  }

  function atualizarBotaoStatusTopo() {
    const btn = document.getElementById('btn-status-topo');
    if (!btn || !motoristaAtual) return;
    if (motoristaAtual.online) {
      btn.innerHTML = `<i class="fa-solid fa-circle text-[8px] text-emerald-400 mr-1 animate-pulse"></i> Online`;
      btn.className = "bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-xl text-[10px] font-extrabold border border-emerald-500/40";
    } else {
      btn.innerHTML = `<i class="fa-solid fa-circle text-[8px] text-red-500 mr-1"></i> Offline`;
      btn.className = "bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-[10px] font-extrabold border border-slate-700";
    }
  }

  function sairContaMotorista() {
    if (motoristaAtual) {
      db.from('usuarios').update({ online: false }).eq('id', motoristaAtual.id);
    }
    localStorage.removeItem('motorista_logado');
    location.reload();
  }
</script>
</body>
</html>
