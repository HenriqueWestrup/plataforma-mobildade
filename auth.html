<section class="p-5 flex-1 flex flex-col justify-center space-y-4 z-30 bg-slate-50 dark:bg-slate-900">
  <div class="text-center space-y-1">
    <h2 class="text-xl font-extrabold text-slate-900 dark:text-white">Acesso do Passageiro</h2>
    <p class="text-xs text-slate-500 dark:text-slate-400">Insira seus dados para começar.</p>
  </div>

  <div class="grid grid-cols-2 bg-slate-200 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold">
    <button type="button" id="btn-tab-cadastro" onclick="alternarAbaAuth('cadastro')" class="bg-white dark:bg-slate-700 text-slate-900 dark:text-white py-2 rounded-lg shadow-sm transition">Criar Conta</button>
    <button type="button" id="btn-tab-login" onclick="alternarAbaAuth('login')" class="text-slate-600 dark:text-slate-400 py-2 rounded-lg transition">Entrar</button>
  </div>

  <!-- FORMULÁRIO DE CADASTRO -->
  <form id="form-cadastro" onsubmit="cadastrarPassageiro(event)" class="space-y-3 bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
    <div class="flex flex-col items-center space-y-2 pb-1">
      <label for="input-foto" class="cursor-pointer relative">
        <img id="preview-foto" src="https://ui-avatars.com/api/?name=Foto+Perfil&background=e2e8f0&color=475569&size=150" class="w-20 h-20 rounded-full object-cover border-4 border-emerald-500 shadow" />
        <span class="absolute bottom-0 right-0 bg-slate-900 text-white w-7 h-7 rounded-full flex items-center justify-center text-[10px]"><i class="fa-solid fa-camera"></i></span>
      </label>
      <input type="file" id="input-foto" accept="image/*" capture="user" required onchange="processarFotoAuth(event)" class="hidden" />
      <span class="text-[10px] font-bold text-red-600">* Foto de rosto obrigatória</span>
    </div>
    <div>
      <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Nome Completo</label>
      <input type="text" id="cad-nome" required placeholder="Seu nome completo" class="w-full mt-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs dark:text-white" />
    </div>
    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Telefone</label>
        <input type="tel" id="cad-telefone" required placeholder="48999998888" class="w-full mt-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs dark:text-white" />
      </div>
      <div>
        <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Senha</label>
        <input type="password" id="cad-senha" required placeholder="Senha" class="w-full mt-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs dark:text-white" />
      </div>
    </div>
    <div>
      <label class="text-xs font-bold text-slate-700 dark:text-slate-300">CPF</label>
      <input type="text" id="cad-cpf" required placeholder="000.000.000-00" class="w-full mt-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs dark:text-white" />
    </div>
    <div>
      <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Endereço Residencial</label>
      <input type="text" id="cad-endereco" required placeholder="Rua, Bairro, Cidade" class="w-full mt-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs dark:text-white" />
    </div>
    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs shadow-lg transition">Enviar Cadastro</button>
  </form>

  <!-- FORMULÁRIO DE LOGIN -->
  <form id="form-login" onsubmit="entrarPassageiro(event)" class="hidden space-y-3 bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
    <div>
      <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Telefone</label>
      <input type="tel" id="login-telefone" required placeholder="48999998888" class="w-full mt-1 px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs dark:text-white" />
    </div>
    <div>
      <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Senha</label>
      <input type="password" id="login-senha" required placeholder="Senha" class="w-full mt-1 px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs dark:text-white" />
    </div>
    <button type="submit" class="w-full bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 rounded-xl text-xs shadow transition">Entrar na Conta</button>
  </form>
</section>

<!-- MODAL OBRIGATÓRIO DE TROCA DE SENHA TEMPORÁRIA -->
<div id="modal-troca-senha" class="hidden fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-sm w-full p-6 space-y-4 border-2 border-amber-500 shadow-2xl">
    <div class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-xl mx-auto">
      <i class="fa-solid fa-key"></i>
    </div>
    <div class="text-center space-y-1">
      <h3 class="text-base font-extrabold text-slate-900 dark:text-white">Criação de Nova Senha</h3>
      <p class="text-xs text-slate-500">Você acessou com uma senha temporária. Defina sua nova senha pessoal.</p>
    </div>
    <div>
      <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Nova Senha</label>
      <input type="password" id="nova-senha-input" placeholder="Digite sua nova senha" class="w-full mt-1 px-3 py-2.5 bg-slate-100 dark:bg-slate-800 border border-slate-700 rounded-xl text-xs dark:text-white" />
    </div>
    <button type="button" onclick="salvarNovaSenhaTemporaria()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs shadow">Salvar Nova Senha e Entrar</button>
  </div>
</div>

<script>
  var fotoAuthBase64 = '';

  function inicializarModuloAuth() {}

  window.alternarAbaAuth = function(aba) {
    const isCadastro = aba === 'cadastro';
    document.getElementById('form-cadastro').classList.toggle('hidden', !isCadastro);
    document.getElementById('form-login').classList.toggle('hidden', isCadastro);

    const btnCad = document.getElementById('btn-tab-cadastro');
    const btnLog = document.getElementById('btn-tab-login');

    if (isCadastro) {
      btnCad.className = "bg-white dark:bg-slate-700 text-slate-900 dark:text-white py-2 rounded-lg shadow-sm transition";
      btnLog.className = "text-slate-600 dark:text-slate-400 py-2 rounded-lg transition";
    } else {
      btnLog.className = "bg-white dark:bg-slate-700 text-slate-900 dark:text-white py-2 rounded-lg shadow-sm transition";
      btnCad.className = "text-slate-600 dark:text-slate-400 py-2 rounded-lg transition";
    }
  };

  function processarFotoAuth(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const scale = 220 / Math.max(img.width, img.height);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        fotoAuthBase64 = canvas.toDataURL('image/jpeg', 0.75);
        document.getElementById('preview-foto').src = fotoAuthBase64;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  window.cadastrarPassageiro = async function(e) {
    e.preventDefault();
    if (!fotoAuthBase64) { alert('Foto de rosto obrigatória.'); return; }
    const novo = {
      tipo: 'passageiro',
      nome: document.getElementById('cad-nome').value.trim(),
      telefone: document.getElementById('cad-telefone').value.trim(),
      senha: document.getElementById('cad-senha').value.trim(),
      cpf: document.getElementById('cad-cpf').value.trim(),
      endereco: document.getElementById('cad-endereco').value.trim(),
      foto_url: fotoAuthBase64,
      status_aprovacao: 'pendente'
    };
    const { data, error } = await db.from('usuarios').insert([novo]).select().single();
    if (error) { alert('Erro: ' + error.message); return; }
    window.usuarioAtual = data;
    localStorage.setItem('passageiro_logado', JSON.stringify(data));
    verificarStatusOuCarregarApp();
  };

  window.entrarPassageiro = async function(e) {
    e.preventDefault();
    const tel = document.getElementById('login-telefone').value.trim();
    const senha = document.getElementById('login-senha').value.trim();
    const { data, error } = await db.from('usuarios').select('*').eq('telefone', tel).eq('senha', senha).single();
    if (error || !data) { alert('Telefone ou senha incorretos.'); return; }
    window.usuarioAtual = data;
    localStorage.setItem('passageiro_logado', JSON.stringify(data));

    if (data.senha_temporaria) {
      document.getElementById('modal-troca-senha').classList.remove('hidden');
      return;
    }
    verificarStatusOuCarregarApp();
  };

  window.salvarNovaSenhaTemporaria = async function() {
    const novaSenha = document.getElementById('nova-senha-input').value.trim();
    if (!novaSenha) { alert('Digite a nova senha.'); return; }

    const { data, error } = await db.from('usuarios').update({
      senha: novaSenha,
      senha_temporaria: false
    }).eq('id', window.usuarioAtual.id).select().single();

    if (!error && data) {
      window.usuarioAtual = data;
      localStorage.setItem('passageiro_logado', JSON.stringify(data));
      document.getElementById('modal-troca-senha').classList.add('hidden');
      verificarStatusOuCarregarApp();
    } else {
      alert('Erro ao atualizar senha.');
    }
  };

  function verificarStatusOuCarregarApp() {
    if (window.usuarioAtual.banido) {
      alert('Sua conta está bloqueada.');
      sairConta();
      return;
    }
    if (window.usuarioAtual.status_aprovacao !== 'aprovado') {
      alert('Seu cadastro está aguardando aprovação da central.');
      sairConta();
      return;
    }
    document.getElementById('menu-inferior').classList.remove('hidden');
    carregarAba('mapa');
  }
</script>
