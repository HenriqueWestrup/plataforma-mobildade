<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobilidade Laguna - Passageiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl space-y-5">
    
    <div class="text-center space-y-1">
      <div class="inline-block bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 p-3 rounded-2xl mb-1">
        <i class="fa-solid fa-user text-xl"></i>
      </div>
      <h1 id="titulo-tela" class="text-lg font-extrabold text-white">Área do Passageiro</h1>
      <p id="subtitulo-tela" class="text-xs text-slate-400">Entre com seu celular e senha para viajar</p>
    </div>

    <!-- LOGIN -->
    <form id="form-login" class="space-y-4 text-xs" onsubmit="realizarLogin(event)">
      <div class="space-y-1">
        <label class="text-slate-300 font-medium">Celular</label>
        <input type="tel" id="login-celular" required placeholder="(48) 9 9999-9999" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>
      <div class="space-y-1">
        <label class="text-slate-300 font-medium">Senha</label>
        <input type="password" id="login-senha" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition">Entrar na Conta</button>
    </form>

    <div class="text-center text-[11px] text-slate-500 space-y-2 pt-2 border-t border-slate-800">
      <div class="flex justify-center gap-4">
        <a href="auth-motorista.html" class="text-amber-400 hover:underline">Sou Motorista</a>
        <a href="admin.html" class="text-slate-400 hover:underline">Admin</a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mmcwmzesjtnqgpcdspir.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tY3dtemVzanRucWdwY2RzcGlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NTgyMzUsImV4cCI6MjExMDAzNDIzNX0.VfOyJpZ5Xl30CvLtP-ZpAl1BO1ijVU8ChpabOPmel-E';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function realizarLogin(e) {
      e.preventDefault();
      const cel = document.getElementById('login-celular').value.trim();
      const senha = document.getElementById('login-senha').value;

      const { data, error } = await supabaseClient.from('usuarios').select('*').eq('telefone', cel).eq('senha', senha).single();
      if (error || !data) {
        alert("Celular ou senha inválidos.");
        return;
      }

      if (data.status === 'bloqueado') {
        alert("Conta temporariamente suspensa.");
        return;
      }

      // Limpa sessão de motorista para evitar conflito
      localStorage.removeItem('motorista_logado');
      data.tipo = 'passageiro';
      localStorage.setItem('passageiro_logado', JSON.stringify(data));
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
