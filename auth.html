<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobilidade Laguna - Passageiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl space-y-5">
    
    <div class="text-center space-y-1">
      <div class="inline-block bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 p-3 rounded-2xl mb-1">
        <i class="fa-solid fa-user text-xl"></i>
      </div>
      <h1 id="titulo-tela" class="text-lg font-extrabold text-white">Área do Passageiro</h1>
      <p id="subtitulo-tela" class="text-xs text-slate-400">Entre com seu celular e senha para viajar</p>
    </div>

    <!-- ALTERNÂNCIA ENTRE LOGIN E CADASTRO -->
    <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-2xl border border-slate-800 text-xs font-bold">
      <button type="button" id="aba-login" onclick="alternarAba('login')" class="py-2 rounded-xl bg-emerald-600 text-white transition">
        Entrar
      </button>
      <button type="button" id="aba-cadastro" onclick="alternarAba('cadastro')" class="py-2 rounded-xl text-slate-400 hover:text-white transition">
        Cadastrar
      </button>
    </div>

    <!-- CAIXA DE ALERTA DE ERRO VISUAL -->
    <div id="box-erro" class="hidden bg-red-950/80 border border-red-600 text-red-200 text-xs p-3 rounded-xl flex items-center gap-2">
      <i class="fa-solid fa-triangle-exclamation text-red-400 text-base shrink-0"></i>
      <span id="texto-erro">Erro ao realizar login.</span>
    </div>

    <!-- LOGIN -->
    <form id="form-login" class="space-y-4 text-xs" onsubmit="realizarLogin(event)">
      <div class="space-y-1">
        <label class="text-slate-300 font-medium">Celular</label>
        <input type="tel" id="login-celular" required placeholder="(48) 9 9999-9999" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>
      <div class="space-y-1">
        <label class="text-slate-300 font-medium">Senha</label>
        <input type="password" id="login-senha" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>
      <button type="submit" id="btn-entrar" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition">Entrar na Conta</button>
    </form>

    <!-- CADASTRO DO PASSAGEIRO + RECONHECIMENTO FACIAL -->
    <form id="form-cadastro" class="hidden space-y-3 text-xs" onsubmit="realizarCadastro(event)">
      <div class="space-y-1">
        <label class="text-slate-300 font-medium">Nome completo</label>
        <input type="text" id="cad-nome" required placeholder="Seu nome completo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>

      <div class="space-y-1">
        <label class="text-slate-300 font-medium">CPF</label>
        <input type="text" id="cad-cpf" required placeholder="000.000.000-00" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>

      <div class="space-y-1">
        <label class="text-slate-300 font-medium">Celular</label>
        <input type="tel" id="cad-celular" required placeholder="(48) 9 9999-9999" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>

      <div class="space-y-1">
        <label class="text-slate-300 font-medium">Endereço (opcional)</label>
        <input type="text" id="cad-endereco" placeholder="Rua, bairro, Laguna - SC" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>

      <div class="space-y-1">
        <label class="text-slate-300 font-medium">Senha</label>
        <input type="password" id="cad-senha" required minlength="4" placeholder="Crie uma senha" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>

      <!-- CAPTURA FACIAL (DEFINE A FOTO DE PERFIL) -->
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-bold text-emerald-400 flex items-center gap-1.5">
            <i class="fa-solid fa-camera"></i> Reconhecimento Facial (Foto de Perfil)
          </span>
          <button type="button" onclick="abrirCameraCadastro()" class="bg-slate-800 hover:bg-slate-700 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg transition">
            Abrir Câmera
          </button>
        </div>

        <div class="relative w-full h-36 bg-slate-900 rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center">
          <video id="video-rosto" autoplay playsinline class="hidden w-full h-full object-cover scale-x-[-1]"></video>
          <img id="preview-rosto" class="hidden w-full h-full object-cover" alt="Foto do rosto capturada">
          <div id="placeholder-rosto" class="text-center text-slate-500 text-[11px] px-3">
            <i class="fa-solid fa-user-check text-xl mb-1 block"></i>
            Capture seu rosto para usar como foto do perfil
          </div>
          <div class="pointer-events-none absolute inset-3 border-2 border-dashed border-emerald-500/40 rounded-full"></div>
        </div>

        <button type="button" id="btn-capturar-rosto" onclick="capturarRostoCadastro()" class="hidden w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2 rounded-xl transition text-[11px]">
          Capturar Rosto para Perfil
        </button>
      </div>

      <button type="submit" id="btn-cadastrar" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition">
        Criar Conta de Passageiro
      </button>
    </form>

    <div class="text-center text-[11px] text-slate-500 space-y-2 pt-2 border-t border-slate-800">
      <div class="flex justify-center gap-4">
        <a href="auth-motorista.html" onclick="pararCameraCadastro()" class="text-amber-400 hover:underline">Sou Motorista</a>
        <a href="admin.html" onclick="pararCameraCadastro()" class="text-slate-400 hover:underline">Admin</a>
      </div>
    </div>
  </div>

  <canvas id="canvas-rosto" class="hidden"></canvas>

  <script>
    const SUPABASE_URL = 'https://mmcwmzesjtnqgpcdspir.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tY3dtemVzanRucWdwY2RzcGlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NTgyMzUsImV4cCI6MjExMDAzNDIzNX0.VfOyJpZ5Xl30CvLtP-ZpAl1BO1ijVU8ChpabOPmel-E';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let streamRosto = null;
    let fotoPerfilCapturada = null;

    function mostrarErro(mensagem) {
      const box = document.getElementById('box-erro');
      const texto = document.getElementById('texto-erro');
      texto.innerText = mensagem;
      box.classList.remove('hidden');
    }

    function limparErro() {
      document.getElementById('box-erro').classList.add('hidden');
    }

    function pararCameraCadastro() {
      if (streamRosto) {
        streamRosto.getTracks().forEach(track => track.stop());
        streamRosto = null;
      }
    }

    function alternarAba(aba) {
      limparErro();
      pararCameraCadastro();

      const formLogin = document.getElementById('form-login');
      const formCadastro = document.getElementById('form-cadastro');
      const abaLogin = document.getElementById('aba-login');
      const abaCadastro = document.getElementById('aba-cadastro');
      const titulo = document.getElementById('titulo-tela');
      const subtitulo = document.getElementById('subtitulo-tela');

      if (aba === 'cadastro') {
        formLogin.classList.add('hidden');
        formCadastro.classList.remove('hidden');
        abaCadastro.className = 'py-2 rounded-xl bg-emerald-600 text-white transition';
        abaLogin.className = 'py-2 rounded-xl text-slate-400 hover:text-white transition';
        titulo.innerText = 'Cadastro de Passageiro';
        subtitulo.innerText = 'Preencha seus dados e capture seu rosto';
      } else {
        formCadastro.classList.add('hidden');
        formLogin.classList.remove('hidden');
        abaLogin.className = 'py-2 rounded-xl bg-emerald-600 text-white transition';
        abaCadastro.className = 'py-2 rounded-xl text-slate-400 hover:text-white transition';
        titulo.innerText = 'Área do Passageiro';
        subtitulo.innerText = 'Entre com seu celular e senha para viajar';
      }
    }

    async function abrirCameraCadastro() {
      limparErro();
      pararCameraCadastro();

      const video = document.getElementById('video-rosto');
      const preview = document.getElementById('preview-rosto');
      const placeholder = document.getElementById('placeholder-rosto');
      const btnCapturar = document.getElementById('btn-capturar-rosto');

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Este navegador não suporta acesso à câmera.');
        }

        streamRosto = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });

        video.srcObject = streamRosto;
        preview.classList.add('hidden');
        placeholder.classList.add('hidden');
        video.classList.remove('hidden');
        btnCapturar.classList.remove('hidden');
      } catch (err) {
        mostrarErro('Não foi possível abrir a câmera: ' + err.message);
      }
    }

    function capturarRostoCadastro() {
      const video = document.getElementById('video-rosto');
      const canvas = document.getElementById('canvas-rosto');
      const preview = document.getElementById('preview-rosto');
      const btnCapturar = document.getElementById('btn-capturar-rosto');

      if (!video.videoWidth || !video.videoHeight) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.restore();

      fotoPerfilCapturada = canvas.toDataURL('image/jpeg', 0.82);
      preview.src = fotoPerfilCapturada;
      preview.classList.remove('hidden');
      video.classList.add('hidden');
      btnCapturar.classList.add('hidden');
      pararCameraCadastro();
    }

    async function realizarCadastro(e) {
      e.preventDefault();
      limparErro();

      const nome = document.getElementById('cad-nome').value.trim();
      const cpf = document.getElementById('cad-cpf').value.trim();
      const cel = document.getElementById('cad-celular').value.trim();
      const endereco = document.getElementById('cad-endereco').value.trim();
      const senha = document.getElementById('cad-senha').value;
      const btn = document.getElementById('btn-cadastrar');

      if (!fotoPerfilCapturada) {
        mostrarErro('Capture seu rosto para definir sua foto de perfil.');
        return;
      }

      btn.innerText = 'Cadastrando...';
      btn.disabled = true;

      try {
        const { data: existente } = await supabaseClient
          .from('usuarios')
          .select('id')
          .eq('telefone', cel)
          .maybeSingle();

        if (existente) {
          throw new Error('Já existe uma conta cadastrada com este celular.');
        }

        const { data: novoUsuario, error } = await supabaseClient
          .from('usuarios')
          .insert([{
            tipo: 'passageiro',
            nome,
            cpf,
            telefone: cel,
            endereco: endereco || null,
            senha,
            foto_url: fotoPerfilCapturada,
            status: 'ativo',
            status_aprovacao: 'aprovado',
            banido: false
          }])
          .select('*')
          .single();

        if (error || !novoUsuario) {
          throw new Error(error?.message || 'Erro ao salvar cadastro no banco.');
        }

        const sessionToken = 'sessao_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        await supabaseClient.from('usuarios').update({ session_token: sessionToken }).eq('id', novoUsuario.id);

        localStorage.removeItem('motorista_logado');
        novoUsuario.tipo = 'passageiro';
        novoUsuario.session_token = sessionToken;
        localStorage.setItem('passageiro_logado', JSON.stringify(novoUsuario));
        localStorage.setItem('session_token', sessionToken);

        window.location.href = 'index.html';
      } catch (err) {
        mostrarErro(err.message || 'Erro ao realizar cadastro.');
        btn.innerText = 'Criar Conta de Passageiro';
        btn.disabled = false;
      }
    }

    async function realizarLogin(e) {
      e.preventDefault();
      document.getElementById('box-erro').classList.add('hidden');

      const cel = document.getElementById('login-celular').value.trim();
      const senha = document.getElementById('login-senha').value;
      const btn = document.getElementById('btn-entrar');

      btn.innerText = "Entrando...";
      btn.disabled = true;

      try {
        const { data, error } = await supabaseClient.from('usuarios').select('*').eq('telefone', cel).eq('senha', senha).single();
        if (error || !data) {
          throw new Error("Celular ou senha inválidos.");
        }

        if (data.status === 'bloqueado') {
          throw new Error("Conta temporariamente suspensa.");
        }

        // Gera um token de sessão único para este aparelho
        const sessionToken = 'sessao_' + Math.random().toString(36).substring(2) + Date.now().toString(36);

        // Atualiza o token no Supabase (isso invalida qualquer outro aparelho logado)
        await supabaseClient.from('usuarios').update({ session_token: sessionToken }).eq('id', data.id);

        // Salva localmente
        localStorage.removeItem('motorista_logado');
        data.tipo = 'passageiro';
        data.session_token = sessionToken;
        localStorage.setItem('passageiro_logado', JSON.stringify(data));
        localStorage.setItem('session_token', sessionToken);

        window.location.href = 'index.html';
      } catch (err) {
        mostrarErro(err.message || "Erro ao realizar login. Tente novamente.");
        btn.innerText = "Entrar na Conta";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
