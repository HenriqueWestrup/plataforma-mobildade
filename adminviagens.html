<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Admin Viagens - Mobilidade Laguna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden m-0 p-0 text-xs">

  <main class="flex-1 overflow-y-auto p-4 space-y-3 pb-20">
    <div id="lista-admin-viagens-ativas" class="space-y-3">
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">Carregando viagens...</div>
    </div>
  </main>

  <script src="admin_shared.js"></script>
  <script>
    async function carregarPaginaAtual() {
      const { data: viagens } = await supabaseClient
        .from('corridas')
        .select('id, origem, destino, valor, status, motorista_id, passageiro_id, motorista:motorista_id(id, nome, online), passageiro:passageiro_id(id, nome, online)')
        .in('status', ['aceita', 'aceito', 'a_caminho', 'no_local', 'em_andamento', 'em_curso', 'pendente', 'procurando'])
        .order('id', { ascending: false });

      const lista = viagens || [];
      const container = document.getElementById('lista-admin-viagens-ativas');

      if (lista.length === 0) {
        container.innerHTML = '<div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">Nenhuma viagem em andamento no momento.</div>';
        return;
      }

      container.innerHTML = lista.map(v => {
        const motoristaOnline = v.motorista && usuarioEstaAtivoNoAppAdmin(v.motorista);
        const nomeMotoristaEscapado = (v.motorista?.nome || 'Motorista').replace(/'/g, '');

        return `
          <div class="bg-slate-900 p-4 rounded-2xl border border-emerald-500/40 space-y-2.5 shadow">
            <div class="flex justify-between items-center gap-2">
              <span class="text-xs font-extrabold text-emerald-400"><i class="fa-solid fa-route mr-1"></i> Viagem #${v.id}</span>
              <span class="px-2 py-0.5 rounded-full text-[9px] font-bold bg-emerald-500/20 text-emerald-400 uppercase">${v.status || 'em_andamento'}</span>
            </div>

            <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 space-y-1 text-[11px]">
              <p class="text-slate-200"><strong>Passageiro:</strong> ${v.passageiro?.nome || 'Passageiro não informado'}</p>
              <p class="text-slate-200"><strong>Motorista:</strong> ${v.motorista?.nome || 'Aguardando Motorista'}</p>
              <p class="text-slate-300 truncate"><strong>De:</strong> ${v.origem || '-'}</p>
              <p class="text-slate-300 truncate"><strong>Para:</strong> ${v.destino || '-'}</p>
            </div>

            <div class="flex flex-wrap justify-between items-center gap-2 text-xs pt-1">
              <span class="text-emerald-400 font-extrabold">R$ ${Number(v.valor || 15.0).toFixed(2).replace('.', ',')}</span>
              <div class="flex flex-wrap gap-1.5">
                ${v.passageiro_id ? `<button type="button" onclick="abrirModalEdicao('${v.passageiro_id}')" class="bg-sky-600/20 hover:bg-sky-600/30 text-sky-300 border border-sky-500/30 px-2.5 py-1.5 rounded-xl font-bold text-[11px]"><i class="fa-solid fa-user"></i> Passageiro</button>` : ''}
                ${v.motorista_id ? `<button type="button" onclick="abrirModalEdicao('${v.motorista_id}')" class="bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/30 px-2.5 py-1.5 rounded-xl font-bold text-[11px]"><i class="fa-solid fa-car"></i> Motorista</button>` : ''}
                ${(v.motorista_id && motoristaOnline) ? `<button type="button" onclick="derrubarOnlineUsuarioAdmin('${v.motorista_id}', '${nomeMotoristaEscapado}')" title="Derrubar status online do motorista" class="bg-amber-600/20 hover:bg-amber-600/35 text-amber-300 border border-amber-500/40 px-2.5 py-1.5 rounded-xl font-bold text-[11px]"><i class="fa-solid fa-power-off"></i> Derrubar Online</button>` : ''}
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800 text-[11px]">
              <button type="button" onclick="encerrarViagemTravadaAdmin('${v.id}', null, 'cancelado')" class="bg-red-600/20 hover:bg-red-600/35 text-red-300 border border-red-500/40 py-2 px-3 rounded-xl font-bold transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-ban"></i> Encerrar / Destravar
              </button>
              <button type="button" onclick="encerrarViagemTravadaAdmin('${v.id}', null, 'concluido')" class="bg-emerald-600/20 hover:bg-emerald-600/35 text-emerald-300 border border-emerald-500/40 py-2 px-3 rounded-xl font-bold transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-flag-checkered"></i> Marcar Concluída
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.onload = () => verificarSessaoAdmin('viagens', carregarPaginaAtual);
  </script>
</body>
</html>
