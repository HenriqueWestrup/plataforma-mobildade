<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Histórico - Mobilidade Laguna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden m-0 p-0">

  <!-- TOPO -->
  <header class="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center shrink-0">
    <div class="flex items-center gap-2">
      <div class="bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 p-2 rounded-xl">
        <i class="fa-solid fa-clock-rotate-left text-sm"></i>
      </div>
      <div>
        <h1 class="text-sm font-extrabold text-white">Histórico de Corridas</h1>
        <span class="text-[10px] text-slate-400">Suas viagens realizadas</span>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO CENTRAL -->
  <main class="flex-1 overflow-y-auto p-4 pb-24 space-y-3">
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center space-y-2">
      <div class="text-slate-500 text-2xl pt-2"><i class="fa-solid fa-road"></i></div>
      <h3 class="font-bold text-white text-xs">Nenhuma corrida recente</h3>
      <p class="text-[11px] text-slate-400">Suas viagens concluídas aparecerão listadas aqui.</p>
    </div>
  </main>

  <!-- BARRA DE NAVEGAÇÃO INFERIOR FIXA -->
  <nav class="absolute bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 py-3 px-6 flex justify-around items-center z-50">
    <a href="index.html" class="text-slate-400 hover:text-slate-200 flex flex-col items-center gap-1">
      <i class="fa-solid fa-house text-base"></i>
      <span class="text-[10px]">Início</span>
    </a>
    <a href="corridas.html" class="text-emerald-400 flex flex-col items-center gap-1">
      <i class="fa-solid fa-clock-rotate-left text-base"></i>
      <span class="text-[10px]">Histórico</span>
    </a>
    <a href="perfil.html" class="text-slate-400 hover:text-slate-200 flex flex-col items-center gap-1">
      <i class="fa-solid fa-user text-base"></i>
      <span class="text-[10px]">Perfil</span>
    </a>
  </nav>

</body>
</html>
