<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Admin Principal - Mobilidade Laguna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden m-0 p-0 text-xs">

  <main class="flex-1 overflow-y-auto p-4 space-y-4 pb-16">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex justify-between items-center">
      <div>
        <h2 class="text-sm font-extrabold text-white">Visão Geral da Operação</h2>
        <p class="text-[11px] text-slate-400">Selecione um módulo abaixo ou na barra superior para gerenciar.</p>
      </div>
      <span class="text-[10px] text-emerald-400 font-bold flex items-center gap-1.5 bg-emerald-950/40 px-3 py-1.5 rounded-xl border border-emerald-500/30">
        <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-ping"></span> Tempo Real Ativo
      </span>
    </div>

    <!-- CARDS DE ATALHO PARA AS PÁGINAS SEPARADAS -->
    <div class="grid grid-cols-2 gap-3">
      <a href="adminmotorista.html" class="bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-emerald-500/40 p-4 rounded-2xl space-y-2 transition shadow">
        <div class="flex justify-between items-center">
          <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-base">
            <i class="fa-solid fa-car"></i>
          </div>
          <span id="dash-motoristas-online" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400">0 online</span>
        </div>
        <div>
          <p class="text-lg font-extrabold text-white" id="dash-total-motoristas">0</p>
          <p class="text-[11px] text-slate-400 font-semibold">Motoristas Parceiros</p>
        </div>
      </a>

      <a href="adminpassageiro.html" class="bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-sky-500/40 p-4 rounded-2xl space-y-2 transition shadow">
        <div class="flex justify-between items-center">
          <div class="w-10 h-10 rounded-xl bg-sky-500/10 text-sky-400 flex items-center justify-center text-base">
            <i class="fa-solid fa-users"></i>
          </div>
          <span id="dash-passageiros-online" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-400">0 online</span>
        </div>
        <div>
          <p class="text-lg font-extrabold text-white" id="dash-total-passageiros">0</p>
          <p class="text-[11px] text-slate-400 font-semibold">Passageiros Cadastrados</p>
        </div>
      </a>

      <a href="adminviagens.html" class="bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-amber-500/40 p-4 rounded-2xl space-y-2 transition shadow">
        <div class="flex justify-between items-center">
          <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-base">
            <i class="fa-solid fa-route"></i>
          </div>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400">Ativas</span>
        </div>
        <div>
          <p class="text-lg font-extrabold text-white" id="dash-total-viagens">0</p>
          <p class="text-[11px] text-slate-400 font-semibold">Viagens em Andamento</p>
        </div>
      </a>

      <a href="adminsuporte.html" class="bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-red-500/40 p-4 rounded-2xl space-y-2 transition shadow relative">
        <div class="flex justify-between items-center">
          <div class="w-10 h-10 rounded-xl bg-red-500/10 text-red-400 flex items-center justify-center text-base">
            <i class="fa-solid fa-headset"></i>
          </div>
          <!-- Bolinha vermelha com quantidade de mensagens novas -->
          <span id="badge-dash-suporte" class="hidden text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-600 text-white animate-bounce shadow-lg">0</span>
        </div>
        <div>
          <p class="text-lg font-extrabold text-white" id="dash-total-suporte">0</p>
          <p class="text-[11px] text-slate-400 font-semibold">Mensagens / Suporte</p>
        </div>
      </a>
    </div>
  </main>

  <script src="admin_shared.js"></script>
  <script>
    let canalRealtimeAdminPrincipal = null;

    function tocarSomAlertaAdmin() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const agora = audioCtx.currentTime;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, agora);
        osc.frequency.setValueAtTime(880.00, agora + 0.2);
        gain.gain.setValueAtTime(0.3, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.6);
        osc.start(agora);
        osc.stop(agora + 0.6);
      } catch (e) {}
    }

    async function carregarPaginaAtual() {
      const { data: usuarios } = await supabaseClient.from('usuarios').select('*');
      const todos = usuarios || [];
      listaUsuariosCache = todos;

      const motoristas = todos.filter(u => u.tipo === 'motorista' || u.veiculo_modelo);
      const passageiros = todos.filter(u => u.tipo !== 'motorista' && !u.veiculo_modelo);

      document.getElementById('dash-total-motoristas').innerText = motoristas.length;
      document.getElementById('dash-motoristas-online').innerText = `${motoristas.filter(m => m.online).length} online`;

      document.getElementById('dash-total-passageiros').innerText = passageiros.length;
      document.getElementById('dash-passageiros-online').innerText = `${passageiros.filter(p => p.online).length} online`;

      const { count: viagensAtivas } = await supabaseClient
        .from('corridas')
        .select('id', { count: 'exact', head: true })
        .in('status', ['aceita', 'em_andamento', 'em_curso', 'pendente']);
      document.getElementById('dash-total-viagens').innerText = viagensAtivas || 0;

      // Conta mensagens de suporte novas enviadas pelos passageiros
      const { data: msgs } = await supabaseClient
        .from('mensagens_suporte_app')
        .select('id, lido, remetente')
        .eq('remetente', 'passageiro')
        .eq('lido', false);

      const totalMsgsNovas = (msgs || []).length;
      document.getElementById('dash-total-suporte').innerText = totalMsgsNovas;
      
      const badgeSup = document.getElementById('badge-dash-suporte');
      if (totalMsgsNovas > 0) {
        badgeSup.innerText = totalMsgsNovas;
        badgeSup.classList.remove('hidden');
      } else {
        badgeSup.classList.add('hidden');
      }

      iniciarEscutaRealtimeAdminPrincipal();
    }

    function iniciarEscutaRealtimeAdminPrincipal() {
      if (canalRealtimeAdminPrincipal) supabaseClient.removeChannel(canalRealtimeAdminPrincipal);

      canalRealtimeAdminPrincipal = supabaseClient
        .channel('admin_principal_realtime')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensagens_suporte_app' }, payload => {
          if (payload.new && payload.new.remetente === 'passageiro') {
            tocarSomAlertaAdmin();
            carregarPaginaAtual();
          }
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'corridas' }, payload => {
          if (payload.new && payload.new.avaliacao_motorista && payload.new.avaliacao_motorista < 5) {
            tocarSomAlertaAdmin();
            carregarPaginaAtual();
          }
        })
        .subscribe();
    }

    window.onload = () => verificarSessaoAdmin('inicio', carregarPaginaAtual);
  </script>
</body>
</html>
