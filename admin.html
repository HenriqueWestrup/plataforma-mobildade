<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Mobilidade Laguna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Biblioteca Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 text-xs">

  <div class="max-w-2xl mx-auto space-y-6">
    <!-- CABEÇALHO -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-3xl flex justify-between items-center shadow-lg">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-600/20 border border-emerald-500/40 text-emerald-400 p-2.5 rounded-2xl">
          <i class="fa-solid fa-shield-halved text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-extrabold text-white">Painel Administrativo</h1>
          <p class="text-[11px] text-slate-400">Aprovação de Motoristas e Gestão</p>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="carregarDadosAdmin()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl font-bold border border-slate-700">
          <i class="fa-solid fa-rotate"></i>
        </button>
        <a href="auth.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl font-bold border border-slate-700">Sair</a>
      </div>
    </div>

    <!-- SEÇÃO 1: MOTORISTAS (APROVAÇÃO OBRIGATÓRIA) -->
    <div class="space-y-3">
      <h2 class="text-sm font-extrabold text-amber-400 flex items-center gap-2">
        <i class="fa-solid fa-car"></i> Cadastros de Motoristas
      </h2>
      <div id="lista-admin-motoristas" class="space-y-3">
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">Carregando motoristas...</div>
      </div>
    </div>

    <!-- SEÇÃO 2: PASSAGEIROS -->
    <div class="space-y-3 pt-4 border-t border-slate-800">
      <h2 class="text-sm font-extrabold text-emerald-400 flex items-center gap-2">
        <i class="fa-solid fa-users"></i> Passageiros Cadastrados
      </h2>
      <div id="lista-admin-passageiros" class="space-y-3">
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">Carregando passageiros...</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mmcwmzesjtnqgpcdspir.supabase.co';[cite: 6]
    const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON_PUBLIC_AQUI'; // Cole sua chave anon public aqui
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function carregarDadosAdmin() {
      try {
        // Busca motoristas na tabela do Supabase
        const { data: motoristas, error: errMot } = await supabaseClient.from('motoristas').select('*');
        // Busca passageiros/usuários na tabela do Supabase
        const { data: passageiros, error: errPas } = await supabaseClient.from('usuarios').select('*');

        const divMot = document.getElementById('lista-admin-motoristas');
        if (errMot || !motoristas || motoristas.length === 0) {
          divMot.innerHTML = '<div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">Nenhum motorista cadastrado.</div>';
        } else {
          divMot.innerHTML = motoristas.map((m, idx) => `
            <div class="bg-slate-900 p-4 rounded-2xl border ${m.status === 'aprovado' ? 'border-emerald-500/40' : 'border-amber-500/40'} space-y-3">
              <div class="flex items-center gap-3">
                <img src="${m.foto_url || 'https://ui-avatars.com/api/?name=Motorista'}" class="w-14 h-14 rounded-full object-cover border-2 border-slate-700">
                <div class="flex-1">
                  <div class="flex justify-between items-start">
                    <h3 class="font-extrabold text-white text-sm">${m.nome}</h3>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${m.status === 'aprovado' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">
                      ${m.status === 'aprovado' ? 'Aprovado' : 'Aguardando Aprovação'}
                    </span>
                  </div>
                  <p class="text-slate-400">Cel: ${m.telefone} • CPF: ${m.cpf}</p>
                  <p class="text-slate-300 font-bold">Veículo: ${m.veiculo_modelo} (${m.veiculo_placa})</p>
                </div>
              </div>
              <div class="flex gap-2 pt-2 border-t border-slate-800">
                ${m.status !== 'aprovado' ? `
                  <button onclick="mudarStatusMotorista('${m.id}', 'aprovado')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl">
                    <i class="fa-solid fa-check mr-1"></i> Aprovar Motorista
                  </button>
                ` : `
                  <button onclick="mudarStatusMotorista('${m.id}', 'pendente')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold py-2 rounded-xl">
                    Suspender Acesso
                  </button>
                `}
              </div>
            </div>
          `).join('');
        }

        const divPas = document.getElementById('lista-admin-passageiros');
        if (errPas || !passageiros || passageiros.length === 0) {
          divPas.innerHTML = '<div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-slate-500 text-center">Nenhum passageiro cadastrado.</div>';
        } else {
          divPas.innerHTML = passageiros.map(p => `
            <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-800 flex items-center gap-3">
              <img src="${p.foto_url || 'https://ui-avatars.com/api/?name=Passageiro'}" class="w-12 h-12 rounded-full object-cover border border-emerald-500">
              <div class="flex-1">
                <div class="flex justify-between">
                  <h3 class="font-bold text-white">${p.nome}</h3>
                  <span class="text-[10px] text-emerald-400 font-bold"><i class="fa-solid fa-face-smile"></i> Selfie OK</span>
                </div>
                <p class="text-slate-400">Cel: ${p.telefone} • CPF: ${p.cpf}</p>
              </div>
            </div>
          `).join('');
        }
      } catch (e) {
        console.error("Erro ao carregar admin:", e);
      }
    }

    async function mudarStatusMotorista(id, novoStatus) {
      const { error } = await supabaseClient.from('motoristas').update({ status: novoStatus }).eq('id', id);
      if (error) {
        alert("Erro ao atualizar status: " + error.message);
      } else {
        carregarDadosAdmin();
      }
    }

    window.onload = carregarDadosAdmin;
  </script>
</body>
</html>
