<div class="flex-1 flex flex-col relative w-full h-full bg-slate-950">
  <div id="map-radar" class="w-full h-full absolute inset-0"></div>
  
  <div class="absolute top-4 inset-x-4 bg-slate-900/90 backdrop-blur p-3 rounded-2xl border border-slate-800 text-center z-10 shadow-lg">
    <p class="text-xs font-bold text-amber-400"><i class="fa-solid fa-satellite-dish mr-1"></i> Procurando corridas próximas em Laguna...</p>
  </div>
</div>

<script>
  function inicializarRadar() {
    const latLaguna = -28.4811;
    const lngLaguna = -48.7811;
    const map = L.map('map-radar', { zoomControl: false }).setView([latLaguna, lngLaguna], 14);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
    }).addTo(map);
  }
</script>
