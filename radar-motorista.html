<div class="flex-1 flex flex-col relative bg-slate-950 text-xs">
  <!-- CONTAINER DO MAPA DO RADAR -->
  <div id="map-radar" class="flex-1 w-full h-full z-0"></div>

  <!-- PAINEL DE CORRIDAS DISPONÍVEIS (CARD FLUTUANTE) -->
  <div class="absolute bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-4 rounded-t-3xl shadow-2xl z-10 space-y-3">
    <div class="flex justify-between items-center">
      <h3 class="font-extrabold text-white"><i class="fa-solid fa-radar text-emerald-500 mr-1.5 animate-spin"></i> Procurando Passageiros...</h3>
      <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Online</span>
    </div>

    <!-- Exemplo de Corrida Encontrada no Radar -->
    <div class="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 space-y-2.5">
      <div class="flex justify-between items-center text-[10px] text-slate-400">
        <span>Distância: <strong>1.2 km</strong></span>
        <span class="text-emerald-400 font-extrabold text-xs">R$ 14,90 (PIX)</span>
      </div>

      <div class="space-y-1 text-slate-300">
        <div class="flex items-start gap-2 truncate">
          <i class="fa-solid fa-circle-dot text-emerald-500 mt-0.5 text-[10px]"></i>
          <span>Rua Lauro Müller, Centro</span>
        </div>
        <div class="flex items-start gap-2 truncate">
          <i class="fa-solid fa-location-dot text-amber-500 mt-0.5 text-[10px]"></i>
          <span>Av. Senador Galotti, Mar Grosso</span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-1">
        <button onclick="recusarCorrida()" class="bg-red-950/40 hover:bg-red-900/40 text-red-400 font-bold py-2 rounded-xl border border-red-800 transition">
          Recusar
        </button>
        <button onclick="aceitarCorrida()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl shadow transition">
          Aceitar
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  let mapaRadar = null;

  function inicializarRadar() {
    if (mapaRadar) {
      mapaRadar.invalidateSize();
      return;
    }

    const latLaguna = -28.4811;
    const lngLaguna = -48.7811;

    mapaRadar = L.map('map-radar', { zoomControl: false }).setView([latLaguna, lngLaguna], 14);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(mapaRadar);
  }

  function aceitarCorrida() {
    alert('Corrida aceita! Redirecionando para a rota...');
  }

  function recusarCorrida() {
    alert('Corrida recusada.');
  }
</script>
