<div class="flex-1 relative w-full h-full bg-slate-950 overflow-hidden">
  <!-- MAPA LIVRE PARA QUALQUER REGIÃO -->
  <div id="map-radar" class="w-full h-full absolute inset-0 z-0"></div>

  <!-- BOTÃO POWER FLUTUANTE NO MAPA (VISÍVEL APENAS QUANDO OFFLINE) -->
  <div id="container-power-flutuante" class="absolute top-6 right-4 z-20">
    <button
      id="btn-power-radar"
      type="button"
      onclick="alternarPowerMotorista()"
      class="bg-emerald-600 hover:bg-emerald-500 text-white w-12 h-12 rounded-full shadow-2xl flex items-center justify-center font-bold transition border-2 border-white/20 animate-bounce"
      title="Ligar Aplicativo (Ficar Online)"
    >
      <i class="fa-solid fa-power-off text-base"></i>
    </button>
  </div>

  <!-- BOTÃO GOOGLE MAPS FLUTUANTE (VISÍVEL DURANTE CORRIDA ATIVA) -->
  <div id="container-btn-maps-flutuante" class="hidden absolute bottom-6 right-4 z-30">
    <button
      type="button"
      onclick="abrirNoGoogleMaps()"
      class="bg-sky-600 hover:bg-sky-500 text-white w-12 h-12 rounded-full shadow-2xl flex items-center justify-center font-bold transition border-2 border-white/20"
      title="Abrir no Google Maps"
    >
      <i class="fa-solid fa-map-location-dot text-base"></i>
    </button>
  </div>
</div>

<script>
  var mapaRadarInstancia = null;
  var marcadorCarroRadar = null;
  var camadaRotaRadar = null;

  function radarContaRestrita() {
    if (typeof contaRestritaMotorista === 'function' && typeof motoristaLogado !== 'undefined') {
      return contaRestritaMotorista(motoristaLogado);
    }
    if (typeof motoristaLogado !== 'undefined' && motoristaLogado) {
      const st = String(motoristaLogado.status || '').toLowerCase();
      return (
        st === 'em_analise' ||
        st === 'pendente' ||
        st === 'suspenso' ||
        st === 'suspensa' ||
        st === 'bloqueado' ||
        st === 'bloqueada' ||
        motoristaLogado.banido === true ||
        motoristaLogado.conta_suspensa === true ||
        motoristaLogado.pode_ligar === false
      );
    }
    return false;
  }

  function abrirNoGoogleMaps() {
    if (typeof corridaAtiva === 'undefined' || !corridaAtiva) {
      if (typeof mostrarToastAdmin === 'function') {
        mostrarToastAdmin('Nenhuma corrida ativa para navegar.', 'aviso');
      }
      return;
    }

    let destinoAlvo = corridaAtiva.destino || corridaAtiva.origem || '';
    if (corridaAtiva.status === 'em_andamento') {
      const temParada = Boolean(corridaAtiva.parada && String(corridaAtiva.parada).trim() !== '');
      const paradaConcluida = typeof paradaFinalizada !== 'undefined' ? Boolean(paradaFinalizada) : false;
      destinoAlvo = (temParada && !paradaConcluida) ? corridaAtiva.parada : (corridaAtiva.destino || '');
    } else {
      destinoAlvo = corridaAtiva.origem || corridaAtiva.destino || '';
    }

    if (!destinoAlvo) return;
    const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(destinoAlvo)}`;
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  function inicializarModuloMapaRadar() {
    const latInicial = (typeof ultimaPosicaoGPS !== 'undefined' && ultimaPosicaoGPS) ? ultimaPosicaoGPS.lat : -15.793889;
    const lngInicial = (typeof ultimaPosicaoGPS !== 'undefined' && ultimaPosicaoGPS) ? ultimaPosicaoGPS.lng : -47.882778;
    const zoomInicial = (typeof ultimaPosicaoGPS !== 'undefined' && ultimaPosicaoGPS) ? 16 : 4;

    if (mapaRadarInstancia) {
      mapaRadarInstancia.remove();
      mapaRadarInstancia = null;
    }

    mapaRadarInstancia = L.map('map-radar', { zoomControl: false }).setView([latInicial, lngInicial], zoomInicial);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapaRadarInstancia);

    setTimeout(() => {
      if (mapaRadarInstancia) mapaRadarInstancia.invalidateSize();
    }, 250);

    if (navigator.geolocation && !radarContaRestrita()) {
      navigator.geolocation.getCurrentPosition((pos) => {
        atualizarPosicaoNoMapaRadar(pos.coords.latitude, pos.coords.longitude);
      }, () => {}, { enableHighAccuracy: true });
    }

    sincronizarEstadoRadar();
  }

  function atualizarPosicaoNoMapaRadar(lat, lng) {
    if (!mapaRadarInstancia) return;

    const iconeCarro = L.divIcon({
      className: 'custom-car-marker',
      html: '<div style="background-color: #f59e0b; color: #fff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid #fff;"><i class="fa-solid fa-car text-sm"></i></div>',
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });

    if (!corridaAtiva) {
      mapaRadarInstancia.setView([lat, lng], 16);
    }

    if (marcadorCarroRadar) {
      marcadorCarroRadar.setLatLng([lat, lng]);
    } else {
      marcadorCarroRadar = L.marker([lat, lng], { icon: iconeCarro }).addTo(mapaRadarInstancia).bindPopup("Sua Posição");
    }
  }

  function desenharRotaNoRadar(origemCoords, destinoCoords, paradaCoords = null) {
    if (!mapaRadarInstancia) return;

    if (camadaRotaRadar) {
      mapaRadarInstancia.removeLayer(camadaRotaRadar);
    }

    let pontos = [origemCoords];
    if (paradaCoords) pontos.push(paradaCoords);
    pontos.push(destinoCoords);

    camadaRotaRadar = L.polyline(pontos, { color: '#10b981', weight: 5, opacity: 0.8 }).addTo(mapaRadarInstancia);
    mapaRadarInstancia.fitBounds(camadaRotaRadar.getBounds(), { padding: [50, 50] });
  }

  function removerMarcadorCarroRadar() {
    if (marcadorCarroRadar && mapaRadarInstancia) {
      mapaRadarInstancia.removeLayer(marcadorCarroRadar);
      marcadorCarroRadar = null;
    }
  }

  function sincronizarEstadoRadar() {
    const btnPowerContainer = document.getElementById('container-power-flutuante');
    const btnPower = document.getElementById('btn-power-radar');
    const btnMaps = document.getElementById('container-btn-maps-flutuante');
    const bloqueado = radarContaRestrita();

    if (btnPowerContainer) {
      if (typeof statusOnline !== 'undefined' && statusOnline && !bloqueado) {
        btnPowerContainer.classList.add('hidden');
      } else {
        btnPowerContainer.classList.remove('hidden');
      }
    }

    if (btnPower) {
      if (bloqueado) {
        btnPower.className = 'bg-red-900/90 hover:bg-red-800 text-red-200 w-12 h-12 rounded-full shadow-2xl flex items-center justify-center font-bold transition border-2 border-red-400/50 cursor-not-allowed';
        btnPower.setAttribute('aria-disabled', 'true');
        btnPower.title = 'Botão de ligar bloqueado (conta pendente, em análise, suspensa ou bloqueada)';
      } else {
        btnPower.className = 'bg-emerald-600 hover:bg-emerald-500 text-white w-12 h-12 rounded-full shadow-2xl flex items-center justify-center font-bold transition border-2 border-white/20 animate-bounce';
        btnPower.removeAttribute('aria-disabled');
        btnPower.title = 'Ligar Aplicativo (Ficar Online)';
      }
    }

    if (btnMaps) {
      if (typeof corridaAtiva !== 'undefined' && corridaAtiva) {
        btnMaps.classList.remove('hidden');
      } else {
        btnMaps.classList.add('hidden');
      }
    }
  }

  inicializarModuloMapaRadar();
</script>
