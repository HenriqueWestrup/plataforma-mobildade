<!-- MAPA DO MOTORISTA -->
<div class="relative w-full h-[260px] bg-slate-800">
  <div id="mapa-motorista" class="w-full h-full z-10"></div>
</div>

<div class="z-20 p-4 -mt-4">
  <div class="bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-3">
    
    <!-- ESTADO OFFLINE OU AGUARDANDO CORRIDAS -->
    <div id="radar-status-box" class="text-center py-6 space-y-3">
      <div id="icone-radar-div" class="w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center text-2xl mx-auto">
        <i class="fa-solid fa-power-off"></i>
      </div>
      <h3 id="titulo-radar-status" class="text-sm font-extrabold text-slate-900 dark:text-white">Você está Offline</h3>
      <p id="sub-radar-status" class="text-xs text-slate-500">Fique online para começar a receber chamadas na praça de Laguna.</p>
      <button onclick="alternarStatusOnline()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs shadow-lg transition">Ficar Online Agora</button>
    </div>

    <!-- LISTA DE CORRIDAS DISPONÍVEIS (RADAR) -->
    <div id="box-corridas-disponiveis" class="hidden space-y-3">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <h3 class="text-xs font-extrabold text-slate-900 dark:text-white"><i class="fa-solid fa-radar text-emerald-500 animate-spin mr-1"></i> Procurando Passageiros...</h3>
        <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-bold">Online</span>
      </div>
      <div id="lista-radar-chamados" class="space-y-2 max-h-56 overflow-y-auto"></div>
    </div>

    <!-- CORRIDA ACEITA / EM ANDAMENTO -->
    <div id="box-corrida-ativa" class="hidden space-y-3">
      <div class="bg-slate-900 text-white p-3.5 rounded-2xl space-y-2 border border-slate-800 text-xs">
        <div class="flex justify-between items-center">
          <span class="font-extrabold uppercase text-emerald-400" id="mot-status-corrida">Indo buscar passageiro</span>
          <span class="text-sm font-extrabold" id="mot-valor-corrida">R$ 0,00</span>
        </div>
        <div class="flex items-center gap-3 pt-2 border-t border-slate-800">
          <img id="pass-foto" src="" class="w-11 h-11 rounded-full object-cover border border-emerald-500" />
          <div>
            <p class="font-bold text-sm" id="pass-nome">-</p>
            <p class="text-[10px] text-slate-300">Pagamento: <span id="mot-pagamento" class="font-bold text-emerald-400">PIX</span></p>
          </div>
        </div>
        <div class="bg-slate-950 p-2.5 rounded-xl space-y-1 text-[11px] text-slate-300">
          <p><strong>Embarque:</strong> <span id="mot-origem">-</span></p>
          <p id="linha-parada-b" class="hidden"><strong>Parada B:</strong> <span id="mot-parada-b">-</span></p>
          <p><strong>Destino:</strong> <span id="mot-destino">-</span></p>
        </div>
      </div>

      <!-- BOTÕES DE PROGRESSO DA VIAGEM -->
      <div class="space-y-2">
        <button id="btn-status-acao" onclick="avancarStatusViagem()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs shadow transition">Cheguei no Local</button>
      </div>

      <!-- CHAT COM O PASSAGEIRO -->
      <div class="border border-slate-700 rounded-2xl p-2.5 space-y-1.5 bg-slate-50 dark:bg-slate-800 text-xs">
        <p class="font-bold text-slate-700 dark:text-slate-300"><i class="fa-solid fa-comments mr-1"></i> Chat com Passageiro</p>
        <div id="historico-chat-mot" class="h-24 overflow-y-auto space-y-1.5 pr-1"></div>
        <div class="flex gap-1.5">
          <input type="text" id="input-chat-mot" placeholder="Digite sua mensagem..." class="flex-1 px-3 py-2 bg-white dark:bg-slate-900 border border-slate-700 rounded-xl dark:text-white" />
          <button onclick="enviarMsgMot()" class="bg-emerald-600 text-white px-3.5 py-2 rounded-xl font-bold"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  let mapMotorista = null;
  let marcadorOrigemMot = null;
  let marcadorDestinoMot = null;
  let linhaRotaMot = null;
  let corridaAceitaId = null;
  let statusCorridaAtual = '';
  let radarSubscricao = null;
  let chatSubscricaoMot = null;

  function inicializarRadarMotorista() {
    const el = document.getElementById('mapa-motorista');
    if (!el) return;

    if (mapMotorista) {
      mapMotorista.remove();
      mapMotorista = null;
    }

    mapMotorista = L.map('mapa-motorista', { zoomControl: false }).setView([-28.4811, -48.7811], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapMotorista);
    
    verificarEstadoRadar();
  }

  function verificarEstadoRadar() {
    const boxStatus = document.getElementById('radar-status-box');
    const boxRadar = document.getElementById('box-corridas-disponiveis');
    const boxAtiva = document.getElementById('box-corrida-ativa');

    if (!motoristaAtual || !motoristaAtual.online) {
      boxStatus.classList.remove('hidden');
      boxRadar.classList.add('hidden');
      boxAtiva.classList.add('hidden');
      document.getElementById('icone-radar-div').className = "w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center text-2xl mx-auto";
      document.getElementById('titulo-radar-status').innerText = "Você está Offline";
      document.getElementById('sub-radar-status').innerText = "Fique online para começar a receber chamadas na praça de Laguna.";
      if (radarSubscricao) db.removeChannel(radarSubscricao);
      return;
    }

    boxStatus.classList.add('hidden');
    boxAtiva.classList.add('hidden');
    boxRadar.classList.remove('hidden');
    escutarRadarCorridas();
  }

  function escutarRadarCorridas() {
    carregarCorridasPendentes();
    if (radarSubscricao) return;

    radarSubscricao = db.channel('radar-motoristas')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'corridas' }, () => {
        if (motoristaAtual && motoristaAtual.online && !corridaAceitaId) {
          carregarCorridasPendentes();
        }
      })
      .subscribe();
  }

  async function carregarCorridasPendentes() {
    const { data } = await db.from('corridas').select('*').eq('status', 'aguardando').order('criado_em', { ascending: false });
    const lista = document.getElementById('lista-radar-chamados');
    if (!lista) return;

    if (!data || data.length === 0) {
      lista.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Nenhuma chamada no momento. Aguardando passageiros...</p>';
      return;
    }

    lista.innerHTML = data.map(c => `
      <div class="bg-slate-50 dark:bg-slate-800 p-3 rounded-2xl border border-slate-700 space-y-2 text-xs">
        <div class="flex justify-between items-center font-bold">
          <span class="text-emerald-500 text-sm">R$ ${Number(c.valor).toFixed(2)} (${c.forma_pagamento})</span>
          <span class="text-[10px] text-slate-400">${new Date(c.criado_em).toLocaleTimeString()}</span>
        </div>
        <p class="text-slate-700 dark:text-slate-200"><strong>Passageiro:</strong> ${c.passageiro_nome}</p>
        <p class="text-slate-500"><strong>De:</strong> ${c.origem}</p>
        <p class="text-slate-500"><strong>Para:</strong> ${c.destino}</p>
        <button onclick="aceitarCorrida('${c.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-xs">Aceitar Corrida</button>
      </div>
    `).join('');
  }

  async function aceitarCorrida(id) {
    // Tenta atualizar a corrida garantindo que ainda esteja aguardando
    const { data, error } = await db.from('corridas').update({
      motorista_id: motoristaAtual.id,
      motorista_nome: motoristaAtual.nome,
      status: 'aceita'
    }).eq('id', id).eq('status', 'aguardando').select().single();

    if (error || !data) {
      alert('Esta corrida já foi aceita por outro motorista.');
      carregarCorridasPendentes();
      return;
    }

    if (radarSubscricao) db.removeChannel(radarSubscricao);
    iniciarAtendimentoCorrida(data);
  }

  async function iniciarAtendimentoCorrida(c) {
    corridaAceitaId = c.id;
    statusCorridaAtual = c.status;

    document.getElementById('box-corridas-disponiveis').classList.add('hidden');
    document.getElementById('radar-status-box').classList.add('hidden');
    document.getElementById('box-corrida-ativa').classList.remove('hidden');

    document.getElementById('mot-valor-corrida').innerText = `R$ ${Number(c.valor).toFixed(2)}`;
    document.getElementById('pass-nome').innerText = c.passageiro_nome || 'Passageiro';
    document.getElementById('mot-pagamento').innerText = c.forma_pagamento;
    document.getElementById('mot-origem').innerText = c.origem;
    document.getElementById('mot-destino').innerText = c.destino;

    if (c.parada_b) {
      document.getElementById('linha-parada-b').classList.remove('hidden');
      document.getElementById('mot-parada-b').innerText = c.parada_b;
    }

    if (c.passageiro_id) {
      const { data: pass } = await db.from('usuarios').select('foto_url').eq('id', c.passageiro_id).single();
      if (pass && pass.foto_url) {
        document.getElementById('pass-foto').src = pass.foto_url;
      }
    }

    atualizarTextoBotaoAcao();
    escutarStatusCorridaMot(c.id);
    iniciarChatMot(c.id);
  }

  function atualizarTextoBotaoAcao() {
    const btn = document.getElementById('btn-status-acao');
    const label = document.getElementById('mot-status-corrida');

    if (statusCorridaAtual === 'aceita') {
      label.innerText = 'Indo buscar passageiro';
      btn.innerText = 'Cheguei no Local de Embarque';
    } else if (statusCorridaAtual === 'no_local') {
      label.innerText = 'No local aguardando';
      btn.innerText = 'Iniciar Viagem (Passageiro a Bordo)';
    } else if (statusCorridaAtual === 'em_viagem') {
      label.innerText = 'Viagem em andamento';
      btn.innerText = 'Finalizar Corrida';
    }
  }

  async function avancarStatusViagem() {
    let proximoStatus = 'no_local';
    if (statusCorridaAtual === 'aceita') proximoStatus = 'no_local';
    else if (statusCorridaAtual === 'no_local') proximoStatus = 'em_viagem';
    else if (statusCorridaAtual === 'em_viagem') proximoStatus = 'finalizada';

    const updatePayload = { status: proximoStatus };
    if (proximoStatus === 'no_local') updatePayload.chegada_embarque_em = new Date().toISOString();

    await db.from('corridas').update(updatePayload).eq('id', corridaAceitaId);
    statusCorridaAtual = proximoStatus;

    if (proximoStatus === 'finalizada') {
      alert('Corrida concluída com sucesso!');
      window.location.reload();
    } else {
      atualizarTextoBotaoAcao();
    }
  }

  function escutarStatusCorridaMot(id) {
    db.channel('mot-status-' + id)
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'corridas', filter: `id=eq.${id}` }, (p) => {
        if (p.new.status === 'cancelada') {
          alert('O passageiro cancelou a corrida.');
          window.location.reload();
        }
      })
      .subscribe();
  }

  function iniciarChatMot(id) {
    carregarMensagensMot(id);
    if (chatSubscricaoMot) return;
    chatSubscricaoMot = db.channel('mot-chat-' + id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensagens_chat', filter: `corrida_id=eq.${id}` }, (p) => {
        renderizarMsgMot(p.new);
      })
      .subscribe();
  }

  async function carregarMensagensMot(id) {
    const { data } = await db.from('mensagens_chat').select('*').eq('corrida_id', id).order('criado_em', { ascending: true });
    const div = document.getElementById('historico-chat-mot');
    if (div) {
      div.innerHTML = '';
      if (data) data.forEach(m => renderizarMsgMot(m));
    }
  }

  function renderizarMsgMot(m) {
    const div = document.getElementById('historico-chat-mot');
    if (!div) return;
    const eu = m.remetente_id === motoristaAtual.id;
    div.innerHTML += `<div class="p-1.5 rounded-xl text-[11px] ${eu ? 'bg-emerald-600 text-white ml-6 text-right' : 'bg-slate-700 text-white mr-6'}">
      <span class="block text-[9px] opacity-75 font-bold">${m.remetente_nome}</span>${m.mensagem}
    </div>`;
    div.scrollTop = div.scrollHeight;
  }

  async function enviarMsgMot() {
    const input = document.getElementById('input-chat-mot');
    const texto = input.value.trim();
    if (!texto || !corridaAceitaId) return;
    input.value = '';
    await db.from('mensagens_chat').insert([{
      corrida_id: corridaAceitaId, remetente_id: motoristaAtual.id, remetente_nome: motoristaAtual.nome, mensagem: texto
    }]);
  }
</script>
