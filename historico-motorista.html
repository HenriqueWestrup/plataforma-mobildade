<div class="p-5 flex-1 overflow-y-auto space-y-4 bg-slate-950 text-xs">
  <div class="flex justify-between items-center">
    <h2 class="text-sm font-extrabold text-white">
      <i class="fa-solid fa-clock-rotate-left text-amber-500 mr-1.5"></i> Histórico de Corridas (Motorista)
    </h2>
    <button onclick="carregarHistoricoMotoristaModular()" class="bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl border border-slate-800 font-bold transition">
      <i class="fa-solid fa-rotate mr-1"></i> Atualizar
    </button>
  </div>

  <!-- CONTAINER DO HISTÓRICO -->
  <div id="lista-historico-motorista" class="space-y-3">
    <div class="text-center py-8 text-slate-500">
      <i class="fa-solid fa-spinner fa-spin text-lg mb-2 text-amber-400"></i>
      <p>Carregando histórico de corridas...</p>
    </div>
  </div>
</div>

<script>
  async function carregarHistoricoMotoristaModular() {
    const container = document.getElementById('lista-historico-motorista');
    if (!container) return;

    // Recupera o motorista logado via localStorage
    const storageMotorista = localStorage.getItem('motorista_logado');
    if (!storageMotorista) {
      container.innerHTML = `<div class="text-center py-8 text-slate-500">Motorista não identificado.</div>`;
      return;
    }

    const motoristaObj = JSON.parse(storageMotorista);

    try {
      // Consulta as corridas finalizadas ou canceladas do motorista no Supabase
      const { data: corridas, error } = await supabaseClient
        .from('corridas')
        .select('*, passageiro:passageiro_id(nome)')
        .eq('motorista_id', motoristaObj.id)
        .in('status', ['concluido', 'cancelado'])
        .order('id', { ascending: false });

      if (error) throw error;

      if (!corridas || corridas.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center space-y-2">
            <i class="fa-solid fa-car-side text-2xl text-slate-600"></i>
            <p class="text-slate-400 font-bold">Nenhuma corrida no histórico ainda.</p>
            <p class="text-[10px] text-slate-500">Suas corridas finalizadas aparecerão aqui.</p>
          </div>
        `;
        return;
      }

      let html = '';
      corridas.forEach(c => {
        const isConcluido = c.status === 'concluido';
        const corBadge = isConcluido 
          ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' 
          : 'bg-red-500/20 text-red-400 border-red-500/30';
        
        const textoStatus = isConcluido ? 'Finalizada' : 'Cancelada';
        const valorCorrida = (c.valor || 15.0).toFixed(2).replace('.', ',');
        const dataFormatada = c.created_at ? new Date(c.created_at).toLocaleDateString('pt-BR') + ' • ' + new Date(c.created_at).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) : 'Recente';

        html += `
          <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2.5 shadow-sm">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
              <span class="text-[10px] text-slate-400 font-medium">${dataFormatada}</span>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${corBadge}">
                ${textoStatus}
              </span>
            </div>

            <div class="space-y-1.5 text-slate-300">
              <div class="flex items-start gap-2">
                <i class="fa-solid fa-circle-dot text-emerald-500 mt-0.5 text-[10px]"></i>
                <p class="truncate"><strong>Origem:</strong> ${c.origem || '-'}</p>
              </div>
              <div class="flex items-start gap-2">
                <i class="fa-solid fa-location-dot text-amber-500 mt-0.5 text-[10px]"></i>
                <p class="truncate"><strong>Destino:</strong> ${c.destino || '-'}</p>
              </div>
            </div>

            <div class="flex justify-between items-center pt-2 border-t border-slate-800">
              <span class="text-slate-400">Valor da Corrida</span>
              <span class="text-sm font-extrabold text-emerald-400">R$ ${valorCorrida}</span>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;

    } catch (err) {
      console.error(err);
      container.innerHTML = `<div class="text-center py-8 text-red-400">Erro ao carregar o histórico de corridas.</div>`;
    }
  }

  // Executa imediatamente ao injetar a aba
  carregarHistoricoMotoristaModular();
</script>
