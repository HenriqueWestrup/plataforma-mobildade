<div class="p-5 flex-1 overflow-y-auto space-y-4 bg-slate-50 dark:bg-slate-900 text-xs">
  <div class="bg-slate-900 text-white p-4 rounded-3xl space-y-1 shadow-lg border border-slate-800">
    <p class="text-[10px] font-bold uppercase text-emerald-400">Faturamento Acumulado (7 dias)</p>
    <p class="text-2xl font-extrabold text-white" id="ganhos-total-semana">R$ 0,00</p>
    <p class="text-[11px] text-slate-400"><span id="ganhos-qtd-corridas">0</span> corridas finalizadas</p>
  </div>

  <h3 class="font-extrabold text-slate-900 dark:text-white pt-2">Suas Últimas Viagens</h3>
  <div id="lista-viagens-motorista" class="space-y-2.5"></div>
</div>

<script>
  async function carregarGanhosMotorista() {
    if (!motoristaAtual) return;

    const { data } = await db.from('corridas').select('*').eq('motorista_id', motoristaAtual.id).eq('status', 'finalizada').order('criado_em', { ascending: false });
    const lista = document.getElementById('lista-viagens-motorista');
    if (!lista) return;

    if (!data || data.length === 0) {
      lista.innerHTML = '<p class="text-slate-500 text-center py-6">Nenhuma corrida finalizada recentemente.</p>';
      return;
    }

    const agora = new Date();
    const corridasSemana = data.filter(c => (agora - new Date(c.criado_em)) / (1000 * 60 * 60 * 24) <= 7);
    const totalSemana = corridasSemana.reduce((acc, c) => acc + Number(c.valor || 0), 0);

    document.getElementById('ganhos-total-semana').innerText = `R$ ${totalSemana.toFixed(2)}`;
    document.getElementById('ganhos-qtd-corridas').innerText = corridasSemana.length;

    lista.innerHTML = data.map(c => `
      <div class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-1 shadow-sm">
        <div class="flex justify-between items-center font-bold">
          <span class="text-emerald-600">R$ ${Number(c.valor).toFixed(2)} (${c.forma_pagamento})</span>
          <span class="text-[10px] text-slate-400">${new Date(c.criado_em).toLocaleDateString()}</span>
        </div>
        <p class="text-slate-600 dark:text-slate-300"><strong>Passageiro:</strong> ${c.passageiro_nome || '-'}</p>
        <p class="text-slate-500 text-[11px]"><strong>Rota:</strong> ${c.origem} ➔ ${c.destino}</p>
      </div>
    `).join('');
  }
</script>
