<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mobilidade Laguna - Passageiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden m-0 p-0">

  <!-- TOPO -->
  <header class="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center shrink-0">
    <div class="flex items-center gap-2">
      <div class="bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 p-2 rounded-xl">
        <i class="fa-solid fa-car text-sm"></i>
      </div>
      <div>
        <h1 class="text-sm font-extrabold text-white">Mobilidade Laguna</h1>
        <span class="text-[10px] text-emerald-400 font-bold flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span> Online
        </span>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO CENTRAL -->
  <main class="flex-1 overflow-y-auto relative flex flex-col pb-24">
    <div id="map" class="w-full h-64 shrink-0 bg-slate-900"></div>
    
    <div class="p-4 space-y-3 flex-1">
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3 shadow-lg">
        <div class="flex items-center gap-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
          <i class="fa-solid fa-location-dot text-emerald-400"></i>
          <input type="text" placeholder="Local de embarque" class="bg-transparent w-full text-xs text-slate-100 focus:outline-none">
        </div>
        <div class="flex items-center gap-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
          <i class="fa-solid fa-location-pin text-amber-400"></i>
          <input type="text" placeholder="Para onde vamos?" class="bg-transparent w-full text-xs text-slate-100 focus:outline-none">
        </div>
        <div class="flex justify-between items-center pt-2 text-xs">
          <span class="text-slate-400">Estimativa (PIX)</span>
          <span class="text-emerald-400 font-extrabold text-sm">R$ 14,90</span>
        </div>
        <button class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition text-xs">
          Chamar Motorista
        </button>
      </div>
    </div>
  </main>

  <!-- BARRA DE NAVEGAÇÃO INFERIOR FIXA -->
  <nav class="absolute bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 py-3 px-6 flex justify-around items-center z-50">
    <a href="index.html" class="text-emerald-400 flex flex-col items-center gap-1">
      <i class="fa-solid fa-house text-base"></i>
      <span class="text-[10px]">Início</span>
    </a>
    <a href="corridas.html" class="text-slate-400 hover:text-slate-200 flex flex-col items-center gap-1">
      <i class="fa-solid fa-clock-rotate-left text-base"></i>
      <span class="text-[10px]">Histórico</span>
    </a>
    <a href="perfil.html" class="text-slate-400 hover:text-slate-200 flex flex-col items-center gap-1">
      <i class="fa-solid fa-user text-base"></i>
      <span class="text-[10px]">Perfil</span>
    </a>
  </nav>

</body>
</html>
