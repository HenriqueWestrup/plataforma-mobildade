<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>App Passageiro - Mobilidade Urbana</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- LEAFLET CSS & JS NO CABEÇALHO PARA GARANTIR CARREGAMENTO GLOBAL -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-slate-950 flex justify-center min-h-screen">

<div class="w-full max-w-[440px] bg-slate-50 dark:bg-slate-900 min-h-screen flex flex-col shadow-2xl overflow-x-hidden relative transition-colors duration-200">

  <!-- CABEÇALHO FIXO -->
  <header class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between shadow-md z-30">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-emerald-500 text-slate-950 flex items-center justify-center font-bold">
        <i class="fa-solid fa-car-side"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold leading-tight">Mobilidade Laguna</h1>
        <p class="text-[10px] text-slate-400">Passageiro</p>
      </div>
    </div>
    <div id="header-acoes"></div>
  </header>

  <!-- CONTAINER DINÂMICO (INJEÇÃO DAS ABAS) -->
  <main id="conteudo-principal" class="flex-1 flex flex-col relative overflow-hidden">
    <!-- O conteúdo da aba ativa é injetado aqui -->
  </main>

  <!-- MENU INFERIOR DE NAVEGAÇÃO -->
  <nav id="menu-inferior" class="hidden bg-slate-900 border-t border-slate-800 p-2 flex justify-around z-30 text-xs text-slate-400">
    <button onclick="carregarAba('mapa')" id="btn-aba-mapa" class="flex flex-col items-center gap-1 text-emerald-400">
      <i class="fa-solid fa-map text-base"></i>
      <span class="text-[10px] font-bold">Mapa</span>
    </button>
    <button onclick="carregarAba('historico')" id="btn-aba-historico" class="flex flex-col items-center gap-1 hover:text-white">
      <i class="fa-solid fa-clock-rotate-left text-base"></i>
      <span class="text-[10px] font-bold">Histórico</span>
    </button>
    <button onclick="carregarAba('perfil')" id="btn-aba-perfil" class="flex flex-col items-center gap-1 hover:text-white">
      <i class="fa-solid fa-user text-base"></i>
      <span class="text-[10px] font-bold">Perfil</span>
    </button>
  </nav>

</div>

<script>
  const SUPABASE_URL = 'https://mmcwmzesjtnqgpcdspir.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_XZVaqjSNHsQSgZwxsfIZsQ__crRqWTo';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let usuarioAtual = null;

  window.onload = async () => {
    const salvo = localStorage.getItem('passageiro_logado');
    if (salvo) {
      usuarioAtual = JSON.parse(salvo);
      document.getElementById('menu-inferior').classList.remove('hidden');
      carregarAba('mapa');
    } else {
      carregarAba('auth');
    }
  };

  async function carregarAba(nomeAba) {
    const container = document.getElementById('conteudo-principal');
    
    ['mapa', 'historico', 'perfil'].forEach(aba => {
      const btn = document.getElementById(`btn-aba-${aba}`);
      if (btn) {
        btn.className = aba === nomeAba 
          ? 'flex flex-col items-center gap-1 text-emerald-400 font-bold' 
          : 'flex flex-col items-center gap-1 text-slate-400 hover:text-white';
      }
    });

    try {
      const resposta = await fetch(`${nomeAba}.html`);
      if (resposta.ok) {
        container.innerHTML = await resposta.text();
        
        if (nomeAba === 'mapa' && typeof inicializarModuloMapa === 'function') {
          setTimeout(inicializarModuloMapa, 150);
        }
        if (nomeAba === 'historico' && typeof carregarModuloHistorico === 'function') carregarModuloHistorico();
        if (nomeAba === 'perfil' && typeof carregarModuloPerfil === 'function') carregarModuloPerfil();
        if (nomeAba === 'auth' && typeof inicializarModuloAuth === 'function') inicializarModuloAuth();
      } else {
        container.innerHTML = `<div class="p-6 text-center text-slate-500">Erro ao carregar o módulo ${nomeAba}.</div>`;
      }
    } catch (e) {
      container.innerHTML = `<div class="p-6 text-center text-slate-500">Módulo indisponível no momento.</div>`;
    }
  }

  function sairConta() {
    localStorage.removeItem('passageiro_logado');
    location.reload();
  }
</script>
</body>
</html>
