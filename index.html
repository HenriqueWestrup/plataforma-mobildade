<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mobilidade Laguna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Leaflet CSS e JS para o Mapa (Sem Chave de API) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden m-0 p-0 text-xs">

  <!-- BANNER DE CONTA SUSPENSA / BLOQUEADA -->
  <div id="banner-bloqueio" class="hidden bg-red-950/90 border-b border-red-600 p-3 flex flex-col gap-2 shrink-0 z-50 transition-all duration-300">
    <div class="flex items-center gap-2 text-red-300">
      <i class="fa-solid fa-triangle-exclamation text-base animate-bounce"></i>
      <div class="flex-1">
        <h4 class="font-extrabold text-white text-xs">Atenção: Conta Suspensa Temporariamente</h4>
        <p class="text-[10px] text-red-200">Seu acesso para corridas está restrito. Entre em contato com o suporte para reativação.</p>
      </div>
      <button onclick="abrirSuporteBloqueio()" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-xl font-bold text-[11px] shadow">
        Falar com Suporte
      </button>
    </div>
  </div>

  <header class="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center shrink-0 z-40">
    <div class="flex items-center gap-3">
      <button onclick="toggleMenuLateral()" class="text-slate-300 hover:text-white p-2 rounded-xl bg-slate-800 border border-slate-700">
        <i class="fa-solid fa-bars text-sm"></i>
      </button>
      <div class="flex items-center gap-2">
        <div id="icone-tipo-topo" class="bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 p-2 rounded-xl">
          <i class="fa-solid fa-car text-sm"></i>
        </div>
        <div>
          <h1 class="text-sm font-extrabold text-white" id="titulo-app-topo">Mobilidade Laguna</h1>
          <span id="status-conexao-topo" class="text-[10px] text-emerald-400 font-bold flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span> Online
          </span>
        </div>
      </div>
    </div>
  </header>

  <!-- GAVETA DO MENU LATERAL -->
  <div id="menu-lateral" class="fixed inset-y-0 left-0 w-72 bg-slate-900 border-r border-slate-800 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
    <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
      <div class="flex items-center gap-3">
        <img id="menu-foto" src="https://ui-avatars.com/api/?name=Usuario" class="w-10 h-10 rounded-full object-cover border border-emerald-500">
        <div>
          <h3 id="menu-nome" class="font-bold text-white text-xs">Carregando...</h3>
          <p id="menu-tipo" class="text-[10px] text-slate-400">-</p>
        </div>
      </div>
      <button onclick="toggleMenuLateral()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>

    <div class="flex-1 p-3 space-y-2 overflow-y-auto">
      <a href="index.html" class="w-full flex items-center gap-3 p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-slate-200 font-bold transition">
        <i class="fa-solid fa-house text-emerald-400 w-5"></i> Mapa / Início
      </a>
      <a href="historico.html" class="w-full flex items-center gap-3 p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-slate-200 font-bold transition">
        <i class="fa-solid fa-clock-rotate-left text-amber-400 w-5"></i> Histórico de Viagens
      </a>
      <a href="perfil.html" class="w-full flex items-center gap-3 p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-slate-200 font-bold transition">
        <i class="fa-solid fa-user text-sky-400 w-5"></i> Meu Perfil
      </a>
    </div>

    <div class="p-4 border-t border-slate-800">
      <button onclick="sairConta()" class="w-full bg-red-950/40 text-red-400 font-bold py-2.5 rounded-xl border border-red-800 hover:bg-red-900/40 transition">
        Sair da Conta
      </button>
    </div>
  </div>

  <!-- CONTEÚDO PRINCIPAL COM O MAPA -->
  <main class="flex-1 overflow-hidden relative flex flex-col">
    <!-- MAPA LEAFLET -->
    <div id="map" class="absolute inset-0 w-full h-full z-0"></div>

    <!-- PAINEL FLUTUANTE DE SOLICITAÇÃO DE CORRIDA -->
    <div class="absolute bottom-4 inset-x-4 bg-slate-900/95 backdrop-blur-md border border-slate-800 p-4 rounded-2xl space-y-3 shadow-2xl z-20">
      
      <!-- CAMPO ORIGEM -->
      <div class="relative">
        <div class="flex items-center gap-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
          <i class="fa-solid fa-circle-dot text-emerald-400"></i>
          <input type="text" id="input-origem" placeholder="Local de embarque" oninput="buscarSugestoes(this.value, 'origem')" class="bg-transparent w-full text-xs text-slate-100 focus:outline-none">
          <button onclick="usarMinhaLocalizacao()" title="Usar minha GPS" class="text-emerald-400 hover:text-emerald-300 px-1"><i class="fa-solid fa-crosshairs"></i></button>
        </div>
        <div id="sugestoes-origem" class="absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-800 rounded-xl shadow-xl z-30 hidden max-h-40 overflow-y-auto"></div>
      </div>

      <!-- CAMPO DESTINO -->
      <div class="relative">
        <div class="flex items-center gap-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
          <i class="fa-solid fa-location-pin text-amber-400"></i>
          <input type="text" id="input-destino" placeholder="Para onde vamos?" oninput="buscarSugestoes(this.value, 'destino')" class="bg-transparent w-full text-xs text-slate-100 focus:outline-none">
        </div>
        <div id="sugestoes-destino" class="absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-800 rounded-xl shadow-xl z-30 hidden max-h-40 overflow-y-auto"></div>
      </div>

      <!-- ESTIMATIVA E BOTÃO -->
      <div id="bloco-estimativa" class="hidden flex justify-between items-center px-1 text-slate-300">
        <span>Estimativa (PIX/Dinheiro)</span>
        <span id="valor-estimado" class="text-sm font-extrabold text-emerald-400">R$ 0,00</span>
      </div>

      <button id="btn-chamar-corrida" onclick="tentarChamarCorrida()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs transition-all duration-300 shadow-lg shadow-emerald-950/50">
        Chamar Motorista
      </button>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://mmcwmzesjtnqgpcdspir.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tY3dtemVzanRucWdwY2RzcGlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NTgyMzUsImV4cCI6MjExMDAzNDIzNX0.VfOyJpZ5Xl30CvLtP-ZpAl1BO1ijVU8ChpabOPmel-E';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let usuarioLogado = null;
    let intervaloHeartbeat = null;
    let mapaLeaflet = null;
    let marcadorOrigem = null;
    let marcadorDestino = null;
    let coordsOrigem = null;
    let coordsDestino = null;

    async function inicializarApp() {
      const motoristaStorage = localStorage.getItem('motorista_logado');
      const passageiroStorage = localStorage.getItem('passageiro_logado');

      if (motoristaStorage) {
        usuarioLogado = JSON.parse(motoristaStorage);
        window.location.href = 'motorista.html';
        return;
      } else if (passageiroStorage) {
        usuarioLogado = JSON.parse(passageiroStorage);
        document.getElementById('menu-tipo').innerText = "Passageiro";
        iniciarHeartbeatOnline();
      } else {
        window.location.href = 'auth.html';
        return;
      }

      try {
        const { data } = await supabaseClient.from('usuarios').select('*').eq('id', usuarioLogado.id).single();
        if (data) usuarioLogado = data;
      } catch (e) {
        console.error("Erro ao verificar status:", e);
      }

      document.getElementById('menu-nome').innerText = usuarioLogado.nome || 'Usuário';
      document.getElementById('menu-foto').src = usuarioLogado.foto_url || 'https://ui-avatars.com/api/?name=Usuario';

      if (usuarioLogado.status === 'bloqueado' || usuarioLogado.status === 'pendente') {
        document.getElementById('banner-bloqueio').classList.remove('hidden');
      }

      inicializarMapa();
      usarMinhaLocalizacao();
    }

    function inicializarMapa() {
      if (mapaLeaflet) return;
      const latLaguna = -28.4811;
      const lngLaguna = -48.7811;

      mapaLeaflet = L.map('map', { zoomControl: false }).setView([latLaguna, lngLaguna], 14);

      // Camada padrão OpenStreetMap livre de chaves de API
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(mapaLeaflet);

      setTimeout(() => {
        mapaLeaflet.invalidateSize();
      }, 300);
    }

    function usarMinhaLocalizacao() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            coordsOrigem = { lat, lng };

            if (mapaLeaflet) {
              mapaLeaflet.setView([lat, lng], 15);
              if (marcadorOrigem) mapaLeaflet.removeLayer(marcadorOrigem);
              marcadorOrigem = L.marker([lat, lng]).addTo(mapaLeaflet).bindPopup("Sua Localização").openPopup();
            }

            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
              .then(res => res.json())
              .then(data => {
                if (data && data.display_name) {
                  document.getElementById('input-origem').value = data.display_name;
                }
              }).catch(() => {
                document.getElementById('input-origem').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
              });
          },
          () => {
            alert("Não foi possível obter sua localização GPS. Verifique as permissões.");
          },
          { enableHighAccuracy: true }
        );
      }
    }

    async function buscarSugestoes(termo, tipo) {
      const container = document.getElementById(`sugestoes-${tipo}`);
      if (termo.length < 3) {
        container.classList.add('hidden');
        return;
      }

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(termo + ', Laguna, Santa Catarina')}`);
        const resultados = await res.json();

        if (!resultados || resultados.length === 0) {
          container.classList.add('hidden');
          return;
        }

        container.innerHTML = resultados.map(item => `
          <div onclick="selecionarEndereco('${item.display_name.replace(/'/g, "")}', ${item.lat}, ${item.lon}, '${tipo}')" class="p-2.5 hover:bg-slate-800 cursor-pointer border-b border-slate-800 text-slate-200 truncate">
            <i class="fa-solid fa-location-dot text-emerald-400 mr-2"></i> ${item.display_name}
          </div>
        `).join('');
        container.classList.remove('hidden');
      } catch (e) {
        console.error("Erro no autocomplete:", e);
      }
    }

    function selecionarEndereco(nome, lat, lon, tipo) {
      document.getElementById(`input-${tipo}`).value = nome;
      document.getElementById(`sugestoes-${tipo}`).classList.add('hidden');

      const coord = { lat: parseFloat(lat), lng: parseFloat(lon) };

      if (tipo === 'origem') {
        coordsOrigem = coord;
        if (marcadorOrigem) mapaLeaflet.removeLayer(marcadorOrigem);
        marcadorOrigem = L.marker([lat, lon]).addTo(mapaLeaflet);
      } else {
        coordsDestino = coord;
        if (marcadorDestino) mapaLeaflet.removeLayer(marcadorDestino);
        marcadorDestino = L.marker([lat, lon], {
          icon: L.divIcon({ className: 'bg-amber-500 w-3 h-3 rounded-full border-2 border-white' })
        }).addTo(mapaLeaflet);
      }

      if (coordsOrigem && coordsDestino) {
        calcularRotaEValor();
      }
    }

    function calcularRotaEValor() {
      if (!coordsOrigem || !coordsDestino) return;

      const R = 6371;
      const dLat = (coordsDestino.lat - coordsOrigem.lat) * Math.PI / 180;
      const dLon = (coordsDestino.lng - coordsOrigem.lng) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(coordsOrigem.lat * Math.PI / 180) * Math.cos(coordsDestino.lat * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const distanciaKm = R * c;

      let valorCalculado = 5.0 + (distanciaKm * 3.50);
      if (valorCalculado < 10.0) valorCalculado = 10.0;

      document.getElementById('valor-estimado').innerText = `R$ ${valorCalculado.toFixed(2).replace('.', ',')}`;
      document.getElementById('bloco-estimativa').classList.remove('hidden');

      const bounds = L.latLngBounds([coordsOrigem.lat, coordsOrigem.lng], [coordsDestino.lat, coordsDestino.lng]);
      mapaLeaflet.fitBounds(bounds, { padding: [50, 50] });
    }

    function iniciarHeartbeatOnline() {
      if (!usuarioLogado || !usuarioLogado.id) return;
      const atualizarPresenca = async (statusOnline) => {
        try {
          await supabaseClient.from('usuarios').update({ online: statusOnline }).eq('id', usuarioLogado.id);
        } catch (err) {}
      };
      atualizarPresenca(true);
      intervaloHeartbeat = setInterval(() => atualizarPresenca(true), 15000);
      window.addEventListener('beforeunload', () => {
        supabaseClient.from('usuarios').update({ online: false }).eq('id', usuarioLogado.id);
      });
    }

    function dispararAlertaBloqueioVisual() {
      const banner = document.getElementById('banner-bloqueio');
      banner.classList.add('bg-red-600', 'animate-pulse');
      setTimeout(() => banner.classList.remove('bg-red-600', 'animate-pulse'), 3000);
    }

    async function tentarChamarCorrida() {
      if (usuarioLogado.status === 'bloqueado' || usuarioLogado.status === 'pendente') {
        dispararAlertaBloqueioVisual();
        return;
      }

      const origem = document.getElementById('input-origem').value;
      const destino = document.getElementById('input-destino').value;
      const valorTexto = document.getElementById('valor-estimado').innerText;

      if (!origem || !destino) {
        alert("Por favor, informe a origem e o destino da corrida.");
        return;
      }

      const valorNumerico = parseFloat(valorTexto.replace('R$ ', '').replace(',', '.')) || 15.0;

      const { error } = await supabaseClient.from('corridas').insert([{
        passageiro_id: usuarioLogado.id,
        origem: origem,
        destino: destino,
        valor: valorNumerico,
        status: 'procurando'
      }]);

      if (error) {
        alert("Erro ao chamar motorista: " + error.message);
      } else {
        alert("Buscando motorista parceiro mais próximo em Laguna...");
      }
    }

    function toggleMenuLateral() {
      document.getElementById('menu-lateral').classList.toggle('-translate-x-full');
    }

    async function sairConta() {
      if (usuarioLogado && usuarioLogado.id) {
        try { await supabaseClient.from('usuarios').update({ online: false }).eq('id', usuarioLogado.id); } catch(e) {}
      }
      clearInterval(intervaloHeartbeat);
      localStorage.removeItem('passageiro_logado');
      localStorage.removeItem('motorista_logado');
      window.location.href = 'auth.html';
    }

    window.onload = inicializarApp;
  </script>
</body>
</html>
