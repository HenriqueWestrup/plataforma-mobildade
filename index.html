<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Passageiro - Modular</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-slate-950 flex justify-center min-h-screen">

  <div class="w-full max-w-[440px] bg-slate-900 min-h-screen flex flex-col shadow-2xl relative">
    
    <!-- HEADER FIXO -->
    <header class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between border-b border-slate-800 z-30">
      <h1 class="text-sm font-bold">Mobilidade Laguna</h1>
      <button onclick="abrirConfiguracoes()" class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg"><i class="fa-solid fa-gear"></i></button>
    </header>

    <!-- CONTAINER DINÂMICO ONDE AS ABAS SÃO CARREGADAS -->
    <main id="conteudo-principal" class="flex-1 flex flex-col relative overflow-hidden">
      <!-- O conteúdo da aba ativa entra aqui via JavaScript -->
    </main>

    <!-- MENU INFERIOR DE NAVEGAÇÃO -->
    <nav class="bg-slate-900 border-t border-slate-800 p-2 flex justify-around z-30 text-xs">
      <button onclick="carregarAba('mapa')" class="flex flex-col items-center text-emerald-400"><i class="fa-solid fa-map text-base"><span>Mapa</span></i></button>
      <button onclick="carregarAba('historico')" class="flex flex-col items-center text-slate-400"><i class="fa-solid fa-clock-rotate-left text-base"><span>Histórico</span></i></button>
      <button onclick="carregarAba('perfil')" class="flex flex-col items-center text-slate-400"><i class="fa-solid fa-user text-base"><span>Perfil</span></i></button>
    </nav>

  </div>

<script>
  // Função que troca o conteúdo injetando apenas o arquivo HTML correspondente
  async function carregarAba(nomeAba) {
    const container = document.getElementById('conteudo-principal');
    try {
      const resposta = await fetch(`${nomeAba}.html`);
      if (resposta.ok) {
        container.innerHTML = await resposta.text();
        // Dispara o script específico da aba se houver
        if (nomeAba === 'mapa' && typeof inicializarMapa === 'function') inicializarMapa();
      } else {
        container.innerHTML = `<div class="p-6 text-center text-slate-400">Erro ao carregar a aba ${nomeAba}.</div>`;
      }
    } catch (e) {
      container.innerHTML = `<div class="p-6 text-center text-slate-400">Módulo indisponível no momento.</div>`;
    }
  }

  // Carrega o mapa por padrão ao abrir o app
  window.onload = () => carregarAba('mapa');
</script>
</body>
</html>
