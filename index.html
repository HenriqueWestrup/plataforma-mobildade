<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mobilidade Laguna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden m-0 p-0 text-xs">

  <!-- BANNER DE CONTA SUSPENSA / BLOQUEADA -->
  <div id="banner-bloqueio" class="hidden bg-red-950/90 border-b border-red-600 p-3 flex flex-col gap-2 shrink-0 z-50 transition-all duration-300">
    <div class="flex items-center gap-2 text-red-300">
      <i class="fa-solid fa-triangle-exclamation text-base animate-bounce"></i>
      <div class="flex-1">
        <h4 class="font-extrabold text-white text-xs">Atenção: Conta Suspensa Temporariamente</h4>
        <p class="text-[10px] text-red-200">Seu acesso para corridas está restrito. Entre em contato com o suporte para reativação.</p>
      </div>
      <button onclick="abrirSuporteBloqueio()" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-xl font-bold text-[11px] shadow">
        Falar com Suporte
      </button>
    </div>
  </div>

  <header class="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center shrink-0 z-40">
    <div class="flex items-center gap-3">
      <button onclick="toggleMenuLateral()" class="text-slate-300 hover:text-white p-2 rounded-xl bg-slate-800 border border-slate-700">
        <i class="fa-solid fa-bars text-sm"></i>
      </button>
      <div class="flex items-center gap-2">
        <div id="icone-tipo-topo" class="bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 p-2 rounded-xl">
          <i class="fa-solid fa-car text-sm"></i>
        </div>
        <div>
          <h1 class="text-sm font-extrabold text-white" id="titulo-app-topo">Mobilidade Laguna</h1>
          <span id="status-conexao-topo" class="text-[10px] text-emerald-400 font-bold flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span> Online
          </span>
        </div>
      </div>
    </div>
  </header>

  <!-- GAVETA DO MENU LATERAL -->
  <div id="menu-lateral" class="fixed inset-y-0 left-0 w-72 bg-slate-900 border-r border-slate-800 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
    <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
      <div class="flex items-center gap-3">
        <img id="menu-foto" src="https://ui-avatars.com/api/?name=Usuario" class="w-10 h-10 rounded-full object-cover border border-emerald-500">
        <div>
          <h3 id="menu-nome" class="font-bold text-white text-xs">Carregando...</h3>
          <p id="menu-tipo" class="text-[10px] text-slate-400">-</p>
        </div>
      </div>
      <button onclick="toggleMenuLateral()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>

    <div class="flex-1 p-3 space-y-2 overflow-y-auto">
      <a href="index.html" class="w-full flex items-center gap-3 p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-slate-200 font-bold transition">
        <i class="fa-solid fa-house text-emerald-400 w-5"></i> Mapa / Início
      </a>
      <a href="corridas.html" class="w-full flex items-center gap-3 p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-slate-200 font-bold transition">
        <i class="fa-solid fa-clock-rotate-left text-amber-400 w-5"></i> Histórico
      </a>
      <a href="perfil.html" class="w-full flex items-center gap-3 p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-slate-200 font-bold transition">
        <i class="fa-solid fa-user text-sky-400 w-5"></i> Meu Perfil
      </a>
    </div>

    <div class="p-4 border-t border-slate-800">
      <button onclick="sairConta()" class="w-full bg-red-950/40 text-red-400 font-bold py-2.5 rounded-xl border border-red-800 hover:bg-red-900/40 transition">
        Sair da Conta
      </button>
    </div>
  </div>

  <main class="flex-1 overflow-y-auto relative flex flex-col">
    <div id="modulo-inicio" class="flex-1 flex flex-col relative h-full bg-slate-900">
      
      <!-- Botão ligar motorista (se for motorista) -->
      <div id="painel-botao-ligar" class="absolute bottom-28 inset-x-0 flex justify-center z-30 hidden">
        <button id="btn-ligar-motorista" onclick="tentarLigarMotorista()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold px-8 py-4 rounded-full shadow-2xl flex items-center gap-3 text-sm transition-all duration-300 border-2 border-emerald-400">
          <i class="fa-solid fa-power-off text-lg"></i> LIGAR APP (FICAR ONLINE)
        </button>
      </div>

      <!-- Bloco busca passageiro (se for passageiro) -->
      <div id="bloco-passageiro-busca" class="absolute bottom-4 inset-x-4 bg-slate-900/95 backdrop-blur border border-slate-800 p-4 rounded-2xl space-y-3 shadow-2xl z-30 hidden">
        <div class="flex items-center gap-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
          <i class="fa-solid fa-location-dot text-emerald-400"></i>
          <input type="text" placeholder="Local de embarque" class="bg-transparent w-full text-xs text-slate-100 focus:outline-none">
        </div>
        <div class="flex items-center gap-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
          <i class="fa-solid fa-location-pin text-amber-400"></i>
          <input type="text" placeholder="Para onde vamos?" class="bg-transparent w-full text-xs text-slate-100 focus:outline-none">
        </div>
        <button id="btn-chamar-corrida" onclick="tentarChamarCorrida()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs transition-all duration-300">Chamar Motorista</button>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://mmcwmzesjtnqgpcdspir.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tY3dtemVzanRucWdwY2RzcGlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NTgyMzUsImV4cCI6MjExMDAzNDIzNX0.VfOyJpZ5Xl30CvLtP-ZpAl1BO1ijVU8ChpabOPmel-E';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let usuarioLogado = null;

    async function inicializarApp() {
      const motoristaStorage = localStorage.getItem('motorista_logado');
      const passageiroStorage = localStorage.getItem('passageiro_logado');

      if (motoristaStorage) {
        usuarioLogado = JSON.parse(motoristaStorage);
        document.getElementById('painel-botao-ligar').classList.remove('hidden');
        document.getElementById('menu-tipo').innerText = "Motorista Parceiro";
      } else if (passageiroStorage) {
        usuarioLogado = JSON.parse(passageiroStorage);
        document.getElementById('bloco-passageiro-busca').classList.remove('hidden');
        document.getElementById('menu-tipo').innerText = "Passageiro";
      } else {
        window.location.href = 'auth.html';
        return;
      }

      // Consulta o status atualizado no banco de dados
      try {
        const { data } = await supabaseClient.from('usuarios').select('*').eq('id', usuarioLogado.id).single();
        if (data) usuarioLogado = data;
      } catch (e) {
        console.error("Erro ao verificar status:", e);
      }

      document.getElementById('menu-nome').innerText = usuarioLogado.nome || 'Usuário';
      document.getElementById('menu-foto').src = usuarioLogado.foto_url || 'https://ui-avatars.com/api/?name=Usuario';

      // Se a conta estiver bloqueada ou pendente (em análise), exibe o aviso
      if (usuarioLogado.status === 'bloqueado' || usuarioLogado.status === 'pendente') {
        document.getElementById('banner-bloqueio').classList.remove('hidden');
      }
    }

    function dispararAlertaBloqueioVisual() {
      const banner = document.getElementById('banner-bloqueio');
      const btn = usuarioLogado.veiculo_modelo ? document.getElementById('btn-ligar-motorista') : document.getElementById('btn-chamar-corrida');
      
      // Efeito piscando em vermelho por 3 segundos
      banner.classList.add('bg-red-600', 'animate-pulse');
      if (btn) {
        btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
        btn.classList.add('bg-red-600', 'animate-bounce');
      }

      setTimeout(() => {
        banner.classList.remove('bg-red-600', 'animate-pulse');
        if (btn) {
          btn.classList.remove('bg-red-600', 'animate-bounce');
          btn.classList.add('bg-emerald-600');
        }
      }, 3000);
    }

    function tentarLigarMotorista() {
      if (usuarioLogado.status === 'bloqueado' || usuarioLogado.status === 'pendente') {
        dispararAlertaBloqueioVisual();
        return;
      }
      alert("Você está online e visível para os passageiros!");
    }

    function tentarChamarCorrida() {
      if (usuarioLogado.status === 'bloqueado' || usuarioLogado.status === 'pendente') {
        dispararAlertaBloqueioVisual();
        return;
      }
      alert("Procurando motorista parceiro próximo...");
    }

    async function abrirSuporteBloqueio() {
      const msg = prompt("Descreva o motivo do contato com o suporte:");
      if (!msg) return;

      const { error } = await supabaseClient.from('chamados_suporte').insert([{
        usuario_id: usuarioLogado.id,
        usuario_nome: usuarioLogado.nome,
        mensagem: msg,
        status: 'pendente'
      }]);

      if (error) {
        alert("Erro ao enviar chamado: " + error.message);
      } else {
        alert("Solicitação enviada ao suporte administrativo com sucesso!");
      }
    }

    function toggleMenuLateral() {
      document.getElementById('menu-lateral').classList.toggle('-translate-x-full');
    }

    function sairConta() {
      localStorage.removeItem('passageiro_logado');
      localStorage.removeItem('motorista_logado');
      window.location.href = 'auth.html';
    }

    window.onload = inicializarApp;
  </script>
</body>
</html>
