<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mobilidade Laguna - Passageiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Leaflet CSS e JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden m-0 p-0 text-xs">

  <!-- BANNER DE CONTA SUSPENSA / BLOQUEADA -->
  <div id="banner-bloqueio" class="hidden bg-red-950/90 border-b border-red-600 p-3 flex flex-col gap-2 shrink-0 z-50 transition-all duration-300">
    <div class="flex items-center gap-2 text-red-300">
      <i class="fa-solid fa-triangle-exclamation text-base animate-bounce"></i>
      <div class="flex-1">
        <h4 class="font-extrabold text-white text-xs">Atenção: Conta Suspensa Temporariamente</h4>
        <p class="text-[10px] text-red-200">Seu acesso para corridas está restrito. Entre em contato com o suporte.</p>
      </div>
      <button onclick="abrirSuporteBloqueio()" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-xl font-bold text-[11px] shadow">
        Suporte
      </button>
    </div>
  </div>

  <!-- TOPO DO APP -->
  <header class="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center shrink-0 z-40">
    <div class="flex items-center gap-3">
      <button onclick="toggleMenuLateral()" class="text-slate-300 hover:text-white p-2 rounded-xl bg-slate-800 border border-slate-700">
        <i class="fa-solid fa-bars text-sm"></i>
      </button>
      <div class="flex items-center gap-2">
        <div class="bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 p-2 rounded-xl">
          <i class="fa-solid fa-user text-sm"></i>
        </div>
        <div>
          <h1 class="text-sm font-extrabold text-white">Mobilidade Laguna</h1>
          <span class="text-[10px] text-emerald-400 font-bold flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span> Online
          </span>
        </div>
      </div>
    </div>
    <span class="text-[9px] text-slate-600 font-mono pr-1">v18</span>
  </header>

  <!-- GAVETA DO MENU LATERAL -->
  <div id="menu-lateral" class="fixed inset-y-0 left-0 w-72 bg-slate-900 border-r border-slate-800 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
    <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
      <div class="flex items-center gap-3">
        <img id="menu-foto" src="https://ui-avatars.com/api/?name=Passageiro" class="w-10 h-10 rounded-full object-cover border border-emerald-500">
        <div>
          <h3 id="menu-nome" class="font-bold text-white text-xs">Carregando...</h3>
          <p class="text-[10px] text-slate-400">Passageiro</p>
        </div>
      </div>
      <button onclick="toggleMenuLateral()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>

    <div class="flex-1 p-3 space-y-2 overflow-y-auto">
      <a href="index.html" class="w-full flex items-center gap-3 p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-slate-200 font-bold transition">
        <i class="fa-solid fa-house text-emerald-400 w-5"></i> Mapa / Início
      </a>
      <a href="historico.html" class="w-full flex items-center gap-3 p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-slate-200 font-bold transition">
        <i class="fa-solid fa-clock-rotate-left text-amber-400 w-5"></i> Histórico de Viagens
      </a>
      <a href="perfil.html" class="w-full flex items-center gap-3 p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-slate-200 font-bold transition">
        <i class="fa-solid fa-user text-sky-400 w-5"></i> Meu Perfil
      </a>
    </div>

    <div class="p-4 border-t border-slate-800">
      <button onclick="sairConta()" class="w-full bg-red-950/40 text-red-400 font-bold py-2.5 rounded-xl border border-red-800 hover:bg-red-900/40 transition">
        Sair da Conta
      </button>
    </div>
  </div>

  <!-- CONTEÚDO PRINCIPAL ONDE O MAPA.HTML SERÁ INJETADO -->
  <main id="main-app" class="flex-1 overflow-hidden relative flex flex-col bg-slate-950">
    <div id="map-loader" class="flex-1 flex flex-col justify-center items-center text-slate-500 gap-3">
      <i class="fa-solid fa-map-location-dot text-4xl animate-pulse"></i>
      Carregando mapa em Laguna...
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://mmcwmzesjtnqgpcdspir.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tY3dtemVzanRucWdwY2RzcGlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NTgyMzUsImV4cCI6MjExMDAzNDIzNX0.VfOyJpZ5Xl30CvLtP-ZpAl1BO1ijVU8ChpabOPmel-E';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let usuarioLogado = null;
    let intervaloHeartbeat = null;

    async function inicializarApp() {
      const passageiroStorage = localStorage.getItem('passageiro_logado');
      const motoristaStorage = localStorage.getItem('motorista_logado');

      if (motoristaStorage) {
         window.location.href = 'motorista.html';
         return;
      } else if (passageiroStorage) {
        usuarioLogado = JSON.parse(passageiroStorage);
        iniciarHeartbeatOnline();
      } else {
        window.location.href = 'auth.html';
        return;
      }

      try {
        const { data } = await supabaseClient.from('usuarios').select('*').eq('id', usuarioLogado.id).single();
        if (data) usuarioLogado = data;
      } catch (e) {}

      document.getElementById('menu-nome').innerText = usuarioLogado.nome || 'Passageiro';
      document.getElementById('menu-foto').src = usuarioLogado.foto_url || 'https://ui-avatars.com/api/?name=Passageiro';

      if (usuarioLogado.status === 'bloqueado' || usuarioLogado.status === 'pendente') {
        document.getElementById('banner-bloqueio').classList.remove('hidden');
      }

      carregarModuloMapa();
    }

    // CARREGA O MAPA.HTML E EXECUTA OS SCRIPTS DINAMICAMENTE
    async function carregarModuloMapa() {
      const mainApp = document.getElementById('main-app');
      try {
        const response = await fetch('mapa.html');
        if (!response.ok) throw new Error('Falha ao carregar mapa');
        const htmlMapa = await response.text();
        
        mainApp.innerHTML = htmlMapa;

        // Extrai e executa as tags <script> contidas no mapa.html dinamicamente
        const scripts = mainApp.querySelectorAll('script');
        scripts.forEach(scriptAntigo => {
          const novoScript = document.createElement('script');
          if (scriptAntigo.src) {
            novoScript.src = scriptAntigo.src;
          } else {
            novoScript.textContent = scriptAntigo.textContent;
          }
          document.body.appendChild(novoScript);
          scriptAntigo.remove();
        });

      } catch (error) {
        console.error(error);
        mainApp.innerHTML = '<div class="flex-1 flex justify-center items-center text-red-400">Erro ao carregar o módulo do mapa.</div>';
      }
    }

    function iniciarHeartbeatOnline() {
      if (!usuarioLogado || !usuarioLogado.id) return;
      const atualizarPresenca = async (statusOnline) => {
        try {
          await supabaseClient.from('usuarios').update({ online: statusOnline }).eq('id', usuarioLogado.id);
        } catch (err) {}
      };
      atualizarPresenca(true);
      intervaloHeartbeat = setInterval(() => atualizarPresenca(true), 15000);
      window.addEventListener('beforeunload', () => {
        supabaseClient.from('usuarios').update({ online: false }).eq('id', usuarioLogado.id);
      });
    }

    function toggleMenuLateral() {
      document.getElementById('menu-lateral').classList.toggle('-translate-x-full');
    }

    function abrirSuporteBloqueio() {
      alert("Entre em contato com o suporte através do chat administrativo.");
    }

    async function sairConta() {
      if (usuarioLogado && usuarioLogado.id) {
        try { await supabaseClient.from('usuarios').update({ online: false }).eq('id', usuarioLogado.id); } catch(e) {}
      }
      clearInterval(intervaloHeartbeat);
      localStorage.clear();
      window.location.href = 'auth.html';
    }

    window.onload = inicializarApp;
  </script>
</body>
</html>
